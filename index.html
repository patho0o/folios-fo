<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#465264">
<script>
// Tema: 'auto' sigue al teléfono; 'claro' u 'oscuro' lo fijan. Se guarda en este teléfono.
function aplicarTema(){
  let t = 'auto'; try{ t = JSON.parse(localStorage.getItem('fo.tema')) || 'auto'; }catch(e){}
  const oscuro = t === 'oscuro' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.tema = oscuro ? 'oscuro' : 'claro';
  document.querySelector('meta[name=theme-color]').content = oscuro ? '#2b2d32' : '#465264';
  let g = false; try{ g = JSON.parse(localStorage.getItem('fo.letra')) === 'grande'; }catch(e){}
  document.documentElement.style.zoom = g ? '1.12' : '';
}
aplicarTema(); matchMedia('(prefers-color-scheme: dark)').addEventListener('change', aplicarTema);
</script>
<title>NODO</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">

<style>
/* Colores: todo sale de estas variables. El tema oscuro solo las cambia. */
:root{color-scheme:light;--azul:#1f5f99;--azul2:#eef3f8;--txt:#1c2127;--gris:#6f7882;--borde:#d5dbe3;--linea:#e8ecf0;--fondo:#e4e8ee;--sup:#fbfcfd;--campo:#fff;--hd:#465264;--hdtx:#fff;--hdbt:rgba(255,255,255,.14);--hdbo:rgba(255,255,255,.22);--hdln:#465264;
  --ok:#1e8449;--warn:#a85d00;--err:#b8382b;--sobre:#fff;--okbg:#e3f4ea;--warnbg:#fff4d6;--warntx:#6b4a00;--errbg:#fde8e6;--sugbg:#f1f7f2;--sugtx:#24613a;--wabg:#f6f8f6;--conbg:#fffbea;--mapa:#e9edf0;--tenue:#b3bac2;
  --sombra:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.04);--foco:rgba(31,95,153,.12)}
:root[data-tema="oscuro"]{color-scheme:dark;--azul:#6aa9e6;--azul2:#1c2f44;--txt:#e7eaee;--gris:#98a2ad;--borde:#3a3d43;--linea:#2e3135;--fondo:#1c1d20;--sup:#26282c;--campo:#202226;--hd:#2b2d32;--hdtx:#e7eaee;--hdbt:rgba(255,255,255,.08);--hdbo:#3a3d43;--hdln:#3a3d43;
  --ok:#2f9e5f;--warn:#e0a03a;--err:#e5695b;--sobre:#fff;--okbg:#153524;--warnbg:#3a2e12;--warntx:#f0cf85;--errbg:#3d1c18;--sugbg:#16291d;--sugtx:#9ed3b0;--wabg:#141c17;--conbg:#332b10;--mapa:#222428;--tenue:#56606b;
  --sombra:0 0 0 1px #2e3135;--foco:rgba(106,169,230,.22)}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--fondo);color:var(--txt);font-size:16px}
a{color:var(--azul)}
header{position:sticky;top:0;z-index:5;background:var(--hd);color:var(--hdtx);border-bottom:1px solid var(--hdln);padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));display:flex;align-items:center;gap:10px}
header h1{font-size:17px;font-weight:650;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
header button{background:var(--hdbt);color:var(--hdtx);border:1px solid var(--hdbo);border-radius:999px;padding:6px 12px;font-size:13px}
#btnAjustes{width:36px;height:36px;padding:0;border-radius:50%;font-size:17px;flex:none;position:relative}
#btnAjustes.aviso::after{content:"";position:absolute;top:-1px;right:-1px;width:11px;height:11px;border-radius:50%;background:var(--err);border:2px solid var(--hd)}
#btnAtras{width:36px;height:36px;padding:0 0 3px;border-radius:50%;font-size:24px;line-height:1;flex:none;display:flex;align-items:center;justify-content:center}
.banner{padding:8px 16px;font-size:14px}
.banner.demo{background:var(--warnbg);color:var(--warntx)}
.banner.off{background:var(--errbg);color:var(--err)}
main{padding:12px 12px 110px;max-width:640px;margin:0 auto}
.card{background:var(--sup);border:0;box-shadow:var(--sombra);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 10px;color:var(--txt);font-weight:650}
details.card>summary{font-weight:650;color:var(--txt);font-size:15px;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:8px}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:"⌄";color:var(--gris);font-size:16px}
details.card[open]>summary::after{content:"⌃"}
details.card[open]>summary{margin-bottom:10px}
summary .cnt{font-weight:400;color:var(--gris);font-size:13px;margin-left:auto}
label{display:block;font-size:12.5px;color:var(--gris);margin:12px 0 5px}
label .req{color:var(--err)}
input,select,textarea{width:100%;font-size:16px;padding:11px 12px;border:1px solid var(--borde);border-radius:10px;background:var(--campo);color:var(--txt);font-family:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--azul);background:var(--sup);box-shadow:0 0 0 3px var(--foco)}
textarea{min-height:80px;resize:vertical}
.selbtn{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;font-size:16px;padding:11px 12px;border:1px solid var(--borde);border-radius:10px;background:var(--campo);color:var(--txt);font-family:inherit;cursor:pointer}
.selbtn .ch{color:var(--gris);font-size:18px}
.row{display:flex;gap:8px;align-items:flex-end}
.row>*{flex:1;min-width:0}
.btn{display:block;width:100%;padding:13px;border-radius:12px;border:0;font-size:16px;font-weight:600;background:var(--azul);color:var(--sobre);margin-top:10px;cursor:pointer}
:root[data-tema="oscuro"] .btn,:root[data-tema="oscuro"] .accion{background:#2a6db0}
.btn.sec,:root[data-tema="oscuro"] .btn.sec{background:var(--sup);color:var(--txt);border:1px solid var(--borde)}

.btn.verde,:root[data-tema="oscuro"] .btn.verde{background:var(--ok)}

.item .x{border:0;background:none;color:var(--gris);font-size:20px;width:32px;height:40px;cursor:pointer}
.step{display:flex;align-items:center;gap:4px}
.step button{width:40px;height:40px;border-radius:8px;border:1px solid var(--borde);background:var(--sup);color:var(--txt);font-size:20px;line-height:1;cursor:pointer}
.step input{width:60px;text-align:center;padding:8px 4px}
.step.m input{width:84px}
.item.con .step input{background:var(--conbg);font-weight:600}
.vacio{font-size:14px;color:var(--gris);padding:6px 0}
.sug{background:var(--sugbg);border-radius:8px;padding:8px 10px;font-size:13px;color:var(--sugtx);margin-bottom:6px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--sup);border-top:1px solid var(--borde);box-shadow:0 -2px 8px rgba(16,24,40,.04);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;z-index:6}
.bar .btn{margin:0}
.lista .f{display:flex;justify-content:space-between;gap:8px;align-items:center}
.estado{font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;white-space:nowrap}
.estado.pendiente{background:var(--warnbg);color:var(--warntx)}.estado.enviado{background:var(--okbg);color:var(--ok)}.estado.error{background:var(--errbg);color:var(--err)}
pre.wa{white-space:pre-wrap;font-family:inherit;font-size:14px;background:var(--wabg);border-radius:8px;padding:12px;margin:0;max-height:50vh;overflow:auto}
.big{font-size:26px;font-weight:700}
.kpis{display:flex;gap:8px}.kpis .card{flex:1;text-align:center;margin:0;padding:12px}
.toast{pointer-events:none;position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top));transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;z-index:40;max-width:90%}
.hidden{display:none!important}
/* inicio */

.accion{display:flex;align-items:center;gap:12px;width:100%;border:0;border-radius:16px;background:var(--azul);color:var(--sobre);padding:18px;font-size:18px;font-weight:650;cursor:pointer;margin-bottom:12px;text-align:left}

.menu{background:var(--sup);border-radius:14px;box-shadow:var(--sombra);overflow:hidden;margin-bottom:12px}

.mi .tx{flex:1;min-width:0}.mi .tx b{display:block;font-size:15px;font-weight:600}.mi .tx small{display:block;font-size:12.5px;color:var(--gris);margin-top:1px}
.mi .ch{color:var(--tenue);font-size:20px}
.mi .num{background:var(--azul2);color:var(--azul);border-radius:999px;font-size:12px;font-weight:700;padding:2px 9px}

.seccion{font-size:12px;font-weight:650;color:var(--gris);text-transform:uppercase;letter-spacing:.05em;margin:18px 4px 8px}
.pie{font-size:12px;color:var(--gris);text-align:center;margin:18px 0 4px}
/* ventanas */
.modal{position:fixed;inset:0;z-index:30;background:var(--sup);display:flex;flex-direction:column}

.modal .mpie .btn{margin:0}
.pick{display:flex;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid var(--linea);cursor:pointer}
.pick .ck{width:24px;height:24px;border-radius:6px;border:2px solid var(--borde);display:flex;align-items:center;justify-content:center;color:var(--sobre);font-size:15px;flex:none}

details.gr[open]>summary::after{content:"▴"}
details.gr .cnt{margin-left:auto;font-weight:400;font-size:13px;color:var(--gris)}
/* ventana flotante (mapa) */
.velo{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:12px}

.modal.flot .mpie{border-top:0;padding-top:4px}
/* mapa (los mosaicos son claros: sus letreros se quedan en claro en los dos temas) */
.mv{flex:1;position:relative;overflow:hidden;background:var(--mapa);touch-action:none;cursor:crosshair}
.mv img{position:absolute;width:256px;height:256px;user-select:none;-webkit-user-drag:none;pointer-events:none}
.mv svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.mv .pin{position:absolute;width:30px;height:40px;margin:-40px 0 0 -15px;pointer-events:none;z-index:1;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
.mv svg.pin{inset:auto}
.mv .yo{position:absolute;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:#1a73e8;border:3px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.2),0 0 0 8px rgba(26,115,232,.18);pointer-events:none;z-index:1}

.mzoom{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px;z-index:2}

.mattr{position:absolute;right:4px;bottom:2px;font-size:10px;color:#555;background:rgba(255,255,255,.7);padding:1px 4px;z-index:2}
.minfo{padding:10px 12px;font-size:14px;border-top:1px solid var(--borde)}
video.qr{width:100%;border-radius:12px;background:#000;max-height:60vh;object-fit:cover}
.marca{display:flex;align-items:center;gap:14px;margin:18px 4px 16px}.marca img{width:64px;height:64px;border-radius:16px;box-shadow:0 2px 8px rgba(0,0,0,.25)}.marca b{display:block;font-size:26px;letter-spacing:3px}.marca span{color:var(--gris);font-size:13px}
.fotos3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

.fslot img{border-style:solid}
.fslot.ver{cursor:default}
.qrcaja{position:relative}.qrmarco{position:absolute;inset:18% 22%;border:3px solid rgba(255,255,255,.85);border-radius:14px;box-shadow:0 0 0 999px rgba(0,0,0,.25);pointer-events:none}
.horaGrande{font-size:44px;font-weight:700;text-align:center;letter-spacing:2px}
.horaGrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.horaGrid button{padding:10px 0;border-radius:10px;border:1px solid var(--borde);background:var(--campo);color:var(--txt);font-size:16px}
.horaGrid button.on{background:var(--azul);border-color:var(--azul);color:#fff;font-weight:700}
#qrLuz.on{background:#ffe14d;color:#222}
.fotoDoc{width:100%;max-height:40vh;object-fit:contain;border-radius:10px;background:#000;display:block}
.grupoDoc{border-top:1px solid var(--linea)}.grupoDoc>summary{display:flex;justify-content:space-between;align-items:center;padding:12px 2px;cursor:pointer;list-style:none}
.grupoDoc>summary::before{content:'▸';margin-right:8px;color:var(--gris);transition:transform .15s}.grupoDoc[open]>summary::before{transform:rotate(90deg)}
.grupoDoc>summary b{flex:1}.grupoDoc>summary span{color:var(--gris);font-size:13px;background:var(--fondo);border-radius:999px;padding:2px 10px}
.grupoDoc.sub{margin-left:14px}.grupoDoc.sub>summary{padding:10px 2px;font-size:14px}.grupoDoc.sub>summary b{font-weight:500}
.item.sinStock .step input{border-color:var(--warn);background:var(--warnbg);color:var(--warntx)}
.cpo{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--linea)}.cpo .nom{flex:1}.cpo .nom small{display:block;color:var(--gris);font-size:12px}
.cpo .step{display:flex;align-items:center;gap:8px}.cpo .step button{width:46px;height:46px;border-radius:12px;border:1px solid var(--borde);background:var(--campo);color:var(--txt);font-size:22px}
.cpo .step button.mas{background:var(--azul);border-color:var(--azul);color:#fff}.cpoN{min-width:36px;text-align:center;font-size:20px}
.tablero{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}

.matq b{font-size:22px}.matq span{font-size:13px}.matq small{font-size:11.5px;color:var(--gris);min-height:14px}
.matq.bajo{border-color:var(--err)}.matq.bajo b,.matq.bajo small{color:var(--err)}
.segm{display:flex;gap:4px;background:var(--sup);border-radius:999px;padding:4px;margin-bottom:12px;box-shadow:var(--sombra);position:sticky;top:58px;z-index:4}
.segm button{flex:1;border:0;background:none;color:var(--gris);font-size:13px;padding:9px 4px;border-radius:999px;white-space:nowrap}
.segm button.on{background:var(--azul);color:#fff;font-weight:650}:root[data-tema="oscuro"] .segm button.on{background:#2a6db0}
.pasos{display:flex;gap:2px;margin:0 0 12px;position:sticky;top:58px;z-index:4;background:var(--fondo);padding:6px 0}
.pasos button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;color:var(--gris);font-size:11.5px;padding:2px 0;position:relative}
.pasos button i{font-style:normal;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--sup);border:1.5px solid var(--borde);font-size:13px;font-weight:700;z-index:1}
.pasos button::before{content:"";position:absolute;top:15px;left:-50%;width:100%;height:2px;background:var(--borde)}.pasos button:first-child::before{display:none}
.pasos button.on{color:var(--txt);font-weight:650}.pasos button.on i{background:var(--azul);border-color:var(--azul);color:#fff}
.pasos button.ok i{background:var(--ok);border-color:var(--ok);color:#fff}.pasos button.ok::before,.pasos button.on::before{background:var(--ok)}
:root[data-tema="oscuro"] .pasos button.on i{background:#2a6db0;border-color:#2a6db0}
/* indicadores de carga */
#carga{position:absolute;left:0;right:0;bottom:-1px;height:3px;overflow:hidden;opacity:0;transition:opacity .2s;pointer-events:none}
#carga.si{opacity:1}
#carga::before{content:"";position:absolute;top:0;bottom:0;width:40%;left:-40%;background:linear-gradient(90deg,transparent,#7fb2ff,#2bea5a,transparent);animation:carga 1.1s ease-in-out infinite}
@keyframes carga{to{left:100%}}
#btnSync .gira{display:inline-block}
#btnSync.girando .gira{animation:gira .9s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
button.ocupado::before{content:"";display:inline-block;width:14px;height:14px;margin-right:8px;vertical-align:-2px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:gira .8s linear infinite}
#app.entra{animation:entra .18s ease-out}
.modal{animation:sube .2s ease-out}
@keyframes entra{from{opacity:.35;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes sube{from{opacity:.4;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#carga::before,#btnSync.girando .gira,button.ocupado::before,#app.entra,.modal{animation:none}}

function ventana(titulo, cuerpo, pie, flotante){
  const o = document.createElement('div'); o.className = flotante ? 'modal flot' : 'modal';
  const html = `<div class="mtop"><b>${esc(titulo)}</b><button data-cerrar>Cerrar</button></div>${cuerpo}${pie?`<div class="mpie">${pie}</div>`:''}`;
  let velo = null;
  if(flotante){ velo = document.createElement('div'); velo.className = 'velo'; o.innerHTML = html; velo.appendChild(o); document.body.appendChild(velo); }
  else { o.innerHTML = html; document.body.appendChild(o); }
  const raiz = velo || o;
  abrirModal(() => { o.dispatchEvent(new Event('cerrar')); raiz.remove(); });
  const cerrar = () => { if(raiz.isConnected) history.back(); };
  o.querySelector('[data-cerrar]').onclick = cerrar;
  if(velo) velo.addEventListener('click', e => { if(e.target === velo) cerrar(); });   // tocar fuera del recuadro lo cierra
  return {o, cerrar};
}

/* ===== Cluster por coordenadas ===== */
function dentro(lon, lat, p){ let c=false; for(let i=0,j=p.length-1;i<p.length;j=i++){ const [x1,y1]=p[i],[x2,y2]=p[j]; if((y1>lat)!==(y2>lat) && lon < (x2-x1)*(lat-y1)/(y2-y1)+x1) c=!c; } return c; }
function distKm(a,b,c,d){ const R=6371, r=Math.PI/180, x=(d-b)*r*Math.cos((a+c)/2*r), y=(c-a)*r; return Math.sqrt(x*x+y*y)*R; }
function clusterDe(lat, lon){
  for(const z of CLUSTERS_GEO) if(dentro(lon, lat, z.p)) return {cluster:z.cluster, zona:z.zona, km:0};
  let best=null;
  for(const z of CLUSTERS_GEO) for(const [x,y] of z.p){ const k=distKm(lat,lon,y,x); if(!best||k<best.km) best={cluster:z.cluster, zona:z.zona, km:k}; }
  return best && best.km <= 3 ? best : null;
}
/* Plus Codes de Google ("MQRJ+V4F" o "75FCMQRJ+V4F"). Los cortos se completan con la zona de trabajo (Puerto Vallarta). */
const OLC = '23456789CFGHJMPQRVWX', OLC_RES = [20, 1, 0.05, 0.0025, 0.000125];
function olcCodificar(la, lo){
  let a = Math.min(Math.max(la, -90), 89.9999999) + 90, b = ((lo + 180) % 360 + 360) % 360, c = '';
  OLC_RES.forEach(r => { const x = Math.floor(a / r), y = Math.floor(b / r); a -= x * r; b -= y * r; c += OLC[x] + OLC[y]; });
  return c.slice(0, 8) + '+' + c.slice(8);
}
function olcDecodificar(code){                  // código completo → centro de su cuadro
  const d = code.replace('+', '').replace(/0+$/, ''); let la = -90, lo = -180, ra = 20, rb = 20;
  for(let i = 0; i < Math.min(d.length, 10); i += 2){ const r = OLC_RES[i / 2]; ra = rb = r;
    la += OLC.indexOf(d[i]) * r; if(d[i + 1]) lo += OLC.indexOf(d[i + 1]) * r; }
  for(let i = 10; i < d.length; i++){ const v = OLC.indexOf(d[i]); ra /= 5; rb /= 4; la += Math.floor(v / 4) * ra; lo += (v % 4) * rb; }
  return [la + ra / 2, lo + rb / 2];
}
function plusCode(s){
  const m = String(s || '').toUpperCase().match(/(?:^|[^0-9A-Z])([23456789CFGHJMPQRVWX]{2,8}\+[23456789CFGHJMPQRVWX]{0,3})(?![0-9A-Z])/);
  if(!m) return null;
  const code = m[1], pos = code.indexOf('+');
  if(pos === 8) return olcDecodificar(code);
  if(pos % 2 || pos < 2) return null;
  const [rLa, rLo] = CENTRO_MAPA, falta = 8 - pos, res = Math.pow(20, 2 - falta / 2), med = res / 2;
  let [la, lo] = olcDecodificar(olcCodificar(rLa, rLo).replace('+', '').slice(0, falta) + code);
  if(rLa + med < la && la - res >= -90) la -= res; else if(rLa - med > la && la + res <= 90) la += res;
  if(rLo + med < lo) lo -= res; else if(rLo - med > lo) lo += res;
  return [la, lo];
}
function parseCoords(s){
  const pc = plusCode(s); if(pc) return pc;
  const m = String(s||'').replace(/[°º]/g, ' ').match(/(-?\d{1,3}(?:\.\d+)?)\s*[,;\s]\s*(-?\d{1,3}(?:\.\d+)?)/);
  if(!m) return null; const la = parseFloat(m[1]), lo = parseFloat(m[2]);
  return Math.abs(la) <= 90 && Math.abs(lo) <= 180 && (la || lo) ? [la, lo] : null;
}
const coordsTexto = c => c ? `${c[0].toFixed(6)}, ${c[1].toFixed(6)}` : '';
// En cualquier campo de coordenadas: lo que se pegue (grados, Plus Code, liga de Maps) se convierte a "lat, lng" antes de usarse
document.addEventListener('change', e => {
  const el = e.target; if(!el.matches || !el.matches('#fCoord,#dCoord,#iCoord,[data-m^="coord"]')) return;
  const c = parseCoords(el.value), t = coordsTexto(c);
  if(c && t !== el.value.trim()){ if(plusCode(el.value)) toast('Plus Code convertido a ' + t); el.value = t; }
}, true);

let enCurso = 0, relojCarga = 0;               // barra delgada bajo el encabezado mientras hay algo yendo al servidor
function cargando(d){
  enCurso = Math.max(0, enCurso + d); const b = document.getElementById('carga'); if(!b) return;
  if(enCurso && !relojCarga) relojCarga = setTimeout(() => { relojCarga = 0; if(enCurso) b.classList.add('si'); }, 300);
  if(!enCurso){ clearTimeout(relojCarga); relojCarga = 0; b.classList.remove('si'); }
}
new MutationObserver(ms => ms.forEach(m => {    // botón deshabilitado con "…" (Guardando…, Enviando…) muestra un círculo girando

})).observe(document.body, {subtree:true, attributes:true, attributeFilter:['disabled'], childList:true, characterData:true});
async function api(accion, datos, cred){
  if(esDemoUser()){
    if(SIMULADO[accion]){ await new Promise(r => setTimeout(r, 150)); return {ok: true, ...SIMULADO[accion](datos || {})}; }
    if(NO_EN_DEMO.includes(accion)) throw new Error('Usuario de demostración: esto no se guarda.');
  }
  cred = cred || {id: USER && USER.id, pin: USER && USER.pin};
  const ctl = new AbortController(), reloj = setTimeout(() => ctl.abort(), ESPERA_SERVIDOR);
  let r; cargando(1);
  try{
    r = await fetch(API_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, signal: ctl.signal,
      body: JSON.stringify({accion, usuario:cred.id, pin:cred.pin, version:APP_VERSION, ...datos})});
  }catch(e){ cargando(-1); throw new Error(e.name === 'AbortError' ? 'La señal está muy débil; se reintentará.' : 'No hay conexión con el servidor; se reintentará.'); }
  finally{ clearTimeout(reloj); }
  let j; try{ j = await r.json(); }catch(e){ throw new Error('El servidor respondió algo inesperado; revisa que la implementación esté publicada.'); }
  finally{ cargando(-1); }
  if(!j.ok) throw new Error(j.error || 'Error del servidor'); return j;
}

async function sincronizar(manual, conErrores = true){
  pintarPendientes();
  if(!USER) return;                        // sin sesión no se envía ni se redibuja la pantalla de entrada
  // los que fallaron se reintentan al abrir la app, al volver la señal o con ⟳; el automático de cada minuto solo manda los nuevos
  if(demo()){ if(manual) toast('Modo demo: no hay servidor configurado'); return; }

  if(esAdmin() && proyPorSubir()) subirProy();
  if(invPorSubir()) sincInv();
  if(repPorSubir()) sincRep();
  if(prevPorSubir()) subirPrev();
  if(idrPorSubir()) subirIdr();
  if(REC.marcas.length) sincRec();
  const pend = FOLIOS.filter(f => f.estado === 'pendiente' || (conErrores && f.estado === 'error'));
  if(!navigator.onLine || sincronizando || !pend.length){ if(manual && !pend.length && !docsPorEnviar()) toast('Todo está enviado'); return; }
  sincronizando = true; $('#btnSync').classList.add('girando');
  let ok = 0; const cambiados = new Set();
  for(const f of pend){ const antes = f.estado + f.error;
    try{
      const campos = {}; Object.keys(f.d).forEach(k => { if(!k.startsWith('_')) campos[k] = f.d[k]; });
      const dueno = f.editor || f.usuario || USER.id, pin = dueno === USER.id ? USER.pin : (LS.get('creds', {})[dueno]);
      if(!pin) throw new Error(`Entra con ${nombreDe(dueno)} para enviarlo`);
      const j = await api('guardarFolio', {folio:{id:f.id, version:f.version, campos}}, {id:dueno, pin});
      f.estado='enviado'; f.error=''; ok++;
      if(j.ubicacion && !f.d['UBICACIÓN DEL DAÑO']) f.d['UBICACIÓN DEL DAÑO'] = j.ubicacion;
      if(j.aviso) f.aviso = j.aviso;
    }catch(e){ if(/fue borrado/.test(e.message)){ FOLIOS = FOLIOS.filter(x => x.id !== f.id); cambiados.add(f.id); guardarFolios(); toast(e.message); continue; }
      f.estado='error'; f.error=String(e.message||e);
      if(/PIN incorrecto/.test(f.error) && (f.usuario||USER.id) === USER.id) toast('Tu PIN cambió: toca Salir y vuelve a entrar con el nuevo.'); }
    if(f.estado + f.error !== antes) cambiados.add(f.id);
    guardarFolios();
  }
  sincronizando = false; $('#btnSync').classList.remove('girando');
  if(ok) toast(`${ok} folio(s) enviado(s)`);
  const h = location.hash;                 // redibuja solo si lo que está en pantalla cambió
  if(!MODALES.length && cambiados.size && (h.startsWith('#folios') || h==='' || h==='#' || (h.startsWith('#ver/') && cambiados.has(h.slice(5))))) router();
}

/* Con señal, el servidor revisa el PIN (y bloquea tras varios intentos) y entrega una huella
   para que en este teléfono se pueda volver a entrar sin señal. Sin señal, se compara con esa huella. */
async function entrar(u, pin){
  if(demo()){ if(pin !== '1234') throw new Error('PIN incorrecto'); return {}; }
  const llaves = LS.get('llaves', {});
  if(navigator.onLine){
    try{
      const j = await api('login', {}, {id:u.id, pin});
      llaves[u.id] = {llave:j.llave, sal:j.sal}; LS.set('llaves', llaves);
      return j.usuario;
    }catch(e){ if(!/conexión|señal/i.test(e.message)) throw e; }   // sin respuesta: intenta como sin señal
  }
  const k = llaves[u.id];
  if(!k) throw new Error('La primera vez que entras en este teléfono necesitas señal.');
  if((await sha256(u.id + ':' + pin + ':' + k.sal)) !== k.llave) throw new Error('PIN incorrecto');
  return {};
}

/* ===== Seguimiento de afectaciones masivas (solo ADMIN) =====
   Se pega el mensaje con el que asignan el folio; la app saca folio, OLT, clientes, ingeniero y link.
   Conforme el técnico reporta, se llenan los datos de cada etapa y se copian los 3 mensajes.
   Se guarda en el teléfono y en la hoja MASIVAS del Sheets (para verlo desde otro teléfono). */
let MASIVAS = LS.get('masivas', []);
const guardarMasivas = () => LS.set('masivas', MASIVAS);
function leerAsignacion(txt){
  const t = String(txt||''), m = (re, i = 1) => { const x = t.match(re); return x ? x[i].trim() : ''; };
  const r = {folio: m(/(?:^|\n|\])\s*(?:[^\n:]*:\s*)?(\d{6,9})\s*(?:\n|$)/) || m(/\b(\d{7,9})\b/), olt: m(/OLT\s+([A-Z0-9_]+)/i).toUpperCase(),
    clientesTP: m(/(\d+)\s+clientes?\s+Totalplay/i), clientesEnlace: m(/(\d+)\s+clientes?\s+enlace/i), clientesTFE: m(/(\d+)\s+clientes?\s+TFE/i),
    ingeniero: m(/NOC:\s*(.+?)\s+Link/i), link: m(/(https?:\/\/\S+)/), ticket: '',
    puerto: m(/(?:^|\n)\s*(?:PON\s*:?\s*)?(\d{1,2}\/\d{1,2}\/\d{1,3})\s*(?:\n|$)/i)};   // frame/slot/port
  const tk = t.match(/(\d{4})\/(\d{2})\/(\d{2})\s*\((\d{2}):(\d{2})/); if(tk) r.ticket = `${tk[1]}-${tk[2]}-${tk[3]}T${tk[4]}:${tk[5]}`;
  // hora en que llegó el mensaje, si se copió con el encabezado de WhatsApp: [9:00 p.m., 13/11/2026] o [21:00, 13/11/26]
  const w = t.match(/\[(\d{1,2}):(\d{2})\s*([ap])?\.?\s*m?\.?,\s*(\d{1,2})\/(\d{1,2})\/(\d{2,4})\]/i);
  if(w){ let h = +w[1]; if(w[3]){ const pm = w[3].toLowerCase() === 'p'; if(pm && h < 12) h += 12; if(!pm && h === 12) h = 0; }
    const y = w[6].length === 2 ? '20' + w[6] : w[6]; r.asignacion = `${y}-${w[5].padStart(2,'0')}-${w[4].padStart(2,'0')}T${String(h).padStart(2,'0')}:${w[2]}`; }
  else r.asignacion = ahoraLocal();
  const cl = Object.entries(CFG.clusters||{}).find(([, c]) => (c.olts||[]).includes(r.olt));
  if(cl){ r.cluster = cl[0]; r.ciudad = cl[1].ciudad; r.estado = cl[1].estado; }
  return r;
}

// "45 min", "1 hr 30 min", "1.5 hrs" → [horas, minutos] (minutos de 5 en 5)
function leerEtr(t){
  t = String(t || ''); const h = t.match(/([\d.]+)\s*h/i), mi = t.match(/(\d+)\s*min/i);
  let tot = Math.round(((h ? parseFloat(h[1]) * 60 : 0) + (mi ? +mi[1] : 0)) / 5) * 5; if(t && !tot) tot = 5;
  return [Math.min(12, Math.floor(tot / 60)), tot % 60];
}

/* --- Materiales de la masiva: los más comunes a la vista, el resto en "Más materiales", y "Otros" a mano.
   Mensaje 2 = materiales a utilizar; mensaje 3 = material utilizado (se toma del 2 hasta que se cambie). --- */
const MAT_COMUNES = ['CIERRE 2N', 'CIERRE TIPO MEXFO', 'CIERRE TIPO MINI MEXFO', 'FO 24H', 'FO 96'];   // primero, en este orden
function textoMat(x){
  if(!x) return '';
  const v = x.v || {}, l = [...MAT_COMUNES.map(h => MATERIALES.find(y => y[0] === h)).filter(Boolean), ...MAT_FOLIO.filter(([h]) => !MAT_COMUNES.includes(h))].filter(([h]) => parseFloat(v[h]) > 0).map(([h, n, u]) => `${parseFloat(v[h])}${u === 'm' ? ' m' : ''} ${MAY(n)}`);
  if(x.otros && x.otros.trim()) l.push(MAY(x.otros.trim()));
  return l.join(', ');

function editorMat(n, m){
  const x = (n === 3 ? (m.mat3 || m.mat2) : m.mat2) || {v:{}, otros:''}, v = x.v || {};

  const com = MAT_COMUNES.map(h => MATERIALES.find(x => x[0] === h)).filter(Boolean), resto = MAT_FOLIO.filter(([h]) => !MAT_COMUNES.includes(h));
  const abiertos = resto.some(([h]) => parseFloat(v[h]) > 0);

    <input data-otros placeholder="Otros (ej. 1 MANGA TERMORETRACTIL)" value="${esc(x.otros || (n === 2 && !m.mat2 ? m.materiales || '' : ''))}" autocapitalize="characters" style="margin-top:6px"></div>`;

function activarMat(m, cambio){
  document.querySelectorAll('.matm').forEach(box => {
    const n = +box.dataset.matn;
    const leer = () => {
      const v = {}; box.querySelectorAll('[data-mat]').forEach(i => { const q = parseFloat(i.value); if(q > 0) v[i.dataset.mat] = String(q); i.closest('.item').classList.toggle('con', q > 0); });
      const x = {v, otros: box.querySelector('[data-otros]').value.trim()};
      if(n === 2){ m.mat2 = x;
        if(!m.mat3){ const b3 = document.querySelector('.matm[data-matn="3"]');   // el 3 sigue al 2 mientras no se cambie
          if(b3){ b3.querySelectorAll('[data-mat]').forEach(i => { i.value = v[i.dataset.mat] || ''; i.closest('.item').classList.toggle('con', !!v[i.dataset.mat]); }); b3.querySelector('[data-otros]').value = x.otros; } } }
      else { m.mat3 = x; const h = $('#mMat3H'); if(h) h.textContent = ''; }
      cambio();
    };
    box.addEventListener('input', e => { if(e.target.matches('[data-mat],[data-otros]')){ e.stopPropagation(); leer(); } });
    box.addEventListener('click', e => { const b = e.target.closest('[data-paso]'); if(!b) return;
      const i = b.parentElement.querySelector('input'); i.value = Math.max(0, (parseFloat(i.value) || 0) + +b.dataset.paso) || ''; leer(); });
  });
}

async function subirMasiva(m){
  if(demo() || !navigator.onLine) return;
  try{ await api('guardarMasiva', {masiva: m}); m.subida = m.actualizado; guardarMasivas(); }catch(e){ console.log('masiva', e); }
}
async function bajarMasivas(){
  if(demo() || !navigator.onLine) return;
  try{
    const j = await api('masivas', {});
    j.masivas.forEach(r => { const i = MASIVAS.findIndex(x => x.id === r.id);
      if(i < 0) MASIVAS.push(r); else if((r.actualizado||'') > (MASIVAS[i].actualizado||'')) MASIVAS[i] = r; });
    guardarMasivas();
    MASIVAS.filter(m => m.subida !== m.actualizado).forEach(subirMasiva);   // lo que se cambió sin señal
    if(location.hash === '#masivas' && !MODALES.length) pantallaMasivas(true);
  }catch(e){ console.log('masivas', e); }
}

/* ===== Reporte semanal de material (ADMIN y SUPERVISOR) =====
   El servidor arma el Excel con el formato de GTB ("Sem NN - Pto Vallarta AAAA") con los folios
   cerrados de lunes a domingo; aquí se elige la semana y se descarga. */
function semanaISO(d){ d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const dia = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - dia); const ini = new Date(Date.UTC(d.getUTCFullYear(), 0, 1)); return {anio: d.getUTCFullYear(), semana: Math.ceil(((d - ini) / 864e5 + 1) / 7)}; }
function pantallaReporte(){
  if(!veTodo()){ reemplazar('#'); return; }
  $('#titulo').textContent = 'Reporte semanal';
  const meses = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'], ops = [];
  for(let k = 1; k <= 8; k++){                                   // semana pasada y 7 anteriores
    const d = new Date(Date.now() - k * 7 * 864e5), lun = new Date(d); lun.setDate(d.getDate() - ((d.getDay() + 6) % 7));
    const dom = new Date(lun); dom.setDate(lun.getDate() + 6); const w = semanaISO(d);
    ops.push({...w, txt: `Sem ${w.semana} · ${lun.getDate()} ${meses[lun.getMonth()]} al ${dom.getDate()} ${meses[dom.getMonth()]}${k===1?' (semana pasada)':''}`});
  }
  $('#app').innerHTML = `<div class="card"><h2>Material usado por semana</h2>
    <div class="hint">Folios cerrados de lunes a domingo, en el formato que se entrega cada lunes.</div>
    <label>Semana</label><select id="rSem">${ops.map((o,i) => `<option value="${i}">${esc(o.txt)}</option>`).join('')}</select>
    <button class="btn" id="rGen">Generar reporte</button><div id="rRes"></div></div>`;

  $('#rGen').onclick = async () => {
    const o = ops[+$('#rSem').value], res = $('#rRes'), b = $('#rGen');
    if(demo()){ res.innerHTML = '<div class="hint warn" style="margin-top:10px">En modo demo no hay servidor: aquí aparecería el Excel de la semana.</div>'; return; }
    if(!navigator.onLine){ res.innerHTML = '<div class="hint warn" style="margin-top:10px">Necesitas señal para generar el reporte.</div>'; return; }
    b.disabled = true; b.textContent = 'Generando… (puede tardar unos segundos)'; res.innerHTML = '';
    try{
      const r = await api('reporteSemanal', {anio: o.anio, semana: o.semana});
      const usados = r.totales.filter(t => t[1]);
      res.innerHTML = `<div style="margin-top:12px"><b>${esc(r.nombre)}</b> · ${esc(r.desde)} al ${esc(r.hasta)}<div class="hint">${r.folios} folio(s)</div>
        ${r.sinHoraFinal.length ? `<div class="hint warn">Sin hora final (se tomó la llegada): ${esc(r.sinHoraFinal.join(', '))}</div>` : ''}
        <div class="card" style="margin:10px 0;padding:6px 14px">${usados.length ? usados.map(([n,c]) => `<div class="item"><span class="nom">${esc(n)}</span><b>${c}</b></div>`).join('') : '<div class="vacio">Sin material usado esta semana.</div>'}</div>

/* ===== Documentación de 2N =====
   Cada 2N: QR, capacidad de puertos, brazo y dónde quedó. El administrador carga el KMZ del proyecto
   (sus 2N quedan como pendientes) y descarga el mismo KMZ con lo documentado escrito en cada 2N.
   GTB y póliza solo agregan; cargar y descargar KMZ es solo del administrador. */
const CAPACIDADES_2N = ['1x8', '1x16'];
const RADIO_LIGA = 30;          // m: lo capturado a esta distancia de un 2N pendiente del KMZ se liga a él
const COLOR_DOC = {DOCUMENTADO:'#1f8a4c', PENDIENTE:'#d93025', LOCAL:'#e0a400'};
const ROLES_DOC = ['ADMIN','SUPERVISOR','TECNICO','AUXILIAR','EXTERNO'];
/* ---- Documentación de 2N: reglas compartidas (las usa el servidor y el modo demo de la app) ---- */
const RADIO_CAPA_ = 20;    // m: al cargar un KMZ, un 2N ya documentado a esta distancia de un 2N del KMZ se liga a él
function docNorm_(s) { return String(s || '').toUpperCase().replace(/[\s-]/g, ''); }
function docMetros_(a, b, c, d) { const R = 6371000, r = Math.PI / 180, x = (d - b) * r * Math.cos((a + c) / 2 * r), y = (c - a) * r; return Math.sqrt(x * x + y * y) * R; }
// Guarda una captura en la lista (objetos). Regresa el registro guardado o lanza un error con la explicación.
function docAplicar_(lista, doc, user, ahora) {
  if (!/^[\w-]{6,60}$/.test(String(doc.id || ''))) throw new Error('Registro incompleto');
  const qr = docNorm_(doc.qr), lat = Number(doc.lat), lng = Number(doc.lng), admin = user.rol === 'ADMIN';
  const tipo = ['1N', 'DERIVACION'].indexOf(String(doc.tipo || '')) >= 0 ? String(doc.tipo) : '2N';   // 1N y derivación no llevan QR
  if (!qr && tipo === '2N') throw new Error('Falta el QR');
  if (!isFinite(lat) || !isFinite(lng) || !lat || !lng) throw new Error('Faltan las coordenadas');
  let r = lista.find(x => x.id === doc.id);
  const otro = qr && lista.find(x => x !== r && x.id !== doc.liga && x.estado === 'DOCUMENTADO' && docNorm_(x.qr) === qr);
  if (otro && !(admin && doc.forzar)) throw new Error('El QR ' + qr + ' ya está documentado (' + (otro.quien || '') + ', ' + String(otro.fecha || '').slice(0, 10) + ').');
  if (r && r.estado === 'DOCUMENTADO' && !admin && r.registradoPor !== user.id && (r.empresa || '') !== (user.cuadrilla || '-'))
    throw new Error('Ese 2N ya lo documentó ' + r.quien + '. Solo el administrador puede cambiarlo.');
  if (!r && doc.liga) { const p = lista.find(x => x.id === doc.liga && x.estado === 'PENDIENTE'); if (p) { r = p; r.id = doc.id; } }
  if (!r) { r = { id: doc.id, capa: '', pm: '', nombreKmz: '', carpeta: '' }; lista.push(r); }
  const nuevo = r.estado !== 'DOCUMENTADO';
  Object.assign(r, { qr: qr, estado: 'DOCUMENTADO', capacidad: String(doc.capacidad || ''), brazo: String(doc.brazo || '').toUpperCase().trim(),
    lat: lat, lng: lng, cluster: String(doc.cluster || ''), origen: String(doc.origen || 'DOCUMENTACIÓN'), notas: String(doc.notas || ''), actualizado: ahora,
    tipo: tipo, foto: String(doc.foto || r.foto || ''), proyecto: String(doc.proyecto || r.proyecto || '') });
  if (nuevo) { r.registradoPor = user.id; r.quien = user.nombre; r.empresa = user.cuadrilla || user.rol; r.fecha = ahora; }
  return r;
}
// Carga (o vuelve a cargar) los 2N de un KMZ: quedan PENDIENTE, y lo ya documentado que esté cerca se liga a ellos.
function capaAplicar_(lista, capa, puntos, ahora) {
  const quedan = lista.filter(x => !(x.capa === capa && x.estado === 'PENDIENTE'));
  const libres = quedan.filter(x => x.estado === 'DOCUMENTADO' && (x.capa === capa || !x.capa));
  libres.forEach(x => { x.pm = ''; });
  const usados = new Set(), pre = capa + '-' + Date.now().toString(36) + '-';
  let ligados = 0, pendientes = 0;
  puntos.forEach(p => {
    let mejor = null, dm = RADIO_CAPA_;
    libres.forEach(x => { if (usados.has(x)) return; const m = docMetros_(p.lat, p.lng, Number(x.lat), Number(x.lng)); if (m < dm) { dm = m; mejor = x; } });
    if (mejor) { usados.add(mejor); Object.assign(mejor, { capa: capa, pm: p.pm, nombreKmz: p.nombre || '', carpeta: p.carpeta || '' }); ligados++; }
    else {
      quedan.push({ id: pre + p.pm, qr: '', estado: 'PENDIENTE', capacidad: '', brazo: '', lat: p.lat, lng: p.lng, cluster: p.cluster || '', origen: 'KMZ',
        capa: capa, pm: p.pm, nombreKmz: p.nombre || '', carpeta: p.carpeta || '', registradoPor: '', quien: '', empresa: '', fecha: '', actualizado: ahora, notas: '' });
      pendientes++;
    }
  });
  lista.length = 0; quedan.forEach(x => lista.push(x));
  return { pendientes: pendientes, ligados: ligados };
}
/* ---- fin de reglas compartidas ---- */

let DOCS = LS.get('docs', {lista:[], capas:[], t:''});
let MIS_DOCS = LS.get('misDocs', []);         // capturados en este teléfono; se borran ya confirmados por el servidor
const guardarMisDocs = () => { LS.set('misDocs', MIS_DOCS); pintarPendientes(); };
const puedeDoc = () => !!USER && ROLES_DOC.includes(USER.rol);
const docsPorEnviar = () => MIS_DOCS.filter(x => !x.subido && x.usuario === (USER && USER.id)).length;

// Lo del servidor + lo capturado aquí que aún no confirma
function vistaDocs(){
  const m = new Map(DOCS.lista.map(x => [x.id, {...x, lat:+x.lat, lng:+x.lng}]));
  for(const x of MIS_DOCS){
    let base = m.get(x.id);
    if(!base && x.liga){ const p = m.get(x.liga); if(p && p.estado === 'PENDIENTE'){ base = p; m.delete(x.liga); } }
    if(x.subido) continue;                   // el servidor ya lo tiene (o ya lo borró el administrador)
    m.set(x.id, {...(base||{}), ...x, lat:+x.lat, lng:+x.lng, estado:'DOCUMENTADO', _local: !x.subido});
  }
  return [...m.values()];
}
function pendientesCerca(lat, lng, radio){
  return vistaDocs().filter(x => x.estado === 'PENDIENTE').map(x => ({...x, m: docMetros_(lat, lng, x.lat, x.lng)}))
    .filter(x => x.m <= radio).sort((a,b) => a.m - b.m);
}
// Servidor de mentiras para el modo demo: mismas reglas que Code.gs, guardado en el teléfono
async function apiDoc(accion, datos){
  const {_cred, ...rest} = datos || {};
  if(!demo()) return api(accion, rest, _cred);
  const s = LS.get('demoDoc', {lista:[], capas:[], archivos:{}}), ahora = new Date().toISOString();
  const res = (() => {
    if(accion === 'docs') return {lista:s.lista, capas:s.capas};
    if(accion === 'capaDatos'){ const c = s.capas.find(x => x.id === datos.capa); if(!c) throw new Error('No existe ese KMZ');
      return {rutas: s.archivos[c.id + '.rutas'] || [], archivo: datos.archivo ? s.archivos[c.id] : undefined, tipo: c.tipo}; }
    if(accion === 'borrarDoc'){ if(!esAdmin()) throw new Error('Solo el administrador puede hacer esto.');
      const i = s.lista.findIndex(x => x.id === datos.id); if(i < 0) return {doc: null}; const x = s.lista[i];
      if(x.capa && x.pm !== '' && x.estado === 'DOCUMENTADO'){ Object.assign(x, {qr:'', estado:'PENDIENTE', capacidad:'', brazo:'', origen:'KMZ', registradoPor:'', quien:'', fecha:'', notas:'', tipo:'', foto:'', actualizado: ahora}); return {doc: x}; }
      s.lista.splice(i, 1); return {doc: null}; }

      return {capa:c, ...capaAplicar_(s.lista, c.id, datos.puntos, ahora)}; }

// Servidor de mentiras para la demo
async function apiProy(accion, datos){

    if(accion === 'guardarProyecto'){ const p = datos.proyecto, y = s.proyectos[p.id]; if(!y || String(y.actualizado) <= String(p.actualizado)) s.proyectos[p.id] = p; return {}; }

let subiendoProy = false;
async function subirProy(){
  if(subiendoProy || !USER || !esAdmin() || (!demo() && !navigator.onLine)) return;
  subiendoProy = true; let cambio = false;
  try{
    for(const p of PROY.proyectos.filter(p => p.subida !== p.actualizado)){
      try{ const v = p.actualizado; await apiProy('guardarProyecto', {proyecto: p}); p.subida = v; cambio = true; }catch(e){ console.log('proyecto', e); }
    }
    for(const i of PROY.incidencias.filter(i => i.subida !== i.actualizado)){
      try{
        const v = i.actualizado, datos = {incidencia: {...i, _fotoPend: undefined, _corrPend: undefined}};
        if(i._fotoPend){ const b = await IDB.traer(i._fotoPend); if(b) datos.foto = await blobAb64(b); }
        if(i._corrPend){ const b = await IDB.traer(i._corrPend); if(b) datos.fotoCorr = await blobAb64(b); }
        const j = await apiProy('guardarIncidencia', datos);
        if(j.incidencia){ if(j.incidencia.foto){ i.foto = j.incidencia.foto; delete i._fotoPend; } if(j.incidencia.fotoCorr){ i.fotoCorr = j.incidencia.fotoCorr; delete i._corrPend; } }
        i.subida = v; cambio = true;      // la foto se queda en el teléfono para compartirla; ya está también en Drive
      }catch(e){ console.log('incidencia', e); }
    }
  } finally { subiendoProy = false; }
  if(cambio){ guardarProy(); if(/^#(proyecto|inc)/.test(location.hash) && !enFormulario() && !MODALES.length) router(); }
}
async function bajarProy(){
  if(!USER || !esAdmin() || (!demo() && !navigator.onLine)) return;
  try{
    const j = await apiProy('proyectos', {});
    const unir = (lista, nuevos) => nuevos.forEach(r => { const k = lista.findIndex(x => x.id === r.id);
      if(k < 0) lista.push({...r, subida: r.actualizado});

}

/* --- Conteo de postes: validar contando postes en lugar de material por material ---
   Reglas: cada poste lleva 2 m de fleje y 1 hebilla (con brazo de extensión: 6 m y 3 hebillas).
   Paso: 1 tangente o 1 tipo D · Remate: 2 tipo D · Punta (1N o bote final): 1 tipo D.
   Cada tipo D lleva un preformado por cable: 300 mm la FO de 24, 900 mm la de 96 y 600 mm el acero.
   Raquetas: 1 por cierre (2N o MEXFO) y 2 por gaza. */
const CABLES = [['FO 24H', 'FO 24', 'PREFORMADO 300mm'], ['FO 96', 'FO 96', 'PREFORMADO 900mm'], ['ACERO', 'Acero', 'PREFORMADO 600mm']];

// Metraje aproximado: largo de las rutas del KMZ por color (blanco = FO 96; rojo y azul = FO 24) × 1.17, que ya incluye gazas.
// Acero: unos 70 m por cierre (entre 60 y 80). Es una referencia: se avisa si lo reportado difiere en más de 100 m.
const FACTOR_FO = 1.17, ACERO_POR_CIERRE = 70, TOLERANCIA_M = 100;

  if(!hex) return 'FO 96';                                          // sin color en el KMZ = blanco (el color por omisión de Google Earth)

  const [r, g, b] = m.slice(1).map(x => parseInt(x, 16)), mx = Math.max(r, g, b), mn = Math.min(r, g, b);
  if(mn > 170 && mx - mn < 50) return 'FO 96';                      // blanco
  if((r === mx && r - Math.max(g, b) > 60) || (b === mx && b - Math.max(r, g) > 40)) return 'FO 24H';   // rojo o azul
  return '';
}
async function calcularMetraje(p){
  const capa = DOCS.capas.find(x => x.id === p.capa); if(!capa) throw new Error('Este proyecto no tiene KMZ ligado (Editar datos > KMZ del proyecto).');
  const rutas = await rutasDe(capa), m = {'FO 96': 0, 'FO 24H': 0, otros: 0};
  rutas.forEach(r => { let l = 0; for(let i = 1; i < r.c.length; i++) l += docMetros_(r.c[i - 1][0], r.c[i - 1][1], r.c[i][0], r.c[i][1]); m[cableDeColor(r.color) || 'otros'] += l; });
  const docs = docsDeProy(p), cierres = docs.length + ((p.postes || {}).c2n || 0) + ((p.postes || {}).mexfo || 0);
  return {fo96: Math.round(m['FO 96'] * FACTOR_FO), fo24: Math.round(m['FO 24H'] * FACTOR_FO), otros: Math.round(m.otros), acero: cierres * ACERO_POR_CIERRE, cierres, rutas: rutas.length, t: new Date().toISOString()};
}

    return q || rep(k) ? `<div class="item"><span class="nom">${t}<small>${rep(k) ? `reportado ${rep(k)} m · diferencia ${d > 0 ? '+' : ''}${d} m` : 'sin reportado'}</small></span><b style="color:${mal ? 'var(--err)' : 'inherit'}">≈ ${q} m${mal ? ' ⚠️' : ''}</b></div>` : ''; };

    ${m ? `${fila('FO 96 (líneas blancas)', m.fo96, 'FO 96')}${fila('FO 24 (líneas rojas y azules)', m.fo24, 'FO 24H')}${fila(`Acero (${m.cierres} cierres × ${ACERO_POR_CIERRE} m)`, m.acero, 'ACERO')}
      <div class="hint">Largo de ${m.rutas} ruta(s) del KMZ × ${FACTOR_FO} (ya incluye gazas).${m.otros ? ` Hay ${m.otros} m en líneas de otro color que no se contaron.` : ''} ⚠️ = más de ${TOLERANCIA_M} m de diferencia con lo reportado.</div>` : '<div class="hint">Con el KMZ del proyecto: líneas blancas = FO 96, rojas y azules = FO 24.</div>'}
    <button class="btn ghost sm" id="ppMetraje">📏 ${m ? 'Volver a calcular' : 'Calcular con el KMZ'}</button><div class="hint err" id="ppMetErr"></div>`;

// 2N y 1N documentados en este proyecto (desde su recorrido o del KMZ ligado al proyecto)
const docsDeProy = p => vistaDocs().filter(x => x.estado === 'DOCUMENTADO' && (x.proyecto === p.id || (p.capa && x.capa === p.capa)));
const SPLITTER_2N = {'1x8': 'SP  2N 1:8', '1x16': 'SP  2N 1:16'};
function calcPostes(pp, docs = []){
  const t = {}, suma = (k, q) => { if(q) t[hMat(k)] = (t[hMat(k)] || 0) + q; };
  const d2n = docs.filter(x => (x.tipo || '2N') === '2N');
  suma('CIERRE 2N', d2n.length); suma('RAQUETAS', d2n.length);              // cada 2N: cierre, splitter según capacidad y una raqueta
  d2n.forEach(x => { const sp = SPLITTER_2N[String(x.capacidad || '').toLowerCase()]; if(sp) suma(sp, 1); });
  const d1n = docs.filter(x => x.tipo === '1N'), dder = docs.filter(x => x.tipo === 'DERIVACION');
  suma('CIERRE TIPO MEXFO', d1n.length + dder.length); suma('RAQUETAS', d1n.length + dder.length);   // 1N y derivación: MEXFO y raqueta
  d1n.forEach(x => suma(String(x.capacidad || '').toLowerCase() === '1x16' ? 'SP 1N 1:16' : 'SP 1N 1:8', 1));   // 1N: splitter 1:8 (o 1:16)

// Lista de cantidades por material (los más comunes arriba, el resto plegado)
// En proyectos: solo lo que aplica a los cables que se están validando; lo demás queda en "Ver todo"
const POCO_USADOS = ['ETIQUETAS ', 'ACOPLADORES', 'CINCHOS', 'HERRAJES TIPO "J"'];
function editorCantidadesProy(v, cables){
  const fuera = new Set(POCO_USADOS); CABLES.forEach(([fo, , pre]) => { if(!(cables || []).includes(fo)){ fuera.add(fo); fuera.add(pre); } });
  const fila = ([h, nom, u]) => `<div class="item ${parseFloat(v[h]) > 0 ? 'con' : ''}"><span class="nom">${esc(nom)}<small>${u === 'm' ? 'metros' : 'piezas'}</small></span>
    <div class="step ${u === 'm' ? 'm' : ''}"><button type="button" data-paso="${u === 'm' ? -10 : -1}">−</button><input inputmode="numeric" data-cant="${esc(h)}" value="${esc(v[h] || '')}" placeholder="0"><button type="button" data-paso="${u === 'm' ? 10 : 1}">＋</button></div></div>`;
  const ver = MATERIALES.filter(([h]) => !fuera.has(h) || parseFloat(v[h]) > 0), resto = MATERIALES.filter(m => !ver.includes(m));
  return `${ver.map(fila).join('')}${resto.length ? `<details><summary class="hint" style="padding:8px 0;cursor:pointer">＋ Ver todo (${resto.length} más)</summary>${resto.map(fila).join('')}</details>` : ''}`;
}
function editorCantidades(v){
  const fila = ([h, nom, u]) => `<div class="item ${parseFloat(v[h]) > 0 ? 'con' : ''}"><span class="nom">${esc(nom)}<small>${u === 'm' ? 'metros' : 'piezas'}</small></span>
    <div class="step ${u === 'm' ? 'm' : ''}"><button type="button" data-paso="${u === 'm' ? -10 : -1}">−</button><input inputmode="numeric" data-cant="${esc(h)}" value="${esc(v[h] || '')}" placeholder="0"><button type="button" data-paso="${u === 'm' ? 10 : 1}">+</button></div></div>`;
  const com = MAT_COMUNES.map(h => MATERIALES.find(x => x[0] === h)).filter(Boolean), resto = MATERIALES.filter(([h]) => !MAT_COMUNES.includes(h));
  return `${com.map(fila).join('')}<details ${resto.some(([h]) => parseFloat(v[h]) > 0) ? 'open' : ''}><summary class="hint" style="padding:8px 0;cursor:pointer">＋ Más materiales</summary>${resto.map(fila).join('')}</details>`;

function activarCantidades(box, alCambiar){
  const leer = () => { const v = {}; box.querySelectorAll('[data-cant]').forEach(i => { const q = parseFloat(i.value); if(q > 0) v[i.dataset.cant] = String(q); i.closest('.item').classList.toggle('con', q > 0); }); alCambiar(v); };
  box.addEventListener('input', e => { if(e.target.matches('[data-cant]')) leer(); });
  box.addEventListener('click', e => { const b = e.target.closest('[data-paso]'); if(!b) return;
    const i = b.parentElement.querySelector('input'); i.value = Math.max(0, (parseFloat(i.value) || 0) + +b.dataset.paso) || ''; leer(); });
}

async function ubicacionDeFoto(f){
  try{ const p = gpsDeFoto(await f.slice(0, 262144).arrayBuffer()); if(p) return {pos:p, origen:'ubicación de la foto'}; }catch(e){}

    () => r(null), {enableHighAccuracy:true, timeout:15000, maximumAge:30000}) : r(null));
}
async function sellarFoto(f, pos, origen, renglones){
  const cuando = new Date(Math.abs(Date.now() - f.lastModified) < 864e5 ? f.lastModified : Date.now()), dos = n => String(n).padStart(2, '0');
  const img = await createImageBitmap(f), k = Math.min(1, 1600 / Math.max(img.width, img.height));
  const cv = document.createElement('canvas'); cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
  const g = cv.getContext('2d'); g.drawImage(img, 0, 0, cv.width, cv.height);
  const pad = Math.round(cv.width / 40), fs = Math.max(14, Math.round(cv.width / 34));
  const lineas = [`${dos(cuando.getDate())}/${dos(cuando.getMonth() + 1)}/${cuando.getFullYear()} ${dos(cuando.getHours())}:${dos(cuando.getMinutes())}:${dos(cuando.getSeconds())}`,
    pos ? `${pos[0].toFixed(6)}, ${pos[1].toFixed(6)}  (${origen})` : 'Sin coordenadas', ...renglones].filter(Boolean);
  const alto = lineas.length * fs * 1.35 + pad;
  g.fillStyle = 'rgba(0,0,0,.55)'; g.fillRect(0, cv.height - alto, cv.width, alto); g.fillStyle = '#fff'; g.textBaseline = 'top';
  lineas.forEach((t, i) => { g.font = `${i === 0 ? 700 : 500} ${fs}px system-ui, sans-serif`; g.fillText(t, pad, cv.height - alto + pad / 2 + i * fs * 1.35, cv.width - pad * 2); });
  const blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.82));
  const m = document.createElement('canvas'), km = 160 / Math.max(cv.width, cv.height); m.width = Math.round(cv.width * km); m.height = Math.round(cv.height * km);
  m.getContext('2d').drawImage(cv, 0, 0, m.width, m.height);
  return {blob, mini: m.toDataURL('image/jpeg', 0.55), cuando};
}

/* ===== Inventario =====
   Ubicaciones: el almacén y cada cuadrilla. El stock de cada una sale de su último conteo, más lo que entró,
   menos lo que salió y menos el material de sus folios. Administrador y supervisor capturan y corrigen todo desde aquí;
   la cuadrilla ve su material y confirma lo que recibe. */
const ALMACEN = 'ALMACÉN';
const TIPOS_MOV = {CONTEO:'Conteo', ENTRADA:'Entrada al almacén', ENTREGA:'Entrega a cuadrilla', TRASPASO:'Traspaso entre cuadrillas', DEVOLUCION:'Devolución al almacén', MERMA:'Merma'};
/* ---- Inventario: reglas compartidas (servidor y app) ---- */
function invClave_(s) { return String(s || '').replace(/\s+/g, ' ').trim().toUpperCase(); }
// Stock de una ubicación = último conteo + lo que entró (ya confirmado) − lo que salió − lo consumido en folios (todo después del conteo).
// "hasta" (opcional) calcula el stock como estaba en esa fecha.
function invStock_(movs, consumos, u, hasta) {
  const vivos = movs.filter(m => !m.anulado && (!hasta || String(m.fecha) < String(hasta)));
  let base = null;
  vivos.forEach(m => { if (m.tipo === 'CONTEO' && m.a === u && (!base || String(m.fecha) > String(base.fecha))) base = m; });
  const s = {}, t0 = base ? String(base.fecha) : '';
  const suma = (items, signo) => Object.keys(items || {}).forEach(k => { s[k] = (s[k] || 0) + signo * (Number(items[k]) || 0); });
  if (base) suma(base.items, 1);
  // Entregas y traspasos: salen del origen al registrarse y entran al destino hasta que la cuadrilla confirma (mientras, van "por confirmar")
  const porConf = {};
  vivos.forEach(m => { if (m.tipo === 'CONTEO' || String(m.fecha) < t0) return;
    if (m.de === u) suma(m.items, -1);
    if (m.a !== u) return;
    if ((m.tipo === 'ENTREGA' || m.tipo === 'TRASPASO') && !m.conf) Object.keys(m.items || {}).forEach(k => { porConf[k] = (porConf[k] || 0) + (Number(m.items[k]) || 0); });
    else suma(m.items, 1); });
  if (base) (consumos || []).forEach(c => { if (c.cuadrilla === u && String(c.fecha) >= t0 && (!hasta || String(c.fecha) < String(hasta))) suma(c.items, -1); });
  Object.keys(s).forEach(k => { s[k] = Math.round(s[k] * 100) / 100; });
  return { stock: s, conteo: t0, sinConteo: !base, porConfirmar: porConf };
}
/* ---- fin de reglas compartidas ---- */

const MAT_CLAVE = MATERIALES.map(([h, n, u, g]) => ({k: invClave_(h), h, n, u, g}));
const fmtQ = n => String(Math.round((Number(n) || 0) * 100) / 100);
let INV = LS.get('inv', {movs:[], minimos:{alm:{}, cua:{}}, consumos:[], t:''});
const guardarInv = () => { memoInv = null; LS.set('inv', INV); pintarPendientes(); };
const invPorSubir = () => !USER || USER.rol === 'EXTERNO' ? 0 : INV.movs.filter(m => m.subida !== m.actualizado && (veTodo() || m.de === USER.cuadrilla)).length + (veTodo() && INV.minPend ? 1 : 0);
const ordenU = (a, b) => (a !== ALMACEN) - (b !== ALMACEN) || a.localeCompare(b, 'es', {numeric:true});
function ubicaciones(){
  const s = new Set([ALMACEN]);
  (CFG.usuarios || []).forEach(u => { if(u.activo !== false && u.cuadrilla && (u.rol === 'TECNICO' || u.rol === 'AUXILIAR')) s.add(u.cuadrilla); });
  INV.movs.forEach(m => { if(!m.anulado){ if(m.de) s.add(m.de); if(m.a) s.add(m.a); } });
  return [...s].sort(ordenU);
}
const cortoU = u => u === ALMACEN ? 'Almacén' : u.replace(/^CUADRILLA\s+/i, 'C');
const tecnicoDe = c => { const t = (CFG.usuarios || []).find(u => u.cuadrilla === c && u.rol === 'TECNICO' && u.activo !== false);
  return t ? t.nombre.split(' ').slice(0, 2).join(' ') + ' · ' + cortoU(c) : c; };
const nombreU = u => u === ALMACEN ? 'Almacén' : u.charAt(0) + u.slice(1).toLowerCase();
// Material de un folio, para descontarlo de su cuadrilla
function consumoDeFolio(f){
  const d = f.d, tec = String(d['TECNICO QUE ATIENDE'] || '').split(',')[0].trim();
  const cua = f.cuadrilla || ((CFG.usuarios || []).find(u => u.nombre === tec) || {}).cuadrilla; if(!cua) return null;
  const items = {}; MAT_CLAVE.forEach(m => { const q = parseFloat(d[m.h]); if(q > 0) items[m.k] = q; });
  if(!Object.keys(items).length) return null;
  const t = completa(d['HORA FINAL']) ? d['HORA FINAL'] : d['FECHA Y HORA DE LLEGADA'];
  return {cuadrilla: cua, fecha: completa(t) ? new Date(t).toISOString() : f.creado, folio: d['FOLIO/OS'], items};
}
// Memoria corta: vale mientras se dibuja una pantalla y se borra sola (o al guardar algo)
let memoInv = null;
const memo = () => { if(!memoInv){ memoInv = {c: null, s: new Map()}; queueMicrotask(() => { memoInv = null; }); } return memoInv; };
const consumosTodos = () => { const m = memo(); return m.c || (m.c = demo() ? FOLIOS.map(consumoDeFolio).filter(Boolean).concat(PREV.ots.map(consumoDeOt))
  : (INV.consumos || []).concat(FOLIOS.filter(f => f.estado !== 'enviado' && (f.version || 1) === 1).map(consumoDeFolio).filter(Boolean),

// Servidor de mentiras para la demo

let sincInvEnCurso = null;
async function sincInv(){
  if(!USER || USER.rol === 'EXTERNO' || (!demo() && !navigator.onLine)) return;
  if(sincInvEnCurso) return sincInvEnCurso;
  sincInvEnCurso = (async () => {
    try{
      for(const m of INV.movs.filter(m => m.subida !== m.actualizado && (veTodo() || m.de === USER.cuadrilla))){
        try{ const v = m.actualizado, {subida, error, ...mov} = m; await apiInv('guardarMov', {mov}); m.subida = v; m.error = ''; }catch(e){ m.error = String(e.message || e); } }
      if(veTodo()){
        if(INV.minPend){ try{ await apiInv('guardarMinimos', {minimos: INV.minimos}); INV.minPend = false; }catch(e){} }
      }
      const j = await apiInv('inventario', {});

        if(k < 0) INV.movs.push({...r, subida: r.actualizado}); else if(String(r.actualizado) > String(INV.movs[k].actualizado)) INV.movs[k] = {...r, subida: r.actualizado}; });

}

/* ===== Preventivo: OTs de mantenimiento preventivo =====
   Las cuadrillas de preventivo (GTB, otra división) recorren cada mes los brazos del KMZ y por cada incidencia hacen una OT
   (8 números). La OT lleva fotos de antes, durante y después, material (raquetas, etiquetas y acero salen del almacén;
   los cinchos los pone el proveedor) y arma el script para WhatsApp. Se guarda en la hoja PREVENTIVO.
   En construcción: mientras PREV_PUBLICO sea false, solo lo ve el administrador. */
const PREV_PUBLICO = false;
const prevVisible = () => !!USER && (PREV_PUBLICO || esAdmin() || localStorage.getItem('fo.prevPrueba') === '1');
const esPrev = () => !!USER && USER.area === 'PREVENTIVO' && deCampo(USER.rol);
const INC_PREV_BASE = ['GASA CAÍDA', 'GAZA EN LOOP', 'GAZA SIN DISPOSITIVO', 'CIERRE CAÍDO'];
const incPrev = () => (CFG.listas && CFG.listas.INC_PREV && CFG.listas.INC_PREV.length) ? CFG.listas.INC_PREV : INC_PREV_BASE;
const MAT_PREV = [['RAQUETAS ', 'Raquetas', 'pza'], ['ETIQUETAS ', 'Etiquetas', 'pza'], ['ACERO', 'Acero', 'm']];   // salen del almacén
const FOTOS_PREV = [['antes', 'Antes'], ['durante', 'Durante'], ['despues', 'Después']];
const ORIGEN_PREV = {RECORRIDO: 'Recorrido del mes', FUERA: 'Fuera del recorrido', IDR: 'IDR'};
let PREV = LS.get('prev', {ots: [], t: ''});
const guardarPrev = () => { memoInv = null; LS.set('prev', PREV); pintarPendientes(); };
const prevPorSubir = () => USER ? PREV.ots.filter(o => o.subida !== o.actualizado && (veTodo() || o.cuadrilla === USER.cuadrilla)).length : 0;
const consumoDeOt = o => ({cuadrilla: o.cuadrilla, fecha: o.fin, folio: 'OT ' + o.ot, items: o.mat || {}});
const cuadrillasPrev = () => [...new Set((CFG.usuarios || []).filter(u => u.area === 'PREVENTIVO' && u.cuadrilla && deCampo(u.rol)).map(u => u.cuadrilla))].sort((a, b) => a.localeCompare(b, 'es', {numeric: true}));
const fechaCorta = v => { if(!v) return ''; const [f, h] = String(v).split('T'), [y, m, d] = f.split('-'); return `${d}/${m}/${y.slice(2)} ${(h || '').slice(0, 5)}`.trim(); };

// Servidor de mentiras para la demo
async function apiPrev(accion, datos){
  if(!demo()) return api(accion, datos);
  const s = LS.get('demoPrev', {ots: {}}), r = (() => {
    if(accion === 'preventivo') return {ots: Object.values(s.ots)};
    if(accion === 'guardarPrev'){ const o = {...datos.ot};
      if(Object.values(s.ots).some(x => x.ot === o.ot && x.id !== o.id)) throw new Error('La OT ' + o.ot + ' ya está registrada.');
      o.fotos = o.fotos || {}; Object.keys(datos.fotos || {}).forEach(k => { if(!o.fotos[k]) o.fotos[k] = {id: 'f' + Math.random().toString(36).slice(2, 8), url: '#'}; });
      s.ots[o.id] = o; return {ot: {id: o.id, fotos: o.fotos}}; }
    if(accion === 'guardarLista'){ const c = LS.get('config', null) || structuredClone(CONFIG_DEMO); c.listas[datos.clave] = datos.valores; LS.set('config', c); CFG = normalizarConfig(c); return {}; }
    throw new Error('Acción desconocida');
  })();
  try{ LS.set('demoPrev', s); }catch(e){}
  return {ok: true, ...r};
}
let subiendoPrev = false;
async function subirPrev(){
  if(subiendoPrev || !USER || (!demo() && !navigator.onLine)) return;
  subiendoPrev = true; let cambio = false;
  try{
    for(const o of PREV.ots.filter(o => o.subida !== o.actualizado && (veTodo() || o.cuadrilla === USER.cuadrilla))){
      try{
        const v = o.actualizado, fotos = {};
        for(const [k] of FOTOS_PREV) if((o._pend || {})[k]){ const b = await IDB.traer(o._pend[k]); if(b) fotos[k] = await blobAb64(b); }
        const datos = {...o}; delete datos._pend; delete datos.minis; delete datos.subida; delete datos.error;
        const j = await apiPrev('guardarPrev', {ot: datos, fotos});
        o.fotos = j.ot.fotos || o.fotos; for(const [k] of FOTOS_PREV) if(o.fotos && o.fotos[k] && (o._pend || {})[k]){ IDB.quitar(o._pend[k]).catch(() => {}); delete o._pend[k]; }
        o.subida = v; delete o.error; cambio = true;
      }catch(e){ o.error = e.message; cambio = true; console.log('OT', e); }
    }
  } finally { subiendoPrev = false; }
  if(cambio){ guardarPrev(); if(/^#prev/.test(location.hash) && !enFormulario() && !MODALES.length) router(); }
}
async function bajarPrev(){
  if(!USER || (!demo() && !navigator.onLine)) return;
  try{
    const j = await apiPrev('preventivo', {});
    j.ots.forEach(r => { const k = PREV.ots.findIndex(x => x.id === r.id);
      if(k < 0) PREV.ots.push({...r, subida: r.actualizado});
      else if(String(r.actualizado) > String(PREV.ots[k].actualizado)) PREV.ots[k] = {...PREV.ots[k], ...r, subida: r.actualizado}; });
    PREV.t = new Date().toISOString(); guardarPrev(); await subirPrev();
  }catch(e){ console.log('preventivo', e); }
}

/* ===== Recorrido mensual de preventivo =====
   El administrador carga el KMZ de brazos del mes (para todas las cuadrillas de preventivo). Cada brazo muestra sus km,
   las OTs hechas en él y su estado; la cuadrilla lo marca concluido. La OT sugiere el brazo más cercano a sus coordenadas. */
let REC = LS.get('rec', {lista: [], marcas: [], t: ''});
const guardarRec = () => { LS.set('rec', REC); pintarPendientes(); };
const normBrazo = s => MAY(s).replace(/[\s-]/g, '');
const recsDelMes = mes => REC.lista.filter(r => r.mes === mes);
const otsDeBrazo = (b, mes) => PREV.ots.filter(o => o.origen !== 'IDR' && normBrazo(o.brazo) === normBrazo(b.n) && String(o.termino || '').startsWith(mes));
const colorBrazo = (b, mes) => b.estado === 'CONCLUIDO' ? '#2bea5a' : otsDeBrazo(b, mes).length ? '#ffb020' : '#ff3b30';
function metrosARuta(la, lo, c){               // distancia de un punto al trazo (por segmentos)
  let m = Infinity; const k = Math.cos(la * Math.PI / 180) * 111320, y0 = la * 110540, x0 = lo * k;
  for(let i = 1; i < c.length; i++){ const ax = c[i - 1][1] * k, ay = c[i - 1][0] * 110540, bx = c[i][1] * k, by = c[i][0] * 110540, dx = bx - ax, dy = by - ay;
    const t = Math.max(0, Math.min(1, ((x0 - ax) * dx + (y0 - ay) * dy) / (dx * dx + dy * dy || 1))); m = Math.min(m, Math.hypot(x0 - ax - t * dx, y0 - ay - t * dy)); }
  return m;
}
function brazoCercano(la, lo){
  let mejor = null; REC.lista.forEach(r => r.brazos.forEach(b => { const m = metrosARuta(la, lo, b.c); if(!mejor || m < mejor.m) mejor = {b, r, m}; }));
  return mejor;
}
async function apiRec(accion, datos){
  if(!demo()) return api(accion, datos);
  const s = LS.get('demoRec', {}), r = (() => {
    if(accion === 'recorridos') return {lista: Object.values(s)};
    if(accion === 'guardarRecorrido'){ s[datos.recorrido.id] = datos.recorrido; return {}; }
    if(accion === 'marcarBrazo'){ const x = s[datos.id], b = x && x.brazos.find(y => y.n === datos.brazo); if(!b) throw new Error('Ese brazo no está en el recorrido.');
      Object.assign(b, datos.estado === 'CONCLUIDO' ? {estado: 'CONCLUIDO', por: USER.cuadrilla || USER.nombre, cuando: datos.cuando} : {estado: 'PENDIENTE', por: '', cuando: ''}); x.actualizado = new Date().toISOString(); return {brazo: b}; }
    if(accion === 'cierreRecorrido') return {xlsx: '', nombre: 'cierre'};
    throw new Error('Acción desconocida'); })();
  try{ LS.set('demoRec', s); }catch(e){}
  return {ok: true, ...r};
}
let sincRecOcupado = false;
async function sincRec(){
  if(sincRecOcupado || !USER || (!demo() && !navigator.onLine)) return;
  sincRecOcupado = true;
  try{
    while(REC.marcas.length){ const m = REC.marcas[0];
      try{ await apiRec('marcarBrazo', m); }catch(e){ if(!/no está|No encontré|Solo/.test(e.message)) break; }
      REC.marcas.shift(); guardarRec(); }
    if(!REC.marcas.length){ const j = await apiRec('recorridos', {}); REC.lista = j.lista; REC.t = new Date().toISOString(); guardarRec(); }
  }catch(e){ console.log('recorridos', e); } finally { sincRecOcupado = false; }
}
function marcarBrazo(r, b, estado){
  const cuando = new Date().toISOString();
  Object.assign(b, estado === 'CONCLUIDO' ? {estado, por: USER.cuadrilla || USER.nombre, cuando} : {estado: 'PENDIENTE', por: '', cuando: ''});
  REC.marcas.push({id: r.id, brazo: b.n, estado, cuando}); guardarRec(); sincRec();
}
// Cargar el KMZ de brazos del mes (solo administrador)
async function cargarRecorrido(file, alCargar){
  let A; try{ const bytes = new Uint8Array(await file.arrayBuffer()); A = analizarKml(esZip(bytes) ? (await leerZip(bytes)).kml : new TextDecoder().decode(bytes)); }catch(e){ return toast(e.message || 'No se pudo leer el archivo'); }
  if(!A.rutas.length) return toast('El KMZ no trae rutas (brazos).');
  const largo = c => { let l = 0; for(let i = 1; i < c.length; i++) l += docMetros_(c[i - 1][0], c[i - 1][1], c[i][0], c[i][1]); return l; };
  const armar = tol => A.rutas.map(r => { const c = []; r.c.forEach((p, i) => { const u = c[c.length - 1]; if(!u || i === r.c.length - 1 || docMetros_(u[0], u[1], p[0], p[1]) > tol) c.push([+p[0].toFixed(5), +p[1].toFixed(5)]); });
    return {n: MAY(r.n).trim() || 'SIN NOMBRE', t: /PRIMARIA/i.test(r.f || '') ? 'TRONCAL PRIMARIA' : 'TRONCAL SECUNDARIA', km: Math.round(largo(r.c) / 10) / 100, c, estado: 'PENDIENTE', por: '', cuando: ''}; });
  let tol = 8, brazos = armar(tol); while(JSON.stringify(brazos).length > 44000 && tol < 200){ tol *= 1.6; brazos = armar(tol); }

   Al atenderla se registra su OT (origen IDR). Por ahora visible igual que Preventivo (en construcción). */
const PRIO_IDR = {CRITICA: ['Crítica', 24], MEDIA: ['Media', 72], NORMAL: ['Normal', 168]};

/* ===== Reportes de problemas =====
   Cualquiera reporta desde Ajustes (con captura opcional); se guarda en la hoja REPORTES y al administrador le llega un correo.
   El administrador los revisa, responde y los marca resueltos; quien reportó ve el estado y la respuesta en sus Ajustes. */
const ESTADOS_REP = {'NUEVO': ['Nuevo', 'error'], 'EN REVISIÓN': ['En revisión', 'pendiente'], 'RESUELTO': ['Resuelto', 'enviado']};
let REP = LS.get('reportes', {lista: [], vistos: {}, t: ''});

const repPorSubir = () => USER ? REP.lista.filter(r => r.subida !== r.actualizado && (esAdmin() || r.usuario === USER.id)).length : 0;
const repNuevos = () => REP.lista.filter(r => r.estado === 'NUEVO').length;
const repSinLeer = () => misReportes().filter(r => r.respuesta && REP.vistos[r.id] !== r.actualizado).length;     // respuestas que aún no ve quien reportó
async function apiRep(accion, datos){
  if(!demo()) return api(accion, datos);
  const s = LS.get('demoRep', {}), r = (() => {
    if(accion === 'reportes') return {reportes: Object.values(s).filter(x => esAdmin() || x.usuario === USER.id)};
    const x = datos.reporte, y = s[x.id];
    if(!y) s[x.id] = {...x, usuario: USER.id, nombre: USER.nombre, rol: USER.rol, cuadrilla: USER.cuadrilla, estado: 'NUEVO', respuesta: '', foto: datos.foto ? {id: 'demo', url: '#'} : null};
    else if(esAdmin()) s[x.id] = {...y, estado: x.estado, respuesta: x.respuesta, respondio: USER.nombre, actualizado: x.actualizado};
    return {reporte: s[x.id]};
  })();
  LS.set('demoRep', s); return {ok: true, ...r};
}
let sincRepEnCurso = null;
async function sincRep(){
  if(!USER || (!demo() && !navigator.onLine)) return;
  if(sincRepEnCurso) return sincRepEnCurso;
  sincRepEnCurso = (async () => {
    try{
      for(const r of REP.lista.filter(r => r.subida !== r.actualizado && (esAdmin() || r.usuario === USER.id))){
        try{ const v = r.actualizado, {subida, _foto, ...reporte} = r, datos = {reporte};
          if(_foto){ const b = await IDB.traer(_foto); if(b) datos.foto = await blobAb64(b); }
          const j = await apiRep('guardarReporte', datos); Object.assign(r, j.reporte, {subida: j.reporte.actualizado || v}); delete r._foto;
          if(_foto) IDB.quitar(_foto).catch(() => {});
        }catch(e){ console.log('reporte', e); }
      }
      const j = await apiRep('reportes', {});
      j.reportes.forEach(x => { const k = REP.lista.findIndex(y => y.id === x.id);
        if(k < 0) REP.lista.push({...x, subida: x.actualizado}); else if(String(x.actualizado) >= String(REP.lista[k].actualizado) && REP.lista[k].subida === REP.lista[k].actualizado) REP.lista[k] = {...x, subida: x.actualizado}; });
      REP.t = new Date().toISOString();
    }catch(e){ console.log('reportes', e); }
    guardarRep(); pintarAvisoRep();
  })();
  try{ await sincRepEnCurso; } finally { sincRepEnCurso = null; }
}

// Achica la captura para que suba rápido
async function reducirFoto(f){
  const img = await createImageBitmap(f), k = Math.min(1, 1600 / Math.max(img.width, img.height)), cv = document.createElement('canvas');
  cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k); cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
  return new Promise(r => cv.toBlob(r, 'image/jpeg', 0.8));
}
function textoProblema(t){
