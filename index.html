/* ===== Mini mapa (sin librerías) ===== */
const MAPA_COLORES = {'MARINA':'#2a7ab8','MALECON':'#c2702a','NUEVO VALLARTA':'#2f9e5b','BUCERIAS':'#8b5cc4','PUNTA MITA':'#c4415e'};
function abrirMapa(coordsTxt, alElegir, opts = {}){   // opts: titulo, hint, lineas, puntos, soloVer
  const inicial = parseCoords(coordsTxt);
  let pt = inicial, z = inicial ? 17 : 12;
  const S = z => 256 * 2 ** z;
  const wx = (lon,z) => (lon + 180) / 360 * S(z);
  const wy = (lat,z) => { const s = Math.sin(lat*Math.PI/180); return (0.5 - Math.log((1+s)/(1-s)) / (4*Math.PI)) * S(z); };
  const ilon = (x,z) => x / S(z) * 360 - 180;
  const ilat = (y,z) => { const n = Math.PI - 2*Math.PI*y/S(z); return 180/Math.PI*Math.atan(Math.sinh(n)); };
  let c0 = inicial || CENTRO_MAPA, ajustado = false;
  const pts = opts.puntos || [];
  if(!inicial && pts.length){               // sin punto previo: encuadra todos los 2N
    const la = pts.map(p => p.lat), lo = pts.map(p => p.lng), a = Math.min(...la), b = Math.max(...la), c = Math.min(...lo), d = Math.max(...lo);
    c0 = [(a + b) / 2, (c + d) / 2]; z = 17; while(z > 10 && (wx(d,z) - wx(c,z) > 320 || wy(a,z) - wy(b,z) > 380)) z--; ajustado = true; }
  let sel = opts.soloVer && inicial ? pts.find(p => Math.abs(p.lat - inicial[0]) < 1e-6 && Math.abs(p.lng - inicial[1]) < 1e-6) || null : null;
  let cx = wx(c0[1], z), cy = wy(c0[0], z), ox = 0, oy = 0;
  let yo = null;                                   // dónde está el teléfono (punto azul)
  const {o, cerrar} = ventana(opts.titulo || 'Toca el mapa para marcar el punto',
    `<div class="mv" id="mv"><div id="mt"></div><svg id="ms"><g id="mg"></g></svg><div class="yo hidden" id="myo"></div>
       <svg class="pin hidden" id="mpin" viewBox="0 0 30 40" aria-hidden="true"><path d="M15 39C15 39 2 23 2 14a13 13 0 0 1 26 0c0 9-13 25-13 25z" fill="#d93025" stroke="#a50e0e" stroke-width="1.5"/><circle cx="15" cy="14" r="5" fill="#fff"/></svg>
       <div class="mhint" id="mhint">${opts.hint || 'Toca el mapa donde está el daño.'}</div>
       <div class="mzoom"><button id="mzi" aria-label="Acercar">+</button><button id="mzo" aria-label="Alejar">−</button></div><div class="mattr">© OpenStreetMap</div></div>
     <div class="minfo" id="minf"></div>`,
    `<button class="btn ghost" id="mgps" style="${opts.soloVer ? '' : 'flex:0 0 auto;width:auto;'}white-space:nowrap;padding:14px 12px">📍 Mi ubicación</button>${opts.soloVer ? '<button class="hidden" id="mok"></button>' : '<button class="btn verde" id="mok">Usar este punto</button>'}`, true);
  const mv = o.querySelector('#mv'), mt = o.querySelector('#mt'), mg = o.querySelector('#mg'), pin = o.querySelector('#mpin'), yoEl = o.querySelector('#myo');
  const tiles = new Map();
  function zonas(){
    ox = cx; oy = cy;
    mg.innerHTML = CLUSTERS_GEO.map(zn => {
      const col = MAPA_COLORES[zn.cluster] || '#555';
      const dd = 'M' + zn.p.map(([lon,lat]) => (wx(lon,z)-ox).toFixed(1)+' '+(wy(lat,z)-oy).toFixed(1)).join('L') + 'Z';
      return `<path d="${dd}" fill="${col}" fill-opacity=".07" stroke="${col}" stroke-opacity=".55" stroke-width="1.5"/>`;
    }).join('')
    + (opts.lineas || []).map(l => `<path d="M${l.c.map(([la,lo]) => (wx(lo,z)-ox).toFixed(1)+' '+(wy(la,z)-oy).toFixed(1)).join('L')}" fill="none" stroke="${l.color || '#7a5cc4'}" stroke-width="3" stroke-opacity=".85" stroke-linecap="round" stroke-linejoin="round"/>`).join('')
    + pts.map(p => `<circle cx="${(wx(p.lng,z)-ox).toFixed(1)}" cy="${(wy(p.lat,z)-oy).toFixed(1)}" r="${z >= 16 ? 7 : 5}" fill="${p.color}" stroke="#fff" stroke-width="2"/>`).join('');
  }
  function pintar(){
    const W = mv.clientWidth, H = mv.clientHeight, x0 = cx - W/2, y0 = cy - H/2, n = 2 ** z, vistos = new Set();
    for(let tx = Math.floor(x0/256); tx <= Math.floor((x0+W)/256); tx++)
      for(let ty = Math.floor(y0/256); ty <= Math.floor((y0+H)/256); ty++){
        if(ty < 0 || ty >= n) continue;
        const k = `${z}/${((tx % n) + n) % n}/${ty}`; vistos.add(k+'@'+tx);
        let im = tiles.get(k+'@'+tx);
        if(!im){ im = new Image(); im.alt=''; im.onerror = () => { im.style.visibility='hidden'; }; im.src = `https://tile.openstreetmap.org/${k}.png`; tiles.set(k+'@'+tx, im); mt.appendChild(im); }
        im.style.left = (tx*256 - x0) + 'px'; im.style.top = (ty*256 - y0) + 'px';
      }
    for(const [k, im] of tiles) if(!vistos.has(k)){ im.remove(); tiles.delete(k); }
    mg.setAttribute('transform', `translate(${W/2 - (cx-ox)} ${H/2 - (cy-oy)})`);
    const pp = opts.soloVer ? (sel && [sel.lat, sel.lng]) : pt;
    pin.classList.toggle('hidden', !pp);
    if(pp){ pin.style.left = (wx(pp[1],z) - x0) + 'px'; pin.style.top = (wy(pp[0],z) - y0) + 'px'; }
    if(yo){ yoEl.classList.remove('hidden'); yoEl.style.left = (wx(yo[1],z) - x0) + 'px'; yoEl.style.top = (wy(yo[0],z) - y0) + 'px'; }
  }
  function info(){
    const el = o.querySelector('#minf');
    if(opts.soloVer){ el.innerHTML = sel ? sel.info : '<span class="hint">Toca un punto para ver sus datos.</span>'; return; }
    o.querySelector('#mhint').innerHTML = pt ? 'Si no es el lugar exacto, toca otra vez para mover el pin.' : (opts.hint || 'Toca el mapa donde está el daño.');
    if(!pt){ el.innerHTML = navigator.onLine ? '<span class="hint">Arrastra para moverte; + y − para acercar.</span>' : '<div class="hint warn">Sin señal: solo se ven las zonas y los mapas que ya se habían cargado.</div>'; return; }
    const r = clusterDe(pt[0], pt[1]);
    el.innerHTML = `<b>${pt[0].toFixed(6)}, ${pt[1].toFixed(6)}</b> · ${r ? esc(r.cluster) + (r.km ? ' (cerca)' : '') : 'fuera de las zonas'}${navigator.onLine ? '' : '<div class="hint warn">Sin señal: solo se ven las zonas y los mapas que ya se habían cargado.</div>'}`;
  }
  function zoom(dz){
    const nz = Math.max(10, Math.min(19, z + dz)); if(nz === z) return;
    const lat = ilat(cy, z), lon = ilon(cx, z); z = nz; cx = wx(lon, z); cy = wy(lat, z); zonas(); pintar();
  }
  const ptrs = new Map(); let ini = null, pinch = null;
  mv.addEventListener('pointerdown', e => { if(e.target.closest('.mzoom,.mhint')) return; mv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]);
    if(ptrs.size === 1) ini = {x:e.clientX, y:e.clientY, cx, cy, mov:false};
    if(ptrs.size === 2){ const [a,b] = [...ptrs.values()]; pinch = Math.hypot(a[0]-b[0], a[1]-b[1]); if(ini) ini.mov = true; } });
  mv.addEventListener('pointermove', e => { if(!ptrs.has(e.pointerId)) return; ptrs.set(e.pointerId, [e.clientX, e.clientY]);
    if(ptrs.size === 2 && pinch){ const [a,b] = [...ptrs.values()], dd = Math.hypot(a[0]-b[0], a[1]-b[1]);
      if(dd/pinch > 1.5){ zoom(1); pinch = dd; } else if(dd/pinch < 0.67){ zoom(-1); pinch = dd; } return; }
    if(!ini) return; const dx = e.clientX - ini.x, dy = e.clientY - ini.y;
    if(Math.abs(dx) + Math.abs(dy) > 8) ini.mov = true;
    if(ini.mov){ cx = ini.cx - dx; cy = ini.cy - dy; pintar(); } });
  const fin = e => { if(!ptrs.has(e.pointerId)) return; ptrs.delete(e.pointerId);
    if(ptrs.size === 1){ const [q] = [...ptrs.values()]; ini = {x:q[0], y:q[1], cx, cy, mov:true}; pinch = null; return; }   // soltó un dedo: sigue desde aquí
    if(ptrs.size === 0){ if(ini && !ini.mov && e.type === 'pointerup'){ const r = mv.getBoundingClientRect();
        const px = cx - r.width/2 + (e.clientX - r.left), py = cy - r.height/2 + (e.clientY - r.top);
        let cerca = null, dmin = 22; pts.forEach(p => { const dd = Math.hypot(wx(p.lng,z) - px, wy(p.lat,z) - py); if(dd < dmin){ dmin = dd; cerca = p; } });
        if(opts.soloVer) sel = cerca; else pt = cerca ? [cerca.lat, cerca.lng] : [ilat(py, z), ilon(px, z)];
        pintar(); info(); }
      ini = null; pinch = null; } };
  mv.addEventListener('pointerup', fin); mv.addEventListener('pointercancel', fin);
  mv.addEventListener('wheel', e => { e.preventDefault(); zoom(e.deltaY < 0 ? 1 : -1); }, {passive:false});
  o.querySelector('#mzi').onclick = () => zoom(1); o.querySelector('#mzo').onclick = () => zoom(-1);
  const buscarYo = (marcar) => {
    if(!navigator.geolocation){ if(marcar) toast('Este teléfono no da ubicación'); return; }
    if(marcar) toast('Buscando GPS…');
    navigator.geolocation.getCurrentPosition(p => {
      if(!o.isConnected) return;
      yo = [p.coords.latitude, p.coords.longitude];
      if(marcar && !opts.soloVer){ pt = yo.slice(); }
      if(marcar || (!inicial && !ajustado)){ z = Math.max(z, 17); cx = wx(yo[1], z); cy = wy(yo[0], z); zonas(); }   // sin punto previo: abre donde estás
      pintar(); info();
    }, () => { if(marcar) toast('No se pudo obtener el GPS'); }, {enableHighAccuracy:true, timeout:20000, maximumAge:30000});
  };
  o.querySelector('#mgps').onclick = () => buscarYo(true);
  buscarYo(false);                                  // al abrir: muestra el punto azul de dónde estás
  o.querySelector('#mok').onclick = () => { if(opts.soloVer) return cerrar(); if(!pt) return toast('Toca el mapa para marcar el punto'); alElegir(pt[0], pt[1]); cerrar(); };
  addEventListener('resize', pintar); o.addEventListener('cerrar', () => removeEventListener('resize', pintar));
  zonas(); requestAnimationFrame(() => { pintar(); info(); });
}

/* ===== Escáner de QR =====
   Los QR van en los cierres, arriba del poste: la cámara pide alta resolución, enfoque continuo y deja hacer zoom.
   Si de lejos no se lee, "Leer de una foto" usa la cámara normal del teléfono (con su zoom) y lee el QR de la foto;
   esa foto se regresa también para usarla como foto del cierre. */
const limpiaQR = raw => { const m = String(raw).trim().match(/TP\s*-?\s*\d{4,}/i); return m ? m[0].replace(/[\s-]/g, '').toUpperCase() : String(raw).trim().slice(0, 60); };
async function qrDeFoto(det, f){
  const img = await createImageBitmap(f);
  for(const k of [1, 0.5, 0.25]){            // a veces se lee mejor la foto reducida
    try{ const cv = document.createElement('canvas'); cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height); const r = await det.detect(cv); if(r.length) return r[0].rawValue; }catch(e){}
  }
  return null;
}
async function escanearQR(alLeer){
  if(!('BarcodeDetector' in window)) return toast('Este navegador no lee QR. Abre la app en Chrome o escribe el código.');
  let det; try{ det = new BarcodeDetector({formats:['qr_code']}); }catch(e){ return toast('Este teléfono no lee QR; escribe el código.'); }
  const {o, cerrar} = ventana('Escanear QR', `<div class="mbody"><div class="qrcaja"><video class="qr" playsinline muted></video><div class="qrmarco"></div></div>
    <div id="qrZoomW" class="hidden" style="margin-top:10px"><div class="row" style="align-items:center"><span style="flex:0 0 auto">🔍</span><input type="range" id="qrZoom" style="flex:1"><b id="qrZoomV" style="flex:0 0 auto;min-width:42px;text-align:right"></b></div>
      <div class="chips" id="qrZoomC"></div></div>
    <div class="hint" id="qrh">Apunta al QR. Usa el zoom si está arriba del poste.</div>
    <div class="row" style="margin-top:6px"><label class="btn sec" style="text-align:center;flex:1">📷 Leer de una foto<input type="file" id="qrFoto" accept="image/*" capture="environment" hidden></label>
      <button type="button" class="btn sec hidden" id="qrLuz" style="flex:0 0 auto">🔦</button></div></div>`);
  const video = o.querySelector('video'), h = o.querySelector('#qrh'); let stream = null, vivo = true;
  o.addEventListener('cerrar', () => { vivo = false; if(stream) stream.getTracks().forEach(t => t.stop()); });
  const listo = (raw, foto) => { if(!vivo) return; vivo = false; if(navigator.vibrate) navigator.vibrate(80); alLeer(limpiaQR(raw), foto); cerrar(); };
  o.querySelector('#qrFoto').addEventListener('change', async e => { const f = e.target.files[0]; e.target.value = ''; if(!f) return;
    h.className = 'hint'; h.textContent = 'Leyendo la foto…';
    const raw = await qrDeFoto(det, f);
    if(raw) listo(raw, f); else { h.className = 'hint warn'; h.textContent = 'No se encontró el QR en la foto. Acércate con el zoom de la cámara y que el QR salga nítido.'; } });
  try{ stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment', width:{ideal:1920}, height:{ideal:1080}}, audio:false});
    if(!vivo){ stream.getTracks().forEach(t => t.stop()); return; }      // se cerró mientras pedía la cámara
    video.srcObject = stream; await video.play(); }
  catch(e){ h.className='hint err'; h.textContent = 'No se pudo abrir la cámara. Usa "Leer de una foto" o revisa el permiso de cámara.'; return; }
  const pista = stream.getVideoTracks()[0], cap = pista.getCapabilities ? pista.getCapabilities() : {};
  try{ if((cap.focusMode || []).includes('continuous')) await pista.applyConstraints({advanced:[{focusMode:'continuous'}]}); }catch(e){}
  if(cap.zoom && cap.zoom.max > cap.zoom.min){
    const z = o.querySelector('#qrZoom'), zv = o.querySelector('#qrZoomV'), ini = (pista.getSettings().zoom) || cap.zoom.min;
    z.min = cap.zoom.min; z.max = cap.zoom.max; z.step = cap.zoom.step || 0.1; z.value = ini; zv.textContent = (+ini).toFixed(1) + 'x';
    const poner = v => { v = Math.min(cap.zoom.max, Math.max(cap.zoom.min, v)); z.value = v; zv.textContent = (+v).toFixed(1) + 'x'; pista.applyConstraints({advanced:[{zoom: +v}]}).catch(() => {}); };
    z.oninput = () => poner(+z.value);
    o.querySelector('#qrZoomC').innerHTML = [1, 2, 4, 8].filter(x => x >= cap.zoom.min && x <= cap.zoom.max).map(x => `<button type="button" class="chip" data-z="${x}">${x}x</button>`).join('');
    o.querySelectorAll('#qrZoomC .chip').forEach(b => b.onclick = () => poner(+b.dataset.z));
    o.querySelector('#qrZoomW').classList.remove('hidden');
  } else h.textContent = 'Este teléfono no deja hacer zoom aquí: si el QR está lejos, usa "Leer de una foto".';
  if(cap.torch){ const bl = o.querySelector('#qrLuz'); let on = false; bl.classList.remove('hidden');
    bl.onclick = () => { on = !on; pista.applyConstraints({advanced:[{torch: on}]}).catch(() => {}); bl.classList.toggle('on', on); }; }
  const ciclo = async () => {
    if(!vivo) return;
    try{ const r = await det.detect(video); if(r.length) return listo(r[0].rawValue); }catch(e){}
    setTimeout(ciclo, 200);
  };
  ciclo();
}

/* ===== Cantidades de material coherentes =====
   Al salir del campo: solo números enteros (0.2 m de FO o 1.5 cierres no existen) y, en lo que se gasta en un trabajo
   (folio, masiva, OT), no más del máximo de MAX_MAT. Conteos e inventario solo se redondean. */
function nombreMat(k){ const m = MATERIALES.find(([h]) => invClave_(h) === k); return m ? m[1] : k; }
document.addEventListener('change', e => {
  const i = e.target; if(!i.matches || !i.matches('[data-mat],[data-cant],[data-inv],#lMat [data-c],#pvCin')) return;
  const crudo = String(i.value).replace(',', '.').trim(); if(crudo === '') return;
  let v = Math.round(parseFloat(crudo)); if(!isFinite(v) || v < 0) v = 0;
  const k = invClave_(i.dataset.mat || i.dataset.c || (i.id === 'pvCin' ? 'CINCHOS' : '')), consumo = i.matches('[data-mat],#lMat [data-c],#pvCin');
  let aviso = String(v) !== crudo && crudo !== '' ? `Solo números enteros: quedó ${v}.` : '';
  if(consumo && MAX_MAT[k] && v > MAX_MAT[k]){ aviso = `${nombreMat(k)}: máximo ${MAX_MAT[k]}${/FO|ACERO|FLEJE/.test(k) ? ' m' : ''} por trabajo. Si de verdad fue más, avisa al administrador.`; v = MAX_MAT[k]; }
  if(String(v) === crudo) return;
  i.value = v || ''; i.dispatchEvent(new Event('input', {bubbles:true})); if(aviso) toast(aviso);
}, true);
// Los botones − y + tampoco pasan del máximo
document.addEventListener('click', e => {
  const b = e.target.closest && e.target.closest('[data-paso],[data-d]'); if(!b) return;
  setTimeout(() => { const i = b.parentElement.querySelector('input'); if(!i || !i.matches('[data-mat],#lMat [data-c],#pvCin')) return;
    const k = invClave_(i.dataset.mat || i.dataset.c || (i.id === 'pvCin' ? 'CINCHOS' : ''));
    if(MAX_MAT[k] && parseFloat(i.value) > MAX_MAT[k]){ i.value = MAX_MAT[k]; i.dispatchEvent(new Event('input', {bubbles:true})); toast(`${nombreMat(k)}: máximo ${MAX_MAT[k]} por trabajo.`); } }, 0);
});

/* ===== Archivo compartido desde otra app (Android: WhatsApp → Compartir → NODO) =====
   El service worker lo guarda en el caché "nodo-compartido" y abre #compartido; aquí se decide qué hacer con él. */
async function leerCompartido(){
  try{ const c = await caches.open('nodo-compartido'), r = await c.match('./compartido'); if(!r) return null;
    const b = await r.blob(); return new File([b], decodeURIComponent(r.headers.get('x-nombre') || 'archivo.kmz'), {type: b.type}); }catch(e){ return null; }
}
const olvidarCompartido = () => caches.open('nodo-compartido').then(c => c.delete('./compartido')).catch(() => {});
async function pantallaCompartido(){
  $('#titulo').textContent = 'Archivo recibido';
  const f = await leerCompartido();
  if(!f){ $('#app').innerHTML = '<div class="card"><div class="vacio">No llegó ningún archivo. Vuelve a compartirlo desde WhatsApp.</div></div>'; return; }
  const esKmz = /\.(kmz|kml)$/i.test(f.name);
  if(!esAdmin() || USER.rol === 'DEMO'){
    $('#app').innerHTML = `<div class="card"><h2>${esc(f.name)}</h2><div class="hint warn">Solo el administrador puede cargar KMZ en NODO.</div></div>`;
    olvidarCompartido(); return; }
  if(!esKmz){ $('#app').innerHTML = `<div class="card"><h2>${esc(f.name)}</h2><div class="hint warn">NODO solo recibe archivos KMZ o KML.</div></div>`; olvidarCompartido(); return; }
  const activos = PROY.proyectos.filter(p => p.estado !== 'VALIDADO').sort((a, b) => String(b.actualizado).localeCompare(String(a.actualizado)));
  $('#app').innerHTML = `<div class="card"><h2>📎 ${esc(f.name)}</h2><div class="hint">${Math.max(1, Math.round(f.size / 1024))} KB · ¿qué hago con él?</div></div>
    <div class="menu"><a class="mi" id="cmDoc"><span class="ic">📍</span><span class="tx"><b>Documentación</b><small>Sus 2N quedan pendientes en el mapa</small></span><span class="ch">›</span></a>
      <a class="mi" id="cmProy"><span class="ic">🏗️</span><span class="tx"><b>KMZ de un proyecto</b><small>${activos.length ? 'Se carga y se liga al proyecto que elijas' : 'No hay proyectos activos'}</small></span><span class="ch">›</span></a>
      <a class="mi" id="cmRec"><span class="ic">🛠️</span><span class="tx"><b>Recorrido de preventivo</b><small>Los brazos del mes para las cuadrillas</small></span><span class="ch">›</span></a></div>
    <button class="btn ghost" id="cmNo">Descartar</button>`;
  const listo = ruta => { olvidarCompartido(); setTimeout(() => reemplazar(ruta), 300); };
  $('#cmDoc').onclick = () => cargarKmz(f, () => listo('#docs'));
  $('#cmProy').onclick = () => { if(!activos.length) return toast('No hay proyectos activos: crea uno primero.');
    elegirDeLista('¿A qué proyecto?', activos.map(p => p.nombre), '', nom => { const p = activos.find(x => x.nombre === nom); if(!p) return;
      cargarKmz(f, capa => { p.capa = capa.id; p.actualizado = new Date().toISOString(); guardarProy(); subirProy(); toast('KMZ ligado a ' + p.nombre); listo('#proyecto/' + p.id); }); }); };
  $('#cmRec').onclick = () => cargarRecorrido(f, () => listo('#prev'));
  $('#cmNo').onclick = () => { olvidarCompartido(); reemplazar('#'); };
}

/* ===== Reserva de SAP pegada como texto =====
   La reserva llega como imagen: en la Galería del teléfono se copia el texto de la foto (botón "T") y se pega aquí.
   El texto llega revuelto, pero cada cantidad ("37.000 TP09") va justo después de su descripción. */
const SAP_MAT = [[/CAJA\s+AEREA|OPTI\s*TAP/i, 'CIERRE 2N'], [/ACERO/i, 'ACERO'], [/FIBRA.*\b96\b/i, 'FO 96'], [/FIBRA.*\b24\b/i, 'FO 24H'],
  [/SPLITTER\s+N?1\b.*1\s*:\s*16|SPLITTER.*N1.*1:16/i, 'SP 1N 1:16'], [/SPLITTER\s+N?1\b/i, 'SP 1N 1:8'], [/SPLITTER\s+N?2\b.*1\s*:\s*16/i, 'SP  2N 1:16'], [/SPLITTER\s+N?2\b/i, 'SP  2N 1:8'],
  [/CIERRE.*EMPALME.*(12|24)\s*F/i, 'CIERRE TIPO MINI MEXFO'], [/CIERRE.*EMPALME/i, 'CIERRE TIPO MEXFO'], [/ETIQUETA/i, 'ETIQUETAS '], [/RAQUETA/i, 'RAQUETAS '], [/ACOPLADOR/i, 'ACOPLADORES'],
  [/PREFORMADO.*300/i, 'PREFORMADO 300mm'], [/PREFORMADO.*600/i, 'PREFORMADO 600mm'], [/PREFORMADO.*900/i, 'PREFORMADO 900mm'], [/FLEJE/i, 'FLEJE (METROS)'], [/HEBILLA/i, 'HEBILLAS'],

function leerReservaSap(txt){
  const lin = String(txt || '').split(/\n/).map(x => x.trim()).filter(Boolean), items = {}, desconocidos = [], leidos = [];
  const res = (String(txt).match(/RESERVA\s*(\d{5,})/i) || String(txt).match(/\b(\d{7})\b/) || [])[1] || '';
  const proyecto = (String(txt).match(/\b[A-Z]{2,4}-[A-Z]{2,4}-\d{2}-\d{3,5}\b/) || [])[0] || '';
  const esCant = l => /^([\d,]+)\.(\d{3})\s*(TP|PLEX|$)/i.exec(l), ruido = l => /^\d{4,8}$/.test(l) || /^PLEX$/i.test(l) || /RESERVA/i.test(l);
  lin.forEach((l, i) => { const c = esCant(l); if(!c) return;
    let d = ''; for(let j = i - 1; j >= 0 && j >= i - 3; j--){ if(esCant(lin[j])) break; if(!ruido(lin[j])){ d = lin[j].replace(/^\d{4,8}\s+/, ''); break; } }
    const q = Math.round(parseFloat(c[1].replace(/,/g, '') + '.' + c[2])); if(!d || !q) return;
    const m = SAP_MAT.find(([re]) => re.test(d));
    if(m){ items[m[1]] = (items[m[1]] || 0) + q; leidos.push([d, q, m[1]]); } else desconocidos.push(`${q} · ${d}`); });
  return {reserva: res, proyecto, items, desconocidos, leidos};
}

/* ===== Formularios por pasos =====
   Divide un formulario largo en pasos (una pantalla cada uno) con barra de avance. "Siguiente" revisa lo obligatorio
   del paso (lo marcado con *). Se puede apagar en Ajustes > Formularios ("En una página"). */
const usarPasos = () => { const v = LS.get('pasos', null); return v === null ? !navigator.webdriver : v === '1'; };
function faltanEnPaso(els){
  const f = [], vacio = c => !c || (c.matches('input,select,textarea') ? !String(c.value).trim() : c.matches('.fh') ? [...c.querySelectorAll('input')].some(i => !i.value) : c.matches('.chips') ? !c.querySelector('.chip.on')
      : c.matches('.fotos3') ? c.querySelectorAll('img').length < c.querySelectorAll('.fslot').length : c.matches('.row') ? vacio(c.querySelector('.fh,input,select,textarea')) : false);
  els.forEach(el => el.querySelectorAll('.req').forEach(q => { const lab = q.parentElement; if(lab.closest('.hidden')) return;
    let c = lab.nextElementSibling; while(c && c.matches('.hint')) c = c.nextElementSibling;
    if(c && vacio(c)) f.push(lab.textContent.replace('*', '').trim().toLowerCase()); }));
  return f;
}
function porPasos(raiz, pasos){            // pasos: [[título, [elementos]], …]
  if(!raiz || !usarPasos()) return;
  pasos = pasos.map(([t, els]) => [t, els.filter(Boolean)]).filter(([, els]) => els.length); if(pasos.length < 2) return;
  const bar = $('#bar'), orig = [...bar.children], cancelar = orig[0], guardar = orig[orig.length - 1]; let n = 0;
  const cab = document.createElement('div'); cab.className = 'pasos'; raiz.prepend(cab);
  const atras = document.createElement('button'), sig = document.createElement('button');
  atras.type = sig.type = 'button'; atras.className = 'btn ghost'; atras.style.flex = '.5'; atras.textContent = 'Atrás'; sig.className = 'btn'; bar.prepend(atras); bar.append(sig);
  const pintar = () => {
    cab.innerHTML = pasos.map(([t], i) => `<button type="button" class="${i < n ? 'ok' : i === n ? 'on' : ''}" data-i="${i}"><i>${i < n ? '✓' : i + 1}</i><span>${t}</span></button>`).join('');
    cab.querySelectorAll('button').forEach(b => b.onclick = () => { const i = +b.dataset.i; if(i <= n || !faltan()) { n = i; pintar(); } });
    pasos.forEach(([, els], i) => els.forEach(el => { el.classList.toggle('hidden', i !== n); if(i === n && el.tagName === 'DETAILS') el.open = true; }));
    const fin = n === pasos.length - 1;
    orig.forEach(b => b.classList.toggle('hidden', b === cancelar ? n > 0 : !fin)); atras.classList.toggle('hidden', n === 0); sig.classList.toggle('hidden', fin);
    if(!fin) sig.textContent = 'Siguiente: ' + pasos[n + 1][0];
    scrollTo(0, 0);
  };
  const faltan = () => { const f = faltanEnPaso(pasos[n][1]); if(f.length) toast('Falta: ' + f.join(', ')); return f.length; };
  atras.onclick = () => { n--; pintar(); };
  sig.onclick = () => { if(!faltan()){ n++; pintar(); } };
  // si al guardar falta algo de un paso anterior, se regresa a ese paso
  guardar.addEventListener('click', () => setTimeout(() => { if(!raiz.isConnected) return; const i = pasos.findIndex(([, els]) => faltanEnPaso(els).length); if(i >= 0 && i !== n){ n = i; pintar(); } }, 50));
  pintar();
}

/* ===== Selector de hora propio =====
   El reloj de Android se corta en algunas pantallas: los campos de hora (input[data-hora]) abren este selector.
   Horas en cuadrícula, minutos de 5 en 5 y ±1 para la hora exacta (ej. la del mensaje del NOC). */
function elegirHora(inp){
  const [h0, m0] = /^\d{1,2}:\d{2}$/.test(inp.value) ? inp.value.split(':').map(Number) : (d => [d.getHours(), Math.round(d.getMinutes() / 5) * 5 % 60])(new Date());
  let H = h0, M = m0;
  const dos = n => String(n).padStart(2, '0');
  const {o, cerrar} = ventana('Hora', `<div class="mbody"><div class="horaGrande" id="hgV"></div>
    <div class="hint" style="margin:6px 0 4px">Hora</div><div class="horaGrid" id="hgH">${Array.from({length:24}, (_, i) => `<button type="button" data-h="${i}">${dos(i)}</button>`).join('')}</div>
    <div class="hint" style="margin:10px 0 4px">Minutos</div><div class="horaGrid" id="hgM">${Array.from({length:12}, (_, i) => `<button type="button" data-m="${i * 5}">${dos(i * 5)}</button>`).join('')}</div>
    <div class="row" style="margin-top:10px"><button type="button" class="btn sec" id="hgMenos">− 1 min</button><button type="button" class="btn sec" id="hgMas">+ 1 min</button><button type="button" class="btn sec" id="hgAhora">Ahora</button></div></div>`,
    `<button type="button" class="btn ghost" id="hgBorrar" style="flex:.5">Borrar</button><button type="button" class="btn" id="hgOk">Listo</button>`, true);
  const pintar = () => { o.querySelector('#hgV').textContent = dos(H) + ':' + dos(M);
    o.querySelectorAll('[data-h]').forEach(b => b.classList.toggle('on', +b.dataset.h === H)); o.querySelectorAll('[data-m]').forEach(b => b.classList.toggle('on', +b.dataset.m === M)); };
  o.querySelectorAll('[data-h]').forEach(b => b.onclick = () => { H = +b.dataset.h; pintar(); });
  o.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { M = +b.dataset.m; pintar(); });
  o.querySelector('#hgMenos').onclick = () => { const t = (H * 60 + M + 1439) % 1440; H = Math.floor(t / 60); M = t % 60; pintar(); };
  o.querySelector('#hgMas').onclick = () => { const t = (H * 60 + M + 1) % 1440; H = Math.floor(t / 60); M = t % 60; pintar(); };
  o.querySelector('#hgAhora').onclick = () => { const d = new Date(); H = d.getHours(); M = d.getMinutes(); pintar(); };
  const poner = v => { inp.value = v; inp.dispatchEvent(new Event('input', {bubbles:true})); inp.dispatchEvent(new Event('change', {bubbles:true})); cerrar(); };
  o.querySelector('#hgOk').onclick = () => poner(dos(H) + ':' + dos(M));
  o.querySelector('#hgBorrar').onclick = () => poner('');
  pintar();
}

      <label>Sección (brazo)</label><input id="f2nBrazo" value="${esc(n2.brazo || '')}" placeholder="Ej. BRAZO 3" autocapitalize="characters" list="dl2n"><datalist id="dl2n">${[...new Set(vistaDocs().map(x => MAY(x.brazo).trim()).filter(Boolean))].sort().map(b => `<option value="${esc(b)}">`).join('')}</datalist>
      <div class="hint">Se documenta con el QR y las coordenadas de este folio. Se puede ajustar después en Documentación.</div></div>`)(d._doc2n || {})}
    <label>Técnicos que atienden</label><div class="chips" id="cTec">${tecnicos.map(t=>`<button type="button" class="chip ${selTec.has(t)?'on':''}">${esc(t)}</button>`).join('')}</div>
    ${fijo('PROVEEDOR') && fijo('SUPERVISOR')
      ? `<div class="hint" style="margin-top:12px">Proveedor: <b>${esc(d['PROVEEDOR'])}</b> · Supervisor: <b>${esc(d['SUPERVISOR DISTRITO'])}</b></div>
         <input type="hidden" data-c="PROVEEDOR" value="${esc(d['PROVEEDOR']||'')}"><input type="hidden" data-c="SUPERVISOR DISTRITO" value="${esc(d['SUPERVISOR DISTRITO']||'')}">`
      : `<div class="row"><div><label>Proveedor</label><select data-c="PROVEEDOR">${opciones(L.PROVEEDOR, d['PROVEEDOR'])}</select></div>
      <div><label>Supervisor</label><select data-c="SUPERVISOR DISTRITO">${opciones(L.SUPERVISOR, d['SUPERVISOR DISTRITO'])}</select></div></div>`}
  </details>
  <div id="ferr" class="hint err"></div></div>`;
  $('#bar').classList.remove('hidden');
  $('#bar').innerHTML = `<button class="btn ghost" id="bCanc" style="flex:.5">${edit?'Cancelar':'Salir'}</button><button class="btn verde" id="bGuardar">${edit?'Guardar corrección':'Guardar folio'}</button>`;

  /* --- lectura y borrador --- */
  const leer = () => {
    document.querySelectorAll('[data-c]').forEach(el => { d[el.dataset.c] = el.value.trim(); });
    d['TECNICO QUE ATIENDE'] = [...document.querySelectorAll('#cTec .chip.on')].map(b=>b.textContent).join(' , ');
    d['CAUSA DE DAÑO'] = MAY(d['CAUSA DE DAÑO']);
    const c = CFG.clusters[d['CLUSTER']]; if(c){ d['CIUDAD']=c.ciudad; d['ESTADO']=c.estado; }
    return d;
  };
  const autosave = () => { if(!edit) LS.set(CLAVE_BORRADOR(), {d:leer(), t:Date.now()}); };

  /* --- folio y OT: solo números o N/A --- */
  document.querySelectorAll('[data-num]').forEach(el => el.addEventListener('input', () => {
    const v = el.value.toUpperCase(); el.value = v === 'N/A' ? v : v.replace(/\D/g, ''); }));
  document.querySelectorAll('[data-na]').forEach(b => b.onclick = () => { document.querySelector(`[data-c="${b.dataset.na}"]`).value = 'N/A'; autosave(); });
  $('#fFalla').addEventListener('change', () => { const v = $('#fCausa').value; $('#fCausa').innerHTML = opcionesCausa($('#fFalla').value, v); });

  /* --- fechas --- */
  const sincFecha = k => { const box = document.querySelector(`[data-fh="${k}"]`), fd = box.querySelector('[data-fd]'), t = box.querySelector('[data-ft]').value;
    if(t && !fd.value) fd.value = hoyISO();          // escribió la hora sin fecha: se toma hoy
    const f = fd.value;
    document.querySelector(`[data-c="${k}"]`).value = f ? `${f}T${t}` : ''; };
  document.querySelectorAll('[data-fh]').forEach(box => box.addEventListener('change', () => { sincFecha(box.dataset.fh); autosave(); }));
  document.querySelectorAll('[data-q]').forEach(b => b.onclick = () => {
    const box = document.querySelector(`[data-fh="${b.dataset.k}"]`), fd = box.querySelector('[data-fd]'), ft = box.querySelector('[data-ft]');
    if(b.dataset.q === 'hoy') fd.value = hoyISO();
    if(b.dataset.q === 'ayer') fd.value = local(Date.now() - 864e5).slice(0,10);
    if(b.dataset.q === 'ahora'){ const a = ahoraLocal(); fd.value = a.slice(0,10); ft.value = a.slice(11,16); }
    if(b.dataset.q !== 'ahora' && !ft.value) ft.focus();
    sincFecha(b.dataset.k); autosave();
  });

  /* --- ubicación y cluster --- */
  const pintarOlt = (auto) => {
    const c = CFG.clusters[$('#fCluster').value], olts = c ? c.olts : [];
    const prev = auto ? '' : (d['OLT']||'');
    $('#fOlt').innerHTML = opciones(olts, olts.length===1 ? olts[0] : (olts.includes(prev)?prev:''), olts.length>1?'Elige OLT':'—');

  const detectar = () => {
    const xy = parseCoords($('#fCoord').value), h = $('#hCluster');
    if(!xy){ h.textContent=''; return; }

    if(!r){ h.className='hint warn'; h.textContent='Fuera de las zonas conocidas: elige el cluster a mano.'; return; }
    if($('#fCluster').value !== r.cluster){ $('#fCluster').value = r.cluster; pintarOlt(true); }
    h.className = r.km ? 'hint warn' : 'hint ok';
    h.textContent = r.km ? `Cerca de ${r.zona} (${r.km.toFixed(1)} km). Revisa el cluster.` : `Detectado: ${r.zona}`;
  };
  const ponerCoords = (lat, lon, msg) => { $('#fCoord').value = `${lat.toFixed(6)}, ${lon.toFixed(6)}`; const h = $('#hCoord'); h.className='hint ok'; h.textContent = msg; detectar(); autosave(); };
  pintarOlt(false);
  setTimeout(() => { const fo = $('#fo'); if(!fo) return; const d = [...fo.querySelectorAll(':scope > details.card')];
    porPasos(fo, [['Datos', [d[0]]], ['Ubicación', [d[1]]], ['Atención', [d[2]]], ['Material', [d[3], d[4]]], ['Cierre', d.slice(5).concat([...fo.querySelectorAll(':scope > :not(details):not(.pasos)')])]]); }, 0);
  $('#fo').addEventListener('input', autosave);       // en #fo (se crea nuevo cada vez), no en #app
  $('#fo').addEventListener('change', autosave);
  $('#fCluster').onchange = () => { pintarOlt(true); $('#hCluster').textContent=''; autosave(); };
  $('#fCoord').addEventListener('change', detectar);
  $('#bGps').onclick = () => {
    const h = $('#hCoord');
    if(!navigator.geolocation){ h.textContent='Este teléfono no permite ubicación; usa el mapa o escríbela.'; return; }
    h.className='hint'; h.textContent='Buscando señal GPS…';
    navigator.geolocation.getCurrentPosition(p => ponerCoords(p.coords.latitude, p.coords.longitude, `Ubicación tomada (precisión ±${Math.round(p.coords.accuracy)} m). Si no estás en el punto, usa el mapa.`),
      e => { h.className='hint err'; h.textContent = e.code===1 ? 'Permiso de ubicación negado. Actívalo, usa el mapa o escribe las coordenadas.' : 'No se pudo obtener el GPS. Usa el mapa o escríbelas.'; },
      {enableHighAccuracy:true, timeout:20000, maximumAge:30000});
  };
  $('#bFoto').onclick = () => { leer(); fotoEvidencia(d); };
  $('#bMapa').onclick = () => abrirMapa($('#fCoord').value, (lat, lon) => ponerCoords(lat, lon, 'Punto marcado en el mapa.'));
  if(!edit && !borr && !d['COORDENADAS']) $('#bGps').click();   // nuevo folio: intenta tomar el GPS de una vez

  /* --- trabajos y materiales --- */
  function pintarLista(t){
    const cont = $(t==='trab' ? '#lTrab' : '#lMat'), causa = $('#fCausa').value;
    const its = vis[t].map(h => CATALOGO[t].find(i => i.h === h)).filter(Boolean);
    cont.innerHTML = its.length ? its.map(it => { const v = d[it.h] ?? '', m = it.uni === 'm', t0 = tipico(it.h, causa), tp = t0 == null ? null : (m ? t0 : Math.max(1, Math.round(t0)));
      return `<div class="item ${parseFloat(v)>0?'con':''}"><button type="button" class="x" data-quitar="${esc(it.h)}" data-t="${t}" aria-label="Quitar">×</button>
        <div class="nom">${esc(it.n)}<small>${esc(it.sub)}${tp?` · normalmente ${tp}${m?' m':''}`:''}${d._sug.includes(it.h)&&!(parseFloat(v)>0)?' · sugerido':''}</small></div>
        <div class="step ${m?'m':''}">${m?'':'<button type="button" data-d="-1">−</button>'}<input type="number" inputmode="numeric" min="0" step="1" value="${esc(v)}" data-c="${esc(it.h)}" placeholder="0">${m?'':'<button type="button" data-d="1">+</button>'}</div></div>`; }).join('')
      : `<div class="vacio">Nada agregado todavía.</div>`;
    const usados = CATALOGO[t].filter(i => parseFloat(d[i.h]) > 0).length;
    $(t==='trab' ? '#cntTrab' : '#cntMat').textContent = usados ? `${usados} con cantidad` : '';
  }
  const pintarListas = () => { pintarLista('trab'); pintarLista('mat'); };
  function aplicarSugerencias(causa, avisar){
    // quita sugerencias anteriores que quedaron vacías y agrega las de la causa nueva
    ['trab','mat'].forEach(t => { vis[t] = vis[t].filter(h => !(d._sug.includes(h) && !(parseFloat(d[h])>0))); });
    const s = causa ? sugerenciasPara(causa).map(([h]) => h) : [];
    d._sug = s;
    s.forEach(h => { const t = CATALOGO.trab.some(i=>i.h===h) ? 'trab' : 'mat'; if(!vis[t].includes(h)) vis[t].push(h); });
    const nt = s.filter(h => CATALOGO.trab.some(i=>i.h===h)).length, nm = s.length - nt;
    $('#sugTrab').innerHTML = causa && nt ? `<div class="sug">Agregamos ${nt} trabajo(s) comunes para <b>${esc(causa)}</b>. Pon la cantidad; lo que quede vacío no se guarda.</div>` : '';
    $('#sugMat').innerHTML = causa && nm ? `<div class="sug">Agregamos ${nm} material(es) comunes para <b>${esc(causa)}</b>. Pon la cantidad; lo que quede vacío no se guarda.</div>` : '';
    pintarListas(); if(avisar && s.length) toast('Agregamos trabajos y materiales sugeridos');
  }
  $('#fCausa').addEventListener('change', () => { leer(); aplicarSugerencias($('#fCausa').value, true); autosave(); });
  pintarListas();
  for(const id of ['#lTrab','#lMat']) {
    $(id).addEventListener('click', e => {
      const b = e.target.closest('button'); if(!b) return;
      if(b.dataset.quitar){ leer(); d[b.dataset.quitar] = ''; vis[b.dataset.t] = vis[b.dataset.t].filter(h => h !== b.dataset.quitar); pintarListas(); autosave(); return; }
      if(b.dataset.d){ const inp = b.parentNode.querySelector('input'); const v = Math.max(0, (parseFloat(inp.value)||0) + parseInt(b.dataset.d));
        inp.value = v || ''; d[inp.dataset.c] = inp.value; b.closest('.item').classList.toggle('con', v>0); autosave(); }
    });
    $(id).addEventListener('input', e => { const i = e.target; if(i.dataset.c){ d[i.dataset.c] = i.value; i.closest('.item').classList.toggle('con', parseFloat(i.value)>0); } });
    $(id).addEventListener('change', () => pintarListas());
  }
  document.querySelectorAll('[data-agregar]').forEach(b => b.onclick = () => {
    leer(); const t = b.dataset.agregar, sel = new Set(vis[t]);
    const frec = CFG.sugerencias.frecuentes;
    const its = [...CATALOGO[t]].sort((a,b2) => { const ia = frec.indexOf(a.h), ib = frec.indexOf(b2.h); return (ia<0?99:ia) - (ib<0?99:ib); });
    const grupos = t === 'mat' ? [...new Set(CATALOGO.mat.map(i=>i.g))] : [null];
    const fila = it => `<div class="pick ${sel.has(it.h)?'on':''}" data-h="${esc(it.h)}"><span class="ck">✓</span><span class="nom">${esc(it.n)}<small>${esc(it.sub)}</small></span></div>`;
    const cuerpo = `<div class="mbody"><input id="pBus" placeholder="Buscar…" autocomplete="off">
      ${t==='mat' ? `<details class="gr" open data-mas><summary>Más usados</summary>${its.slice(0,6).map(fila).join('')}</details>${grupos.map(g => { const n = CATALOGO.mat.filter(i=>i.g===g && sel.has(i.h)).length;
            return `<details class="gr"><summary>${esc(g)}<span class="cnt">${n?n+' elegido(s)':''}</span></summary>${CATALOGO.mat.filter(i=>i.g===g).map(fila).join('')}</details>`; }).join('')}`
                  : its.map(fila).join('')}</div>`;
    const {o, cerrar} = ventana(t==='trab' ? 'Agregar trabajos' : 'Agregar materiales', cuerpo, `<button class="btn" data-listo>Listo</button>`);
    o.querySelector('.mbody').addEventListener('click', e => { const p = e.target.closest('.pick'); if(!p) return; const h = p.dataset.h;
      sel.has(h) ? sel.delete(h) : sel.add(h); o.querySelectorAll(`.pick[data-h="${CSS.escape(h)}"]`).forEach(x => x.classList.toggle('on', sel.has(h)));
      o.querySelectorAll('details.gr:not([data-mas])').forEach(g => { const n = g.querySelectorAll('.pick.on').length; g.querySelector('.cnt').textContent = n ? n+' elegido(s)' : ''; }); });
    o.querySelector('#pBus').addEventListener('input', e => { const q = e.target.value.toLowerCase();
      o.querySelectorAll('.pick').forEach(p => p.classList.toggle('hidden', !!q && !p.textContent.toLowerCase().includes(q)));
      o.querySelectorAll('details.gr').forEach(g => { const hay = !!g.querySelector('.pick:not(.hidden)');
        if(q){ g.open = hay; g.classList.toggle('hidden', !hay || g.hasAttribute('data-mas')); } else { g.classList.remove('hidden'); g.open = g.hasAttribute('data-mas'); } }); });
    o.querySelector('[data-listo]').onclick = () => {
      vis[t] = vis[t].filter(h => sel.has(h)).concat([...sel].filter(h => !vis[t].includes(h)));
      CATALOGO[t].forEach(i => { if(!sel.has(i.h)) d[i.h] = ''; });
      pintarListas(); autosave(); cerrar();
    };
  });
  if(!edit && !borr) aplicarSugerencias('', false);

  /* --- cierre --- */
  $('#bQr').onclick = () => escanearQR(v => { $('#fQr').value = v; toast('QR leído: ' + v); autosave(); });
  $('#fQr').addEventListener('change', e => { e.target.value = e.target.value.toUpperCase(); });
  const n2 = d._doc2n = d._doc2n || {nuevo:false, capacidad:'', brazo:''};
  document.querySelectorAll('#c2n .chip').forEach(b => b.onclick = () => { n2.nuevo = !!b.dataset.v;
    document.querySelectorAll('#c2n .chip').forEach(x => x.classList.toggle('on', x === b)); $('#d2n').classList.toggle('hidden', !n2.nuevo); autosave(); });
  document.querySelectorAll('#c2nCap .chip').forEach(b => b.onclick = () => { n2.capacidad = b.dataset.v;
    document.querySelectorAll('#c2nCap .chip').forEach(x => x.classList.toggle('on', x === b)); autosave(); });
  $('#f2nBrazo').addEventListener('input', e => { const p = e.target.selectionStart; e.target.value = e.target.value.toUpperCase(); e.target.setSelectionRange(p, p); n2.brazo = e.target.value.trim(); autosave(); });
  document.querySelectorAll('#cTec .chip').forEach(b => b.onclick = () => { b.classList.toggle('on'); autosave(); });
  $('#bCanc').onclick = () => {
    if(edit && edit.remoto && edit.estado === 'enviado' && !edit.editor){ FOLIOS = FOLIOS.filter(f => f !== edit); guardarFolios(); }
    volver(edit ? '#ver/'+edit.id : '#'); };

  /* --- guardar --- */
  $('#bGuardar').onclick = async () => {
    leer();
    if(!completa(d['HORA FINAL'])) d['HORA FINAL'] = '';
    if(!d['OT']) d['OT'] = 'N/A';
    const req = [['FOLIO/OS','Folio'],['FALLA REPORTADA','Falla'],['COORDENADAS','Coordenadas'],['CLUSTER','Cluster'],['OLT','OLT'],['CAUSA DE DAÑO','Causa'],['TECNICO QUE ATIENDE','Técnicos']];
    const faltan = req.filter(([k])=>!d[k]).map(x=>x[1]);
    if(!completa(d['FECHA Y HORA DE ASIGNACIÓN'])) faltan.push('Fecha y hora de asignación');
    if(!completa(d['FECHA Y HORA DE LLEGADA'])) faltan.push('Fecha y hora de llegada');
    if(faltan.length){ $('#ferr').textContent = 'Falta: ' + faltan.join(', '); toast('Falta: '+faltan.join(', ')); return; }
    if(!/^(\d+|N\/A)$/.test(d['FOLIO/OS']) || !/^(\d+|N\/A)$/.test(d['OT'])){ toast('Folio y OT: solo números o N/A'); return; }
    if(!parseCoords(d['COORDENADAS'])){ toast('Coordenadas con formato incorrecto'); return; }
    const n2v = d._doc2n || {};
    if(n2v.nuevo){
      const q = docNorm_(d['QR SEGUNDO NIVEL']), f2 = [(!q || q === 'N/A') && 'QR del 2N', !n2v.capacidad && 'capacidad del 2N', !n2v.brazo && 'brazo del 2N'].filter(Boolean);
      if(f2.length){ $('#ferr').textContent = 'Falta: ' + f2.join(', '); toast('Falta: ' + f2.join(', ')); return; }
      const dq = vistaDocs().find(x => x.estado === 'DOCUMENTADO' && x.id !== 'fol-' + (edit ? edit.id : '') && docNorm_(x.qr) === q);
      if(dq){ $('#ferr').textContent = `El QR ${q} ya está documentado (${dq.quien || ''}). Revisa el QR o marca "No" en 2N nuevo.`; toast($('#ferr').textContent); return; }
    }
    if(d['FECHA Y HORA DE LLEGADA'] < d['FECHA Y HORA DE ASIGNACIÓN'] && !(await preguntar('La llegada es antes que la asignación. ¿Guardar así?','Guardar','Revisar'))) return;
    if(d['HORA FINAL'] && d['HORA FINAL'] < d['FECHA Y HORA DE LLEGADA'] && !(await preguntar('La hora final es antes que la llegada. ¿Guardar así?','Guardar','Revisar'))) return;
    if(!edit && USER.cuadrilla){ const st = stockDe(USER.cuadrilla), corto = st.sinConteo ? [] : MAT_CLAVE.filter(m => parseFloat(d[m.h]) > (st.stock[m.k] || 0));
      if(corto.length && !(await preguntar(`Según el inventario no tienes suficiente: ${corto.map(m => `${m.n} (tienes ${fmtQ(st.stock[m.k] || 0)})`).join(', ')}. ¿Guardar de todos modos?`, 'Guardar', 'Revisar'))) return; }
    const dup = d['FOLIO/OS'] !== 'N/A' && FOLIOS.find(f => f.d['FOLIO/OS']===d['FOLIO/OS'] && (!edit || f.id!==edit.id));
    if(dup && !(await preguntar(`Ya tienes el folio ${d['FOLIO/OS']} registrado. ¿Guardarlo de todos modos?`,'Guardar'))) return;
    const tecU = (CFG.usuarios||[]).find(u=>u.nombre===d['TECNICO QUE ATIENDE'].split(' , ')[0]);
    d['NÚMERO DEL TECNICO '] = (USER.rol==='TECNICO' ? USER.telefono : (tecU && tecU.telefono)) || d['NÚMERO DEL TECNICO '] || '';
    [...CATALOGO.trab, ...CATALOGO.mat].forEach(i => { if(!(parseFloat(d[i.h])>0)) d[i.h] = ''; });
    vis.trab = vis.trab.filter(h => d[h]); vis.mat = vis.mat.filter(h => d[h]);
    if(edit){ edit.d = d; edit.estado='pendiente'; edit.editado = new Date().toISOString(); edit.version=(edit.version||0)+1; edit.editor = USER.id;
      REMOTOS = REMOTOS.filter(f => f.id !== edit.id); LS.set('remotos', REMOTOS); }
    else FOLIOS.push({id:uuid(), usuario:USER.id, editor:USER.id, d, estado:'pendiente', creado:new Date().toISOString(), version:1, cuadrilla:USER.cuadrilla});
    const fid = edit ? edit.id : FOLIOS[FOLIOS.length-1].id;
    guardarFolios(); LS.del(CLAVE_BORRADOR());
    docDeFolio(fid, d); subirDocs();
    toast(navigator.onLine ? 'Guardado. Enviando…' : 'Guardado en el teléfono. Se enviará con señal.');
    if(edit) volver('#ver/'+fid); else reemplazar('#ver/'+fid);
    sincronizar();
  };
}

/* ===== Mensajes de afectación masiva ===== */
const fmtCorta = v => { if(!completa(v)) return ''; const [f,h] = v.split('T'), [y,m,dd] = f.split('-'); return `${dd}/${m}/${y.slice(2)} ${h.slice(0,5)}`; };
const nombresCortos = d => String(d['TECNICO QUE ATIENDE']||'').split(',').map(n => n.trim().split(' ')[0]).filter(Boolean).join(', ');
function listaMaterial(d){
  return MATERIALES.filter(([h]) => parseFloat(d[h]) > 0).map(([h,n,u]) => `${d[h]}${u==='m'?' m':''} ${MAY(n)}`).join(', ');
}
function scriptMasiva(n, d){
  const v = k => d[k] ?? '', c = parseCoords(v('COORDENADAS')), cp = v('COORD PUNTO DE MEDICION') || v('COORDENADAS');
  const qr = v('MAS DE UN CIERRE') === 'SI' ? QR_VARIOS : v('QR SEGUNDO NIVEL');
  if(n === 1) return [`SD:${v('FOLIO/OS')}`, `Sɪᴛɪᴏ / punto de medición: ${v('PUNTO DE MEDICION')}`, `Coordenadas: ${cp}`,
    `Proveedor: ${v('PROVEEDOR')}`, `Distrito: ${DISTRITO}`, `Nombre: ${nombresCortos(d)}`].join('\n');
  if(n === 2) return [`SD: ${v('FOLIO/OS')}`, `Causa del daño: ${v('CAUSA DE DAÑO')}`, `Acción correctiva: ${v('ACCION CORRECTIVA')}`, `ETR: ${v('ETR')}`,
    `Capacidad de FO: ${v('CALIBRE FO')}`, `Coordenadas:   ${c ? c[0].toFixed(6)+'° '+c[1].toFixed(6)+'°' : ''}`,
    `Materiales a utilizar: ${v('MATERIALES A UTILIZAR')}`, `Numero QR: ${qr}`].join('\n');
  const llegada = v('FECHA Y HORA DE LLEGADA'), dia = llegada.slice(0,10);
  const med = completa(v('HORA 1ER MEDICION')) ? fmtCorta(v('HORA 1ER MEDICION')) : (v('HORA 1ER MEDICION') && dia ? fmtCorta(dia + 'T' + v('HORA 1ER MEDICION')) : '');
  const pi = v('PAUSA INICIO'), pf = v('PAUSA FIN');
  let total = '', pausa = pi && pf ? pi + ' - ' + pf : '';

/* ===== Foto de evidencia: imprime fecha, hora, coordenadas y folio sobre la imagen =====
   Coordenadas: las que trae la foto (si la cámara guardó ubicación) > GPS en ese momento > las del folio. */
function gpsDeFoto(buf){
  const b = new DataView(buf); if(b.getUint16(0) !== 0xFFD8) return null; let o = 2;
  while(o < b.byteLength - 4){ const m = b.getUint16(o); if(m === 0xFFE1) return tiffGps(b, o + 4); if((m & 0xFF00) !== 0xFF00) break; o += 2 + b.getUint16(o + 2); }
  return null;
}
function tiffGps(b, s){
  if(b.getUint32(s) !== 0x45786966) return null; const t = s + 6, le = b.getUint16(t) === 0x4949, g16 = o => b.getUint16(o, le), g32 = o => b.getUint32(o, le);
  const ifd = o => { const n = g16(o), r = {}; for(let i = 0; i < n; i++){ const e = o + 2 + i*12; r[g16(e)] = {v: e + 8}; } return r; };
  const i0 = ifd(t + g32(t + 4)); if(!i0[0x8825]) return null; const gi = ifd(t + g32(i0[0x8825].v)); if(!gi[2] || !gi[4]) return null;
  const rat = e => { const p = t + g32(e.v); let a = []; for(let i = 0; i < 3; i++){ const dd = g32(p + i*8 + 4); a.push(dd ? g32(p + i*8) / dd : 0); } return a[0] + a[1]/60 + a[2]/3600; };
  const ch = e => String.fromCharCode(b.getUint8(e.v)); let la = rat(gi[2]), lo = rat(gi[4]);
  if(gi[1] && ch(gi[1]) === 'S') la = -la; if(gi[3] && ch(gi[3]) === 'W') lo = -lo;
  return la || lo ? [la, lo] : null;
}
function fotoEvidencia(d){
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*'; inp.capture = 'environment';
  inp.onchange = async () => {
    const f = inp.files[0]; if(!f) return;
    toast('Preparando foto…');
    let u = await ubicacionDeFoto(f);
    if(!u){ const c = parseCoords(d['COORDENADAS']); if(c) u = {pos: c, origen: 'coordenadas del folio'}; }
    const s = await sellarFoto(f, u && u.pos, u && u.origen, [d['UBICACIÓN DEL DAÑO'] || '', [d['FOLIO/OS'] ? 'SD ' + d['FOLIO/OS'] : '', d['CLUSTER'], nombresCortos(d)].filter(Boolean).join(' · ')]);
    const c = s.cuando, dos = n => String(n).padStart(2, '0');
    const nombre = `SD_${d['FOLIO/OS'] || 'sin_folio'}_${c.getFullYear()}${dos(c.getMonth()+1)}${dos(c.getDate())}_${dos(c.getHours())}${dos(c.getMinutes())}${dos(c.getSeconds())}.jpg`;
    const archivo = new File([s.blob], nombre, {type:'image/jpeg'}), url = URL.createObjectURL(s.blob);
    const {o} = ventana('Foto de evidencia', `<div class="mbody"><img src="${url}" style="width:100%;border-radius:10px"><div class="hint">${esc(nombre)}</div></div>`,
      `<button class="btn ghost" data-a="g" style="flex:.6">Guardar</button><button class="btn verde" data-a="s">Compartir</button>`);
    o.addEventListener('cerrar', () => setTimeout(() => URL.revokeObjectURL(url), 1000));
    o.querySelector('[data-a="g"]').onclick = () => { const a = document.createElement('a'); a.href = url; a.download = nombre; document.body.appendChild(a); a.click(); a.remove(); };
    o.querySelector('[data-a="s"]').onclick = async () => {
      if(navigator.canShare && navigator.canShare({files:[archivo]})){ try{ await navigator.share({files:[archivo]}); }catch(e){} }
      else toast('Este teléfono no permite compartir la foto; usa Guardar.');
    };
  };
  inp.click();
}

   <div class="card"><h2>Apariencia</h2><label style="margin-top:0">Tema</label>${chips('aTema', 'tema', 'auto', [['auto', 'Automático'], ['claro', 'Claro'], ['oscuro', 'Oscuro']])}
     <div class="hint">Automático sigue al teléfono.</div>
     <label>Tamaño de letra</label>${chips('aLetra', 'letra', 'normal', [['normal', 'Normal'], ['grande', 'Grande']])}
     <label>Formularios (folio y OT)</label>${chips('aPasos', 'pasos', usarPasos() ? '1' : '0', [['1', 'Por pasos'], ['0', 'En una página']])}</div>
   <div class="card"><h2>Envío y datos</h2>
     <div class="hint" style="margin:0">${pend ? `<b style="color:var(--warn)">${pend} por enviar.</b> Se envían solos cuando hay señal.` : 'Todo está enviado.'}${navigator.onLine ? '' : ' Ahora no hay conexión.'}</div>
     <button class="btn sec" id="aEnviar">Enviar ahora</button>
     <button class="btn sec" id="aListas">Actualizar usuarios y listas</button>
     <div class="hint" id="aMapasH">Mapas guardados para ver sin señal: …</div>
     <button class="btn ghost sm" id="aMapas" style="margin-top:6px">Borrar mapas guardados</button></div>
   <div class="card"><h2>Aplicación</h2><div class="hint" style="margin:0">NODO · versión ${APP_VERSION}${demo() ? ' · modo demostración' : ''}</div>
     <button class="btn sec" id="aAct">Buscar versión nueva</button><div class="hint" id="aActH"></div></div>
   <div class="menu">
     <a class="mi" id="aAyuda"><span class="ic">❓</span><span class="tx"><b>Ayuda</b><small>Cómo se usa, paso a paso</small></span><span class="ch">›</span></a>
     <a class="mi" id="aProb"><span class="ic">💬</span><span class="tx"><b>Avisar de un problema</b><small>Le llega al administrador y aquí ves su respuesta</small></span><span class="ch">›</span></a></div>
   ${(m => m.length ? `<div class="card"><h2>Mis reportes</h2>${m.slice(0, 10).map(r => filaRep(r, false)).join('')}</div>` : '')(misReportes())}`;
  document.querySelectorAll('[data-rep]').forEach(e => e.onclick = () => { verReporte(e.dataset.rep); });
  if(!pantallaAjustes.bajando && (!REP.t || Date.now() - new Date(REP.t) > 60000)){ pantallaAjustes.bajando = true; const antes = firmaRep();     // solo se redibuja si llegó algo nuevo
    sincRep().then(() => { pantallaAjustes.bajando = false; if(firmaRep() !== antes && location.hash === '#ajustes' && !MODALES.length) pantallaAjustes(); }); }
  $('#aPin').onclick = cambiarPin; $('#aAyuda').onclick = verAyuda; $('#aProb').onclick = avisarProblema;
  $('#btnSalir').onclick = cerrarSesion;
  const grupo = (id, clave) => document.querySelectorAll(`#${id} .chip`).forEach(b => b.onclick = () => { LS.set(clave, b.dataset.k); aplicarTema();
    document.querySelectorAll(`#${id} .chip`).forEach(x => x.classList.toggle('on', x === b)); });
  grupo('aTema', 'tema'); grupo('aLetra', 'letra'); grupo('aPasos', 'pasos');
  $('#aEnviar').onclick = async () => { await sincronizar(true); if(typeof sincInv === 'function') sincInv(); if(location.hash === '#ajustes') setTimeout(() => location.hash === '#ajustes' && pantallaAjustes(), 1500); };
  $('#aListas').onclick = async () => { if(demo()) return toast('Modo demo: no hay servidor'); if(!navigator.onLine) return toast('Necesitas señal');
    toast('Actualizando…'); await bajarConfig(); toast('Usuarios y listas actualizados'); };
  const contar = async () => { try{ const c = await caches.open('folios-fo-mapas'), n = (await c.keys()).length; const h = $('#aMapasH'); if(h) h.textContent = `Mapas guardados para ver sin señal: ${n} pedazo(s).`; }catch(e){ const h = $('#aMapasH'); if(h) h.textContent = 'Este navegador no guarda mapas.'; } };
  contar();
  $('#aMapas').onclick = async () => { if(!(await preguntar('¿Borrar los mapas guardados? Se vuelven a bajar al abrir el mapa con señal.', 'Borrar'))) return; try{ await caches.delete('folios-fo-mapas'); }catch(e){} contar(); toast('Mapas borrados'); };
  $('#aAct').onclick = async () => { const h = $('#aActH');
    if(!navigator.onLine){ h.textContent = 'Necesitas señal.'; return; }
    if(!('serviceWorker' in navigator)){ location.reload(); return; }
    h.textContent = 'Buscando…';
    try{ const r = await navigator.serviceWorker.getRegistration(); if(r) await r.update();
      const t = await (await fetch('index.html?t=' + Date.now(), {cache:'no-store'})).text(), v = (t.match(/APP_VERSION = '([^']+)'/) || [])[1];
      if(v && v !== APP_VERSION){ h.textContent = `Hay versión ${v}. Abriendo…`; setTimeout(() => location.reload(), 1200); } else h.textContent = 'Ya tienes la versión más nueva.'; }
    catch(e){ h.textContent = 'No se pudo revisar; intenta con mejor señal.'; } };
}
if(USER) USER.nombre = MAY(USER.nombre);
if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')) navigator.serviceWorker.register('sw.js').catch(()=>{});
const HASH_INICIAL = location.hash, BASE = location.href.split('#')[0];
if(HASH_INICIAL === '#compartido' && !USER) sessionStorage.setItem('fo.irCompartido', '1');   // llegó un archivo antes de entrar   // al recargar (jalar para actualizar) se queda en la misma pantalla
history.replaceState({n:0, raiz:1}, '', BASE + '#');
history.pushState({n:0, guardia:1}, '', BASE + '#');
if(USER && HASH_INICIAL.length > 1){
  const padre = padreDe(HASH_INICIAL);
  if(padre !== '#' && padre !== HASH_INICIAL) history.pushState({n:1}, '', BASE + padre);
  history.pushState({n: nivel() + 1}, '', BASE + HASH_INICIAL);
}
(function limpiarHistorial(){          // el teléfono guarda solo lo reciente; lo enviado ya está en Sheets
  const limite = Date.now() - DIAS_HISTORIAL * 864e5, antes = FOLIOS.length;
  FOLIOS = FOLIOS.filter(f => f.estado !== 'enviado' || new Date(f.editado || f.creado).getTime() > limite);
  if(FOLIOS.length !== antes) LS.set('folios', FOLIOS);
})();
if(CAMBIO_SERVIDOR) setTimeout(() => toast('La app se conectó a un servidor nuevo: entra de nuevo con tu PIN.'), 400);
router(); pintarPendientes(); bajarConfig().then(()=>{ if(!USER) refrescarLogin(); }); sincronizar(); { const antes = firmaRep(); sincRep().then(() => { if(USER && firmaRep() !== antes && (location.hash === '' || location.hash === '#') && !MODALES.length) router(); }); }
</script>
</body>
</html>
