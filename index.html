<script>
// Tema: 'auto' sigue al teléfono; 'claro' u 'oscuro' lo fijan. Se guarda en este teléfono.
function aplicarTema(){
  let t = 'auto'; try{ t = JSON.parse(localStorage.getItem('fo.tema')) || 'auto'; }catch(e){}
  const oscuro = t === 'oscuro' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.tema = oscuro ? 'oscuro' : 'claro';
  document.querySelector('meta[name=theme-color]').content = oscuro ? '#2b2d32' : '#465264';
  let g = false; try{ g = JSON.parse(localStorage.getItem('fo.letra')) === 'grande'; }catch(e){}
  document.documentElement.style.zoom = g ? '1.12' : '';
}
aplicarTema(); matchMedia('(prefers-color-scheme: dark)').addEventListener('change', aplicarTema);
</script>

*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--fondo);color:var(--txt);font-size:16px}
a{color:var(--azul)}
header{position:sticky;top:0;z-index:5;background:var(--hd);color:var(--hdtx);border-bottom:1px solid var(--hdln);padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));display:flex;align-items:center;gap:10px}
header h1{font-size:17px;font-weight:650;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
header button{background:var(--hdbt);color:var(--hdtx);border:1px solid var(--hdbo);border-radius:999px;padding:6px 12px;font-size:13px}
#btnAjustes{width:36px;height:36px;padding:0;border-radius:50%;font-size:17px;flex:none;position:relative}
#btnAjustes.aviso::after{content:"";position:absolute;top:-1px;right:-1px;width:11px;height:11px;border-radius:50%;background:var(--err);border:2px solid var(--hd)}
#btnAtras{width:36px;height:36px;padding:0 0 3px;border-radius:50%;font-size:24px;line-height:1;flex:none;display:flex;align-items:center;justify-content:center}
.banner{padding:8px 16px;font-size:14px}
.banner.demo{background:var(--warnbg);color:var(--warntx)}
.banner.off{background:var(--errbg);color:var(--err)}
main{padding:12px 12px 110px;max-width:640px;margin:0 auto}
.card{background:var(--sup);border:0;box-shadow:var(--sombra);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 10px;color:var(--txt);font-weight:650}
details.card>summary{font-weight:650;color:var(--txt);font-size:15px;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:8px}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:"⌄";color:var(--gris);font-size:16px}
details.card[open]>summary::after{content:"⌃"}
details.card[open]>summary{margin-bottom:10px}
summary .cnt{font-weight:400;color:var(--gris);font-size:13px;margin-left:auto}
label{display:block;font-size:12.5px;color:var(--gris);margin:12px 0 5px}
label .req{color:var(--err)}
input,select,textarea{width:100%;font-size:16px;padding:11px 12px;border:1px solid var(--borde);border-radius:10px;background:var(--campo);color:var(--txt);font-family:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--azul);background:var(--sup);box-shadow:0 0 0 3px var(--foco)}
textarea{min-height:80px;resize:vertical}
.selbtn{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;font-size:16px;padding:11px 12px;border:1px solid var(--borde);border-radius:10px;background:var(--campo);color:var(--txt);font-family:inherit;cursor:pointer}
.selbtn .ch{color:var(--gris);font-size:18px}
.row{display:flex;gap:8px;align-items:flex-end}
.row>*{flex:1;min-width:0}
.btn{display:block;width:100%;padding:13px;border-radius:12px;border:0;font-size:16px;font-weight:600;background:var(--azul);color:var(--sobre);margin-top:10px;cursor:pointer}
:root[data-tema="oscuro"] .btn,:root[data-tema="oscuro"] .accion{background:#2a6db0}
.btn.sec,:root[data-tema="oscuro"] .btn.sec{background:var(--sup);color:var(--txt);border:1px solid var(--borde)}
.btn.ghost,:root[data-tema="oscuro"] .btn.ghost{background:transparent;color:var(--azul);border:1px solid var(--borde)}
.btn.verde,:root[data-tema="oscuro"] .btn.verde{background:var(--ok)}
:root[data-tema="oscuro"] .btn.verde{background:#23824c}
.btn.sm{display:inline-block;width:auto;padding:9px 12px;font-size:14px;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{border:1px solid var(--borde);background:var(--sup);border-radius:999px;padding:7px 12px;font-size:14px;color:var(--txt);cursor:pointer}
.chip.on{background:var(--azul2);color:var(--azul);border-color:var(--azul);font-weight:600}
.chip.add{border-style:dashed;color:var(--azul)}
.tira{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}.tira::-webkit-scrollbar{display:none}.tira .chip{flex:none}
.hint{font-size:13px;color:var(--gris);margin-top:4px}

.fh{display:flex;gap:8px}.fh input{min-width:0}.fh input[type=date]{flex:1.3}.fh input[type=time]{flex:1}
.item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--linea)}
.item:last-child{border-bottom:0}
.item .nom{font-size:14px;flex:1;min-width:0}
.item .nom small{display:block;color:var(--gris);font-size:12px}
.item .x{border:0;background:none;color:var(--gris);font-size:20px;width:32px;height:40px;cursor:pointer}
.step{display:flex;align-items:center;gap:4px}
.step button{width:40px;height:40px;border-radius:8px;border:1px solid var(--borde);background:var(--sup);color:var(--txt);font-size:20px;line-height:1;cursor:pointer}
.step input{width:60px;text-align:center;padding:8px 4px}
.step.m input{width:84px}
.item.con .step input{background:var(--conbg);font-weight:600}
.vacio{font-size:14px;color:var(--gris);padding:6px 0}
.sug{background:var(--sugbg);border-radius:8px;padding:8px 10px;font-size:13px;color:var(--sugtx);margin-bottom:6px}

.bar .btn{margin:0}
.lista .f{display:flex;justify-content:space-between;gap:8px;align-items:center}
.estado{font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;white-space:nowrap}

.big{font-size:26px;font-weight:700}
.kpis{display:flex;gap:8px}.kpis .card{flex:1;text-align:center;margin:0;padding:12px}

.hidden{display:none!important}

.menu{background:var(--sup);border-radius:14px;box-shadow:var(--sombra);overflow:hidden;margin-bottom:12px}
.mi{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--linea);cursor:pointer;color:var(--txt);text-decoration:none}

.mi .tx{flex:1;min-width:0}.mi .tx b{display:block;font-size:15px;font-weight:600}.mi .tx small{display:block;font-size:12.5px;color:var(--gris);margin-top:1px}
.mi .ch{color:var(--tenue);font-size:20px}

.pie{font-size:12px;color:var(--gris);text-align:center;margin:18px 0 4px}

.mzoom button{width:44px;height:44px;border-radius:8px;border:1px solid #d5dbe0;background:#fff;font-size:22px;color:#1f5f99}
.mattr{position:absolute;right:4px;bottom:2px;font-size:10px;color:#555;background:rgba(255,255,255,.7);padding:1px 4px;z-index:2}
.minfo{padding:10px 12px;font-size:14px;border-top:1px solid var(--borde)}
video.qr{width:100%;border-radius:12px;background:#000;max-height:60vh;object-fit:cover}
.marca{display:flex;align-items:center;gap:14px;margin:18px 4px 16px}.marca img{width:64px;height:64px;border-radius:16px;box-shadow:0 2px 8px rgba(0,0,0,.25)}.marca b{display:block;font-size:26px;letter-spacing:3px}.marca span{color:var(--gris);font-size:13px}
</style>

/* ===== Cluster por coordenadas ===== */
function dentro(lon, lat, p){ let c=false; for(let i=0,j=p.length-1;i<p.length;j=i++){ const [x1,y1]=p[i],[x2,y2]=p[j]; if((y1>lat)!==(y2>lat) && lon < (x2-x1)*(lat-y1)/(y2-y1)+x1) c=!c; } return c; }
function distKm(a,b,c,d){ const R=6371, r=Math.PI/180, x=(d-b)*r*Math.cos((a+c)/2*r), y=(c-a)*r; return Math.sqrt(x*x+y*y)*R; }
function clusterDe(lat, lon){
  for(const z of CLUSTERS_GEO) if(dentro(lon, lat, z.p)) return {cluster:z.cluster, zona:z.zona, km:0};
  let best=null;
  for(const z of CLUSTERS_GEO) for(const [x,y] of z.p){ const k=distKm(lat,lon,y,x); if(!best||k<best.km) best={cluster:z.cluster, zona:z.zona, km:k}; }
  return best && best.km <= 3 ? best : null;
}
/* Plus Codes de Google ("MQRJ+V4F" o "75FCMQRJ+V4F"). Los cortos se completan con la zona de trabajo (Puerto Vallarta). */
const OLC = '23456789CFGHJMPQRVWX', OLC_RES = [20, 1, 0.05, 0.0025, 0.000125];
function olcCodificar(la, lo){
  let a = Math.min(Math.max(la, -90), 89.9999999) + 90, b = ((lo + 180) % 360 + 360) % 360, c = '';
  OLC_RES.forEach(r => { const x = Math.floor(a / r), y = Math.floor(b / r); a -= x * r; b -= y * r; c += OLC[x] + OLC[y]; });
  return c.slice(0, 8) + '+' + c.slice(8);
}
function olcDecodificar(code){                  // código completo → centro de su cuadro
  const d = code.replace('+', '').replace(/0+$/, ''); let la = -90, lo = -180, ra = 20, rb = 20;
  for(let i = 0; i < Math.min(d.length, 10); i += 2){ const r = OLC_RES[i / 2]; ra = rb = r;
    la += OLC.indexOf(d[i]) * r; if(d[i + 1]) lo += OLC.indexOf(d[i + 1]) * r; }
  for(let i = 10; i < d.length; i++){ const v = OLC.indexOf(d[i]); ra /= 5; rb /= 4; la += Math.floor(v / 4) * ra; lo += (v % 4) * rb; }
  return [la + ra / 2, lo + rb / 2];
}
function plusCode(s){
  const m = String(s || '').toUpperCase().match(/(?:^|[^0-9A-Z])([23456789CFGHJMPQRVWX]{2,8}\+[23456789CFGHJMPQRVWX]{0,3})(?![0-9A-Z])/);
  if(!m) return null;
  const code = m[1], pos = code.indexOf('+');
  if(pos === 8) return olcDecodificar(code);
  if(pos % 2 || pos < 2) return null;
  const [rLa, rLo] = CENTRO_MAPA, falta = 8 - pos, res = Math.pow(20, 2 - falta / 2), med = res / 2;
  let [la, lo] = olcDecodificar(olcCodificar(rLa, rLo).replace('+', '').slice(0, falta) + code);
  if(rLa + med < la && la - res >= -90) la -= res; else if(rLa - med > la && la + res <= 90) la += res;
  if(rLo + med < lo) lo -= res; else if(rLo - med > lo) lo += res;
  return [la, lo];
}
function parseCoords(s){
  const pc = plusCode(s); if(pc) return pc;
  const m = String(s||'').replace(/[°º]/g, ' ').match(/(-?\d{1,3}(?:\.\d+)?)\s*[,;\s]\s*(-?\d{1,3}(?:\.\d+)?)/);
  if(!m) return null; const la = parseFloat(m[1]), lo = parseFloat(m[2]);
  return Math.abs(la) <= 90 && Math.abs(lo) <= 180 && (la || lo) ? [la, lo] : null;
}
const coordsTexto = c => c ? `${c[0].toFixed(6)}, ${c[1].toFixed(6)}` : '';
// En cualquier campo de coordenadas: lo que se pegue (grados, Plus Code, liga de Maps) se convierte a "lat, lng" antes de usarse

    r = await fetch(API_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, signal: ctl.signal,
      body: JSON.stringify({accion, usuario:cred.id, pin:cred.pin, version:APP_VERSION, ...datos})});
  }catch(e){ throw new Error(e.name === 'AbortError' ? 'La señal está muy débil; se reintentará.' : 'No hay conexión con el servidor; se reintentará.'); }

}

/* Con señal, el servidor revisa el PIN (y bloquea tras varios intentos) y entrega una huella
   para que en este teléfono se pueda volver a entrar sin señal. Sin señal, se compara con esa huella. */
async function entrar(u, pin){
  if(demo()){ if(pin !== '1234') throw new Error('PIN incorrecto'); return {}; }
  const llaves = LS.get('llaves', {});
  if(navigator.onLine){
    try{
      const j = await api('login', {}, {id:u.id, pin});
      llaves[u.id] = {llave:j.llave, sal:j.sal}; LS.set('llaves', llaves);
      return j.usuario;
    }catch(e){ if(!/conexión|señal/i.test(e.message)) throw e; }   // sin respuesta: intenta como sin señal
  }
  const k = llaves[u.id];
  if(!k) throw new Error('La primera vez que entras en este teléfono necesitas señal.');
  if((await sha256(u.id + ':' + pin + ':' + k.sal)) !== k.llave) throw new Error('PIN incorrecto');
  return {};
}

/* ===== Seguimiento de afectaciones masivas (solo ADMIN) =====
   Se pega el mensaje con el que asignan el folio; la app saca folio, OLT, clientes, ingeniero y link.
   Conforme el técnico reporta, se llenan los datos de cada etapa y se copian los 3 mensajes.
   Se guarda en el teléfono y en la hoja MASIVAS del Sheets (para verlo desde otro teléfono). */
let MASIVAS = LS.get('masivas', []);
const guardarMasivas = () => LS.set('masivas', MASIVAS);
function leerAsignacion(txt){
  const t = String(txt||''), m = (re, i = 1) => { const x = t.match(re); return x ? x[i].trim() : ''; };
  const r = {folio: m(/(?:^|\n|\])\s*(?:[^\n:]*:\s*)?(\d{6,9})\s*(?:\n|$)/) || m(/\b(\d{7,9})\b/), olt: m(/OLT\s+([A-Z0-9_]+)/i).toUpperCase(),
    clientesTP: m(/(\d+)\s+clientes?\s+Totalplay/i), clientesEnlace: m(/(\d+)\s+clientes?\s+enlace/i), clientesTFE: m(/(\d+)\s+clientes?\s+TFE/i),
    ingeniero: m(/NOC:\s*(.+?)\s+Link/i), link: m(/(https?:\/\/\S+)/), ticket: '',
    puerto: m(/(?:^|\n)\s*(?:PON\s*:?\s*)?(\d{1,2}\/\d{1,2}\/\d{1,3})\s*(?:\n|$)/i)};   // frame/slot/port
  const tk = t.match(/(\d{4})\/(\d{2})\/(\d{2})\s*\((\d{2}):(\d{2})/); if(tk) r.ticket = `${tk[1]}-${tk[2]}-${tk[3]}T${tk[4]}:${tk[5]}`;
  // hora en que llegó el mensaje, si se copió con el encabezado de WhatsApp: [9:00 p.m., 13/11/2026] o [21:00, 13/11/26]
  const w = t.match(/\[(\d{1,2}):(\d{2})\s*([ap])?\.?\s*m?\.?,\s*(\d{1,2})\/(\d{1,2})\/(\d{2,4})\]/i);
  if(w){ let h = +w[1]; if(w[3]){ const pm = w[3].toLowerCase() === 'p'; if(pm && h < 12) h += 12; if(!pm && h === 12) h = 0; }
    const y = w[6].length === 2 ? '20' + w[6] : w[6]; r.asignacion = `${y}-${w[5].padStart(2,'0')}-${w[4].padStart(2,'0')}T${String(h).padStart(2,'0')}:${w[2]}`; }
  else r.asignacion = ahoraLocal();
  const cl = Object.entries(CFG.clusters||{}).find(([, c]) => (c.olts||[]).includes(r.olt));
  if(cl){ r.cluster = cl[0]; r.ciudad = cl[1].ciudad; r.estado = cl[1].estado; }
  return r;
}

// "45 min", "1 hr 30 min", "1.5 hrs" → [horas, minutos] (minutos al cuarto de hora más cercano)
function leerEtr(t){
  t = String(t || ''); const h = t.match(/([\d.]+)\s*h/i), mi = t.match(/(\d+)\s*min/i);
  let tot = Math.round(((h ? parseFloat(h[1]) * 60 : 0) + (mi ? +mi[1] : 0)) / 15) * 15; if(t && !tot) tot = 15;
  return [Math.min(12, Math.floor(tot / 60)), tot % 60];
}

/* ===== Reporte semanal de material (ADMIN y SUPERVISOR) =====
   El servidor arma el Excel con el formato de GTB ("Sem NN - Pto Vallarta AAAA") con los folios
   cerrados de lunes a domingo; aquí se elige la semana y se descarga. */
function semanaISO(d){ d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const dia = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - dia); const ini = new Date(Date.UTC(d.getUTCFullYear(), 0, 1)); return {anio: d.getUTCFullYear(), semana: Math.ceil(((d - ini) / 864e5 + 1) / 7)}; }
function pantallaReporte(){
  if(!veTodo()){ reemplazar('#'); return; }
  $('#titulo').textContent = 'Reporte semanal';
  const meses = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'], ops = [];
  for(let k = 1; k <= 8; k++){                                   // semana pasada y 7 anteriores
    const d = new Date(Date.now() - k * 7 * 864e5), lun = new Date(d); lun.setDate(d.getDate() - ((d.getDay() + 6) % 7));
    const dom = new Date(lun); dom.setDate(lun.getDate() + 6); const w = semanaISO(d);
    ops.push({...w, txt: `Sem ${w.semana} · ${lun.getDate()} ${meses[lun.getMonth()]} al ${dom.getDate()} ${meses[dom.getMonth()]}${k===1?' (semana pasada)':''}`});
  }

  $('#bar').classList.remove('hidden'); $('#bar').innerHTML = `<button class="btn ghost" onclick="volver('#')">Inicio</button>`;
  $('#rGen').onclick = async () => {
    const o = ops[+$('#rSem').value], res = $('#rRes'), b = $('#rGen');

    b.disabled = true; b.textContent = 'Generando… (puede tardar unos segundos)'; res.innerHTML = '';
    try{
      const r = await api('reporteSemanal', {anio: o.anio, semana: o.semana});

      res.innerHTML = `<div style="margin-top:12px"><b>${esc(r.nombre)}</b> · ${esc(r.desde)} al ${esc(r.hasta)}<div class="hint">${r.folios} folio(s)</div>
        ${r.sinHoraFinal.length ? `<div class="hint warn">Sin hora final (se tomó la llegada): ${esc(r.sinHoraFinal.join(', '))}</div>` : ''}
        <div class="card" style="margin:10px 0;padding:6px 14px">${usados.length ? usados.map(([n,c]) => `<div class="item"><span class="nom">${esc(n)}</span><b>${c}</b></div>`).join('') : '<div class="vacio">Sin material usado esta semana.</div>'}</div>
        <button class="btn verde" id="rDesc">Descargar Excel</button>${esAdmin() ? `<a class="btn ghost" style="text-align:center;text-decoration:none;display:block" href="${esc(r.url)}" target="_blank" rel="noopener">Abrir en Google Sheets</a>` : ''}</div>`;
      $('#rDesc').onclick = () => { if(!r.xlsx) return toast('En la demostración no se descarga el archivo.');
        const bytes = Uint8Array.from(atob(r.xlsx), ch => ch.charCodeAt(0));
        const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([bytes], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
        a.download = r.nombre + '.xlsx'; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
      };
    }catch(e){ res.innerHTML = `<div class="hint err" style="margin-top:10px">${esc(e.message)}</div>`; }

  };
}

/* ===== Documentación de 2N =====
   Cada 2N: QR, capacidad de puertos, brazo y dónde quedó. El administrador carga el KMZ del proyecto
   (sus 2N quedan como pendientes) y descarga el mismo KMZ con lo documentado escrito en cada 2N.
   GTB y póliza solo agregan; cargar y descargar KMZ es solo del administrador. */
const CAPACIDADES_2N = ['1x8', '1x16'];
const RADIO_LIGA = 30;          // m: lo capturado a esta distancia de un 2N pendiente del KMZ se liga a él
const COLOR_DOC = {DOCUMENTADO:'#1f8a4c', PENDIENTE:'#d93025', LOCAL:'#e0a400'};
const ROLES_DOC = ['ADMIN','SUPERVISOR','TECNICO','AUXILIAR','EXTERNO'];
/* ---- Documentación de 2N: reglas compartidas (las usa el servidor y el modo demo de la app) ---- */
const RADIO_CAPA_ = 20;    // m: al cargar un KMZ, un 2N ya documentado a esta distancia de un 2N del KMZ se liga a él
function docNorm_(s) { return String(s || '').toUpperCase().replace(/[\s-]/g, ''); }
function docMetros_(a, b, c, d) { const R = 6371000, r = Math.PI / 180, x = (d - b) * r * Math.cos((a + c) / 2 * r), y = (c - a) * r; return Math.sqrt(x * x + y * y) * R; }
// Guarda una captura en la lista (objetos). Regresa el registro guardado o lanza un error con la explicación.
function docAplicar_(lista, doc, user, ahora) {
  if (!/^[\w-]{6,60}$/.test(String(doc.id || ''))) throw new Error('Registro incompleto');
  const qr = docNorm_(doc.qr), lat = Number(doc.lat), lng = Number(doc.lng), admin = user.rol === 'ADMIN';
  if (!qr) throw new Error('Falta el QR');
  if (!isFinite(lat) || !isFinite(lng) || !lat || !lng) throw new Error('Faltan las coordenadas');
  let r = lista.find(x => x.id === doc.id);
  const otro = lista.find(x => x !== r && x.id !== doc.liga && x.estado === 'DOCUMENTADO' && docNorm_(x.qr) === qr);
  if (otro && !(admin && doc.forzar)) throw new Error('El QR ' + qr + ' ya está documentado (' + (otro.quien || '') + ', ' + String(otro.fecha || '').slice(0, 10) + ').');
  if (r && r.estado === 'DOCUMENTADO' && !admin && r.registradoPor !== user.id && (r.empresa || '') !== (user.cuadrilla || '-'))
    throw new Error('Ese 2N ya lo documentó ' + r.quien + '. Solo el administrador puede cambiarlo.');
  if (!r && doc.liga) { const p = lista.find(x => x.id === doc.liga && x.estado === 'PENDIENTE'); if (p) { r = p; r.id = doc.id; } }
  if (!r) { r = { id: doc.id, capa: '', pm: '', nombreKmz: '', carpeta: '' }; lista.push(r); }
  const nuevo = r.estado !== 'DOCUMENTADO';
  Object.assign(r, { qr: qr, estado: 'DOCUMENTADO', capacidad: String(doc.capacidad || ''), brazo: String(doc.brazo || '').toUpperCase().trim(),
    lat: lat, lng: lng, cluster: String(doc.cluster || ''), origen: String(doc.origen || 'DOCUMENTACIÓN'), notas: String(doc.notas || ''), actualizado: ahora });
  if (nuevo) { r.registradoPor = user.id; r.quien = user.nombre; r.empresa = user.cuadrilla || user.rol; r.fecha = ahora; }
  return r;
}
// Carga (o vuelve a cargar) los 2N de un KMZ: quedan PENDIENTE, y lo ya documentado que esté cerca se liga a ellos.
function capaAplicar_(lista, capa, puntos, ahora) {
  const quedan = lista.filter(x => !(x.capa === capa && x.estado === 'PENDIENTE'));
  const libres = quedan.filter(x => x.estado === 'DOCUMENTADO' && (x.capa === capa || !x.capa));
  libres.forEach(x => { x.pm = ''; });
  const usados = new Set(), pre = capa + '-' + Date.now().toString(36) + '-';
  let ligados = 0, pendientes = 0;
  puntos.forEach(p => {
    let mejor = null, dm = RADIO_CAPA_;
    libres.forEach(x => { if (usados.has(x)) return; const m = docMetros_(p.lat, p.lng, Number(x.lat), Number(x.lng)); if (m < dm) { dm = m; mejor = x; } });
    if (mejor) { usados.add(mejor); Object.assign(mejor, { capa: capa, pm: p.pm, nombreKmz: p.nombre || '', carpeta: p.carpeta || '' }); ligados++; }
    else {
      quedan.push({ id: pre + p.pm, qr: '', estado: 'PENDIENTE', capacidad: '', brazo: '', lat: p.lat, lng: p.lng, cluster: p.cluster || '', origen: 'KMZ',
        capa: capa, pm: p.pm, nombreKmz: p.nombre || '', carpeta: p.carpeta || '', registradoPor: '', quien: '', empresa: '', fecha: '', actualizado: ahora, notas: '' });
      pendientes++;
    }
  });
  lista.length = 0; quedan.forEach(x => lista.push(x));
  return { pendientes: pendientes, ligados: ligados };
}
/* ---- fin de reglas compartidas ---- */

let DOCS = LS.get('docs', {lista:[], capas:[], t:''});
let MIS_DOCS = LS.get('misDocs', []);         // capturados en este teléfono; se borran ya confirmados por el servidor
const guardarMisDocs = () => { LS.set('misDocs', MIS_DOCS); pintarPendientes(); };
const puedeDoc = () => !!USER && ROLES_DOC.includes(USER.rol);
const docsPorEnviar = () => MIS_DOCS.filter(x => !x.subido && x.usuario === (USER && USER.id)).length;

// Lo del servidor + lo capturado aquí que aún no confirma
function vistaDocs(){
  const m = new Map(DOCS.lista.map(x => [x.id, {...x, lat:+x.lat, lng:+x.lng}]));
  for(const x of MIS_DOCS){
    let base = m.get(x.id);
    if(!base && x.liga){ const p = m.get(x.liga); if(p && p.estado === 'PENDIENTE'){ base = p; m.delete(x.liga); } }
    if(base && base.estado === 'DOCUMENTADO' && x.subido) continue;          // el servidor ya lo tiene
    m.set(x.id, {...(base||{}), ...x, lat:+x.lat, lng:+x.lng, estado:'DOCUMENTADO', _local: !x.subido});
  }
  return [...m.values()];
}
function pendientesCerca(lat, lng, radio){
  return vistaDocs().filter(x => x.estado === 'PENDIENTE').map(x => ({...x, m: docMetros_(lat, lng, x.lat, x.lng)}))
    .filter(x => x.m <= radio).sort((a,b) => a.m - b.m);
}
// Servidor de mentiras para el modo demo: mismas reglas que Code.gs, guardado en el teléfono
async function apiDoc(accion, datos){
  const {_cred, ...rest} = datos || {};
  if(!demo()) return api(accion, rest, _cred);
  const s = LS.get('demoDoc', {lista:[], capas:[], archivos:{}}), ahora = new Date().toISOString();
  const res = (() => {
    if(accion === 'docs') return {lista:s.lista, capas:s.capas};
    if(accion === 'capaDatos'){ const c = s.capas.find(x => x.id === datos.capa); if(!c) throw new Error('No existe ese KMZ');
      return {rutas: s.archivos[c.id + '.rutas'] || [], archivo: datos.archivo ? s.archivos[c.id] : undefined, tipo: c.tipo}; }
    if(accion === 'guardarDoc') return {doc: docAplicar_(s.lista, datos.doc, USER, ahora)};
    if(accion === 'cargarCapa'){ if(!esAdmin()) throw new Error('Solo el administrador puede hacer esto.');
      let c = s.capas.find(x => MAY(x.nombre) === MAY(datos.nombre));
      if(!c){ c = {id:'K' + Math.random().toString(36).slice(2,8), nombre:datos.nombre}; s.capas.push(c); }
      Object.assign(c, {actualizado:ahora, puntos:datos.puntos.length, tipo:datos.tipo});

    const ent = {nombre: new TextDecoder().decode(buf.subarray(p + 46, p + 46 + nl)), met: dv.getUint16(p + 10, true), crc: dv.getUint32(p + 16, true),
      csz: dv.getUint32(p + 20, true), usz: dv.getUint32(p + 24, true)};
    const ini = off + 30 + dv.getUint16(off + 26, true) + dv.getUint16(off + 28, true); ent.datos = buf.subarray(ini, ini + ent.csz);

  if(!k) throw new Error('El KMZ no trae un archivo .kml.');

    if(!('DecompressionStream' in window)) throw new Error('Este navegador no puede abrir KMZ; actualiza Chrome.');
    bytes = new Uint8Array(await new Response(new Blob([k.datos]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
  } else if(k.met !== 0) throw new Error('El KMZ usa una compresión que no se puede leer.');

async function subirProy(){

  subiendoProy = true; let cambio = false;
  try{
    for(const p of PROY.proyectos.filter(p => p.subida !== p.actualizado)){

    }
    for(const i of PROY.incidencias.filter(i => i.subida !== i.actualizado)){
      try{

        if(i._fotoPend){ const b = await IDB.traer(i._fotoPend); if(b) datos.foto = await blobAb64(b); }
        if(i._corrPend){ const b = await IDB.traer(i._corrPend); if(b) datos.fotoCorr = await blobAb64(b); }
        const j = await apiProy('guardarIncidencia', datos);
        if(j.incidencia){ if(j.incidencia.foto){ i.foto = j.incidencia.foto; delete i._fotoPend; } if(j.incidencia.fotoCorr){ i.fotoCorr = j.incidencia.fotoCorr; delete i._corrPend; } }
        i.subida = v; cambio = true;      // la foto se queda en el teléfono para compartirla; ya está también en Drive
      }catch(e){ console.log('incidencia', e); }
    }
  } finally { subiendoProy = false; }

}

/* --- Foto sellada: fecha, coordenadas y texto sobre la imagen --- */
async function ubicacionDeFoto(f){
  try{ const p = gpsDeFoto(await f.slice(0, 262144).arrayBuffer()); if(p) return {pos:p, origen:'ubicación de la foto'}; }catch(e){}
  return await new Promise(r => navigator.geolocation ? navigator.geolocation.getCurrentPosition(p => r({pos:[p.coords.latitude, p.coords.longitude], origen:`GPS ±${Math.round(p.coords.accuracy)} m`}),
    () => r(null), {enableHighAccuracy:true, timeout:15000, maximumAge:30000}) : r(null));
}
async function sellarFoto(f, pos, origen, renglones){
  const cuando = new Date(Math.abs(Date.now() - f.lastModified) < 864e5 ? f.lastModified : Date.now()), dos = n => String(n).padStart(2, '0');
  const img = await createImageBitmap(f), k = Math.min(1, 1600 / Math.max(img.width, img.height));
  const cv = document.createElement('canvas'); cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
  const g = cv.getContext('2d'); g.drawImage(img, 0, 0, cv.width, cv.height);
  const pad = Math.round(cv.width / 40), fs = Math.max(14, Math.round(cv.width / 34));
  const lineas = [`${dos(cuando.getDate())}/${dos(cuando.getMonth() + 1)}/${cuando.getFullYear()} ${dos(cuando.getHours())}:${dos(cuando.getMinutes())}:${dos(cuando.getSeconds())}`,
    pos ? `${pos[0].toFixed(6)}, ${pos[1].toFixed(6)}  (${origen})` : 'Sin coordenadas', ...renglones].filter(Boolean);
  const alto = lineas.length * fs * 1.35 + pad;
  g.fillStyle = 'rgba(0,0,0,.55)'; g.fillRect(0, cv.height - alto, cv.width, alto); g.fillStyle = '#fff'; g.textBaseline = 'top';
  lineas.forEach((t, i) => { g.font = `${i === 0 ? 700 : 500} ${fs}px system-ui, sans-serif`; g.fillText(t, pad, cv.height - alto + pad / 2 + i * fs * 1.35, cv.width - pad * 2); });
  const blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.82));
  const m = document.createElement('canvas'), km = 160 / Math.max(cv.width, cv.height); m.width = Math.round(cv.width * km); m.height = Math.round(cv.height * km);
  m.getContext('2d').drawImage(cv, 0, 0, m.width, m.height);
  return {blob, mini: m.toDataURL('image/jpeg', 0.55), cuando};
}

/* ===== Inventario =====
   Ubicaciones: el almacén y cada cuadrilla. El stock de cada una sale de su último conteo, más lo que entró,
   menos lo que salió y menos el material de sus folios. Administrador y supervisor capturan y corrigen todo desde aquí;
   la cuadrilla ve su material y confirma lo que recibe. */
const ALMACEN = 'ALMACÉN';
const TIPOS_MOV = {CONTEO:'Conteo', ENTRADA:'Entrada al almacén', ENTREGA:'Entrega a cuadrilla', TRASPASO:'Traspaso entre cuadrillas', DEVOLUCION:'Devolución al almacén', MERMA:'Merma'};
/* ---- Inventario: reglas compartidas (servidor y app) ---- */
function invClave_(s) { return String(s || '').replace(/\s+/g, ' ').trim().toUpperCase(); }
// Stock de una ubicación = último conteo + lo que entró (ya confirmado) − lo que salió − lo consumido en folios (todo después del conteo).
// "hasta" (opcional) calcula el stock como estaba en esa fecha.
function invStock_(movs, consumos, u, hasta) {
  const vivos = movs.filter(m => !m.anulado && (!hasta || String(m.fecha) < String(hasta)));
  let base = null;
  vivos.forEach(m => { if (m.tipo === 'CONTEO' && m.a === u && (!base || String(m.fecha) > String(base.fecha))) base = m; });
  const s = {}, t0 = base ? String(base.fecha) : '';
  const suma = (items, signo) => Object.keys(items || {}).forEach(k => { s[k] = (s[k] || 0) + signo * (Number(items[k]) || 0); });
  if (base) suma(base.items, 1);
  // Entregas y traspasos: salen del origen al registrarse y entran al destino hasta que la cuadrilla confirma (mientras, van "por confirmar")
  const porConf = {};
  vivos.forEach(m => { if (m.tipo === 'CONTEO' || String(m.fecha) < t0) return;
    if (m.de === u) suma(m.items, -1);
    if (m.a !== u) return;
    if ((m.tipo === 'ENTREGA' || m.tipo === 'TRASPASO') && !m.conf) Object.keys(m.items || {}).forEach(k => { porConf[k] = (porConf[k] || 0) + (Number(m.items[k]) || 0); });
    else suma(m.items, 1); });
  if (base) (consumos || []).forEach(c => { if (c.cuadrilla === u && String(c.fecha) >= t0 && (!hasta || String(c.fecha) < String(hasta))) suma(c.items, -1); });
  Object.keys(s).forEach(k => { s[k] = Math.round(s[k] * 100) / 100; });
  return { stock: s, conteo: t0, sinConteo: !base, porConfirmar: porConf };
}
/* ---- fin de reglas compartidas ---- */

const MAT_CLAVE = MATERIALES.map(([h, n, u, g]) => ({k: invClave_(h), h, n, u, g}));
const fmtQ = n => String(Math.round((Number(n) || 0) * 100) / 100);
let INV = LS.get('inv', {movs:[], minimos:{alm:{}, cua:{}}, consumos:[], t:''});
const guardarInv = () => { memoInv = null; LS.set('inv', INV); pintarPendientes(); };
const invPorSubir = () => !USER || USER.rol === 'EXTERNO' ? 0 : INV.movs.filter(m => m.subida !== m.actualizado && (veTodo() || m.de === USER.cuadrilla)).length + (veTodo() && INV.minPend ? 1 : 0);
const ordenU = (a, b) => (a !== ALMACEN) - (b !== ALMACEN) || a.localeCompare(b, 'es', {numeric:true});
function ubicaciones(){
  const s = new Set([ALMACEN]);
  (CFG.usuarios || []).forEach(u => { if(u.activo !== false && u.cuadrilla && (u.rol === 'TECNICO' || u.rol === 'AUXILIAR')) s.add(u.cuadrilla); });
  INV.movs.forEach(m => { if(!m.anulado){ if(m.de) s.add(m.de); if(m.a) s.add(m.a); } });
  return [...s].sort(ordenU);
}
const cortoU = u => u === ALMACEN ? 'Almacén' : u.replace(/^CUADRILLA\s+/i, 'C');
const nombreU = u => u === ALMACEN ? 'Almacén' : u.charAt(0) + u.slice(1).toLowerCase();
// Material de un folio, para descontarlo de su cuadrilla
function consumoDeFolio(f){
  const d = f.d, tec = String(d['TECNICO QUE ATIENDE'] || '').split(',')[0].trim();
  const cua = f.cuadrilla || ((CFG.usuarios || []).find(u => u.nombre === tec) || {}).cuadrilla; if(!cua) return null;
  const items = {}; MAT_CLAVE.forEach(m => { const q = parseFloat(d[m.h]); if(q > 0) items[m.k] = q; });
  if(!Object.keys(items).length) return null;
  const t = completa(d['HORA FINAL']) ? d['HORA FINAL'] : d['FECHA Y HORA DE LLEGADA'];
  return {cuadrilla: cua, fecha: completa(t) ? new Date(t).toISOString() : f.creado, folio: d['FOLIO/OS'], items};
}
// Memoria corta: vale mientras se dibuja una pantalla y se borra sola (o al guardar algo)
let memoInv = null;
const memo = () => { if(!memoInv){ memoInv = {c: null, s: new Map()}; queueMicrotask(() => { memoInv = null; }); } return memoInv; };
const consumosTodos = () => { const m = memo(); return m.c || (m.c = demo() ? FOLIOS.map(consumoDeFolio).filter(Boolean)
  : (INV.consumos || []).concat(FOLIOS.filter(f => f.estado !== 'enviado' && (f.version || 1) === 1).map(consumoDeFolio).filter(Boolean))); };
function stockDe(u, hasta, sin){
  const m = memo(), k = u + '|' + (hasta || '') + '|' + (sin || ''); let r = m.s.get(k);
  if(!r){ r = invStock_(sin ? INV.movs.filter(x => x.id !== sin) : INV.movs, consumosTodos(), u, hasta); m.s.set(k, r); }
  return r;
}
const minimosDe = u => (u === ALMACEN ? INV.minimos.alm : INV.minimos.cua) || {};
function alertasInv(){
  const out = [];
  ubicaciones().forEach(u => { const st = stockDe(u), min = minimosDe(u); if(st.sinConteo) return;
    MAT_CLAVE.forEach(m => { if(min[m.k] > 0 && (st.stock[m.k] || 0) < min[m.k]) out.push({u, m, stock: st.stock[m.k] || 0, min: min[m.k]}); }); });
  return out;
}
const resumenItems = items => MAT_CLAVE.filter(m => items && items[m.k] > 0).map(m => `${fmtQ(items[m.k])}${m.u === 'm' ? ' m' : ''} ${m.n}`).join(', ');
const porConfirmar = cua => INV.movs.filter(m => !m.anulado && !m.conf && m.a === cua && (m.tipo === 'ENTREGA' || m.tipo === 'TRASPASO'));

async function apiInv(accion, datos){

  })();

let sincInvEnCurso = null;
async function sincInv(){
  if(!USER || USER.rol === 'EXTERNO' || (!demo() && !navigator.onLine)) return;
  if(sincInvEnCurso) return sincInvEnCurso;
  sincInvEnCurso = (async () => {
    try{

        try{ const v = m.actualizado, {subida, error, ...mov} = m; await apiInv('guardarMov', {mov}); m.subida = v; m.error = ''; }catch(e){ m.error = String(e.message || e); } }
      if(veTodo()){
        if(INV.minPend){ try{ await apiInv('guardarMinimos', {minimos: INV.minimos}); INV.minPend = false; }catch(e){} }
      }
      const j = await apiInv('inventario', {});
      j.movs.forEach(r => { const k = INV.movs.findIndex(x => x.id === r.id);
        if(k < 0) INV.movs.push({...r, subida: r.actualizado}); else if(String(r.actualizado) > String(INV.movs[k].actualizado)) INV.movs[k] = {...r, subida: r.actualizado}; });

}

function tablaStock(u){

    $('#vCampos').innerHTML = t === 'ENTRADA' ? `<label>Número de reserva</label><input id="vRes" inputmode="numeric" value="${esc(m.reserva || '')}" placeholder="Opcional"><div class="hint">Material que llega al almacén.</div>`

    ['vDe', 'vA'].forEach(k => { const e = $('#' + k); if(e) e.onchange = () => { m[k === 'vDe' ? 'de' : 'a'] = e.value; }; });
  };
  campos();
  document.querySelectorAll('#vTipo .chip').forEach(b => b.onclick = () => { m.tipo = b.dataset.t; document.querySelectorAll('#vTipo .chip').forEach(x => x.classList.toggle('on', x === b)); campos(); });
  activarInv($('#vMat'), () => {});
  $('#bar').classList.remove('hidden');
  $('#bar').innerHTML = `<button class="btn ghost" id="vCanc" style="flex:.5">Cancelar</button>${prev ? `<button class="btn ghost" id="vAnu" style="flex:.6">${prev.anulado ? 'Restaurar' : 'Anular'}</button>` : ''}<button class="btn verde" id="vOk">Guardar</button>`;

    const r = {ENTRADA: ['', ALMACEN], ENTREGA: [ALMACEN, a], TRASPASO: [de, a], DEVOLUCION: [de, ALMACEN], MERMA: [de, '']}[t];

/* ===== Mini mapa (sin librerías) ===== */
const MAPA_COLORES = {'MARINA':'#2a7ab8','MALECON':'#c2702a','NUEVO VALLARTA':'#2f9e5b','BUCERIAS':'#8b5cc4','PUNTA MITA':'#c4415e'};
function abrirMapa(coordsTxt, alElegir, opts = {}){   // opts: titulo, hint, lineas, puntos, soloVer
  const inicial = parseCoords(coordsTxt);
  let pt = inicial, z = inicial ? 17 : 12;
  const S = z => 256 * 2 ** z;
  const wx = (lon,z) => (lon + 180) / 360 * S(z);
  const wy = (lat,z) => { const s = Math.sin(lat*Math.PI/180); return (0.5 - Math.log((1+s)/(1-s)) / (4*Math.PI)) * S(z); };
  const ilon = (x,z) => x / S(z) * 360 - 180;
  const ilat = (y,z) => { const n = Math.PI - 2*Math.PI*y/S(z); return 180/Math.PI*Math.atan(Math.sinh(n)); };
  let c0 = inicial || CENTRO_MAPA, ajustado = false;
  const pts = opts.puntos || [];
  if(!inicial && pts.length){               // sin punto previo: encuadra todos los 2N
    const la = pts.map(p => p.lat), lo = pts.map(p => p.lng), a = Math.min(...la), b = Math.max(...la), c = Math.min(...lo), d = Math.max(...lo);
    c0 = [(a + b) / 2, (c + d) / 2]; z = 17; while(z > 10 && (wx(d,z) - wx(c,z) > 320 || wy(a,z) - wy(b,z) > 380)) z--; ajustado = true; }
  let sel = opts.soloVer && inicial ? pts.find(p => Math.abs(p.lat - inicial[0]) < 1e-6 && Math.abs(p.lng - inicial[1]) < 1e-6) || null : null;
  let cx = wx(c0[1], z), cy = wy(c0[0], z), ox = 0, oy = 0;
  let yo = null;                                   // dónde está el teléfono (punto azul)
  const {o, cerrar} = ventana(opts.titulo || 'Toca el mapa para marcar el punto',
    `<div class="mv" id="mv"><div id="mt"></div><svg id="ms"><g id="mg"></g></svg><div class="yo hidden" id="myo"></div>
       <svg class="pin hidden" id="mpin" viewBox="0 0 30 40" aria-hidden="true"><path d="M15 39C15 39 2 23 2 14a13 13 0 0 1 26 0c0 9-13 25-13 25z" fill="#d93025" stroke="#a50e0e" stroke-width="1.5"/><circle cx="15" cy="14" r="5" fill="#fff"/></svg>
       <div class="mhint" id="mhint">${opts.hint || 'Toca el mapa donde está el daño.'}</div>
       <div class="mzoom"><button id="mzi" aria-label="Acercar">+</button><button id="mzo" aria-label="Alejar">−</button></div><div class="mattr">© OpenStreetMap</div></div>
     <div class="minfo" id="minf"></div>`,
    `<button class="btn ghost" id="mgps" style="${opts.soloVer ? '' : 'flex:0 0 auto;width:auto;'}white-space:nowrap;padding:14px 12px">📍 Mi ubicación</button>${opts.soloVer ? '<button class="hidden" id="mok"></button>' : '<button class="btn verde" id="mok">Usar este punto</button>'}`, true);
  const mv = o.querySelector('#mv'), mt = o.querySelector('#mt'), mg = o.querySelector('#mg'), pin = o.querySelector('#mpin'), yoEl = o.querySelector('#myo');
  const tiles = new Map();
  function zonas(){
    ox = cx; oy = cy;
    mg.innerHTML = CLUSTERS_GEO.map(zn => {
      const col = MAPA_COLORES[zn.cluster] || '#555';
      const dd = 'M' + zn.p.map(([lon,lat]) => (wx(lon,z)-ox).toFixed(1)+' '+(wy(lat,z)-oy).toFixed(1)).join('L') + 'Z';
      return `<path d="${dd}" fill="${col}" fill-opacity=".07" stroke="${col}" stroke-opacity=".55" stroke-width="1.5"/>`;
    }).join('')
    + (opts.lineas || []).map(l => `<path d="M${l.c.map(([la,lo]) => (wx(lo,z)-ox).toFixed(1)+' '+(wy(la,z)-oy).toFixed(1)).join('L')}" fill="none" stroke="${l.color || '#7a5cc4'}" stroke-width="3" stroke-opacity=".85" stroke-linecap="round" stroke-linejoin="round"/>`).join('')
    + pts.map(p => `<circle cx="${(wx(p.lng,z)-ox).toFixed(1)}" cy="${(wy(p.lat,z)-oy).toFixed(1)}" r="${z >= 16 ? 7 : 5}" fill="${p.color}" stroke="#fff" stroke-width="2"/>`).join('');
  }
  function pintar(){
    const W = mv.clientWidth, H = mv.clientHeight, x0 = cx - W/2, y0 = cy - H/2, n = 2 ** z, vistos = new Set();
    for(let tx = Math.floor(x0/256); tx <= Math.floor((x0+W)/256); tx++)
      for(let ty = Math.floor(y0/256); ty <= Math.floor((y0+H)/256); ty++){
        if(ty < 0 || ty >= n) continue;
        const k = `${z}/${((tx % n) + n) % n}/${ty}`; vistos.add(k+'@'+tx);
        let im = tiles.get(k+'@'+tx);
        if(!im){ im = new Image(); im.alt=''; im.onerror = () => { im.style.visibility='hidden'; }; im.src = `https://tile.openstreetmap.org/${k}.png`; tiles.set(k+'@'+tx, im); mt.appendChild(im); }

    const pp = opts.soloVer ? (sel && [sel.lat, sel.lng]) : pt;
    pin.classList.toggle('hidden', !pp);
    if(pp){ pin.style.left = (wx(pp[1],z) - x0) + 'px'; pin.style.top = (wy(pp[0],z) - y0) + 'px'; }
    if(yo){ yoEl.classList.remove('hidden'); yoEl.style.left = (wx(yo[1],z) - x0) + 'px'; yoEl.style.top = (wy(yo[0],z) - y0) + 'px'; }
  }
  function info(){

    o.querySelector('#mhint').innerHTML = pt ? 'Si no es el lugar exacto, toca otra vez para mover el pin.' : (opts.hint || 'Toca el mapa donde está el daño.');
    if(!pt){ el.innerHTML = navigator.onLine ? '<span class="hint">Arrastra para moverte; + y − para acercar.</span>' : '<div class="hint warn">Sin señal: solo se ven las zonas y los mapas que ya se habían cargado.</div>'; return; }
    const r = clusterDe(pt[0], pt[1]);
    el.innerHTML = `<b>${pt[0].toFixed(6)}, ${pt[1].toFixed(6)}</b> · ${r ? esc(r.cluster) + (r.km ? ' (cerca)' : '') : 'fuera de las zonas'}${navigator.onLine ? '' : '<div class="hint warn">Sin señal: solo se ven las zonas y los mapas que ya se habían cargado.</div>'}`;
  }
  function zoom(dz){
    const nz = Math.max(10, Math.min(19, z + dz)); if(nz === z) return;
    const lat = ilat(cy, z), lon = ilon(cx, z); z = nz; cx = wx(lon, z); cy = wy(lat, z); zonas(); pintar();
  }
  const ptrs = new Map(); let ini = null, pinch = null;
  mv.addEventListener('pointerdown', e => { if(e.target.closest('.mzoom,.mhint')) return; mv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]);
    if(ptrs.size === 1) ini = {x:e.clientX, y:e.clientY, cx, cy, mov:false};
    if(ptrs.size === 2){ const [a,b] = [...ptrs.values()]; pinch = Math.hypot(a[0]-b[0], a[1]-b[1]); if(ini) ini.mov = true; } });
  mv.addEventListener('pointermove', e => { if(!ptrs.has(e.pointerId)) return; ptrs.set(e.pointerId, [e.clientX, e.clientY]);
    if(ptrs.size === 2 && pinch){ const [a,b] = [...ptrs.values()], dd = Math.hypot(a[0]-b[0], a[1]-b[1]);
      if(dd/pinch > 1.5){ zoom(1); pinch = dd; } else if(dd/pinch < 0.67){ zoom(-1); pinch = dd; } return; }
    if(!ini) return; const dx = e.clientX - ini.x, dy = e.clientY - ini.y;
    if(Math.abs(dx) + Math.abs(dy) > 8) ini.mov = true;
    if(ini.mov){ cx = ini.cx - dx; cy = ini.cy - dy; pintar(); } });
  const fin = e => { if(!ptrs.has(e.pointerId)) return; ptrs.delete(e.pointerId);
    if(ptrs.size === 1){ const [q] = [...ptrs.values()]; ini = {x:q[0], y:q[1], cx, cy, mov:true}; pinch = null; return; }   // soltó un dedo: sigue desde aquí
    if(ptrs.size === 0){ if(ini && !ini.mov && e.type === 'pointerup'){ const r = mv.getBoundingClientRect();
        const px = cx - r.width/2 + (e.clientX - r.left), py = cy - r.height/2 + (e.clientY - r.top);
        let cerca = null, dmin = 22; pts.forEach(p => { const dd = Math.hypot(wx(p.lng,z) - px, wy(p.lat,z) - py); if(dd < dmin){ dmin = dd; cerca = p; } });
        if(opts.soloVer) sel = cerca; else pt = cerca ? [cerca.lat, cerca.lng] : [ilat(py, z), ilon(px, z)];
        pintar(); info(); }
      ini = null; pinch = null; } };
  mv.addEventListener('pointerup', fin); mv.addEventListener('pointercancel', fin);
  mv.addEventListener('wheel', e => { e.preventDefault(); zoom(e.deltaY < 0 ? 1 : -1); }, {passive:false});
  o.querySelector('#mzi').onclick = () => zoom(1); o.querySelector('#mzo').onclick = () => zoom(-1);
  const buscarYo = (marcar) => {
    if(!navigator.geolocation){ if(marcar) toast('Este teléfono no da ubicación'); return; }
    if(marcar) toast('Buscando GPS…');
    navigator.geolocation.getCurrentPosition(p => {
      if(!o.isConnected) return;
      yo = [p.coords.latitude, p.coords.longitude];
      if(marcar && !opts.soloVer){ pt = yo.slice(); }
      if(marcar || (!inicial && !ajustado)){ z = Math.max(z, 17); cx = wx(yo[1], z); cy = wy(yo[0], z); zonas(); }   // sin punto previo: abre donde estás
      pintar(); info();
    }, () => { if(marcar) toast('No se pudo obtener el GPS'); }, {enableHighAccuracy:true, timeout:20000, maximumAge:30000});
  };
  o.querySelector('#mgps').onclick = () => buscarYo(true);
  buscarYo(false);                                  // al abrir: muestra el punto azul de dónde estás
  o.querySelector('#mok').onclick = () => { if(opts.soloVer) return cerrar(); if(!pt) return toast('Toca el mapa para marcar el punto'); alElegir(pt[0], pt[1]); cerrar(); };
  addEventListener('resize', pintar); o.addEventListener('cerrar', () => removeEventListener('resize', pintar));
  zonas(); requestAnimationFrame(() => { pintar(); info(); });
}

/* ===== Escáner de QR ===== */
async function escanearQR(alLeer){
  if(!('BarcodeDetector' in window)) return toast('Este navegador no lee QR. Abre la app en Chrome o escribe el código.');
  let det; try{ det = new BarcodeDetector({formats:['qr_code']}); }catch(e){ return toast('Este teléfono no lee QR; escribe el código.'); }
  const {o, cerrar} = ventana('Escanear QR', `<div class="mbody"><video class="qr" playsinline muted></video><div class="hint" id="qrh">Apunta la cámara al QR de segundo nivel.</div></div>`);
  const video = o.querySelector('video'); let stream = null, vivo = true;
  o.addEventListener('cerrar', () => { vivo = false; if(stream) stream.getTracks().forEach(t => t.stop()); });
  try{ stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}, audio:false});
    if(!vivo){ stream.getTracks().forEach(t => t.stop()); return; }      // se cerró mientras pedía la cámara
    video.srcObject = stream; await video.play(); }
  catch(e){ o.querySelector('#qrh').className='hint err'; o.querySelector('#qrh').textContent = 'No se pudo abrir la cámara. Revisa el permiso de cámara para esta app.'; return; }
  const ciclo = async () => {
    if(!vivo) return;
    try{ const r = await det.detect(video); if(r.length){ const raw = r[0].rawValue.trim(), m = raw.match(/TP\s*-?\s*\d{4,}/i);
        alLeer(m ? m[0].replace(/[\s-]/g,'').toUpperCase() : raw.slice(0,60)); if(navigator.vibrate) navigator.vibrate(80); cerrar(); return; } }catch(e){}
    setTimeout(ciclo, 250);
  };
  ciclo();
}

function sugerenciasPara(causa){
  const s = CFG.sugerencias.porCausa, c = canonCausa(causa), k = Object.keys(s).find(x => x !== '_GENERAL' && canonCausa(x) === c);
  return (k && s[k]) || s._GENERAL || [];
}
function tipico(h, causa){ const x = sugerenciasPara(causa).find(([k]) => k === h); return x ? x[1] : null; }

  function pintarLista(t){

    const its = vis[t].map(h => CATALOGO[t].find(i => i.h === h)).filter(Boolean);
    cont.innerHTML = its.length ? its.map(it => { const v = d[it.h] ?? '', m = it.uni === 'm', t0 = tipico(it.h, causa), tp = t0 == null ? null : (m ? t0 : Math.max(1, Math.round(t0)));

/* ===== Mensajes de afectación masiva ===== */
const fmtCorta = v => { if(!completa(v)) return ''; const [f,h] = v.split('T'), [y,m,dd] = f.split('-'); return `${dd}/${m}/${y.slice(2)} ${h.slice(0,5)}`; };
const nombresCortos = d => String(d['TECNICO QUE ATIENDE']||'').split(',').map(n => n.trim().split(' ')[0]).filter(Boolean).join(', ');
function listaMaterial(d){
  return MATERIALES.filter(([h]) => parseFloat(d[h]) > 0).map(([h,n,u]) => `${d[h]}${u==='m'?' m':''} ${MAY(n)}`).join(', ');
}
function scriptMasiva(n, d){
  const v = k => d[k] ?? '', c = parseCoords(v('COORDENADAS')), cp = v('COORD PUNTO DE MEDICION') || v('COORDENADAS');
  const qr = v('MAS DE UN CIERRE') === 'SI' ? QR_VARIOS : v('QR SEGUNDO NIVEL');
  if(n === 1) return [`SD:${v('FOLIO/OS')}`, `Sɪᴛɪᴏ / punto de medición: ${v('PUNTO DE MEDICION')}`, `Coordenadas: ${cp}`,
    `Proveedor: ${v('PROVEEDOR')}`, `Distrito: ${DISTRITO}`, `Nombre: ${nombresCortos(d)}`].join('\n');
  if(n === 2) return [`SD: ${v('FOLIO/OS')}`, `Causa del daño: ${v('CAUSA DE DAÑO')}`, `Acción correctiva: ${v('ACCION CORRECTIVA')}`, `ETR: ${v('ETR')}`,
    `Capacidad de FO: ${v('CALIBRE FO')}`, `Coordenadas:   ${c ? c[0].toFixed(6)+'° '+c[1].toFixed(6)+'°' : ''}`,
    `Materiales a utilizar: ${v('MATERIALES A UTILIZAR')}`, `Numero QR: ${qr}`].join('\n');
  const llegada = v('FECHA Y HORA DE LLEGADA'), dia = llegada.slice(0,10);
  const med = completa(v('HORA 1ER MEDICION')) ? fmtCorta(v('HORA 1ER MEDICION')) : (v('HORA 1ER MEDICION') && dia ? fmtCorta(dia + 'T' + v('HORA 1ER MEDICION')) : '');
  const pi = v('PAUSA INICIO'), pf = v('PAUSA FIN');
  let total = '', pausa = pi && pf ? pi + ' - ' + pf : '';
  if(completa(pi) && completa(pf)){ const m = Math.round((new Date(pf) - new Date(pi)) / 60000); pausa = fmtCorta(pi) + ' - ' + fmtCorta(pf);
    total = m < 0 ? '' : m >= 60 ? `${Math.floor(m/60)} h ${m%60} min` : `${m} min`; }
  else if(pi && pf && !completa(pi) && !completa(pf)){ const [a,b] = pi.split(':').map(Number), [x,y] = pf.split(':').map(Number); let m = (x*60+y) - (a*60+b); if(m < 0) m += 1440; total = m >= 60 ? `${Math.floor(m/60)} h ${m%60} min` : `${m} min`; }
  else pausa = '';
  return [`FOLIO: ${v('FOLIO/OS')}`, `|CIUDAD: ${v('CIUDAD')}`, `|ESTADO: ${v('ESTADO')}`, `|CLUSTER: ${v('CLUSTER')}`, `|OLT: ${v('OLT')}`,
    `|CLIENTES_AFECTADOS:  ${v('CLIENTES AFECTADOS')||0} clientes Totalplay, ${v('CLIENTES ENLACE')||0} clientes enlace, ${v('CLIENTES TFE')||0} clientes TFE`,
    `|FALLA_REPORTADA: ${MAY(sinAcento(v('FALLA REPORTADA')))}`,
    `|FECHA_Y_HR_DE_ASG_DESP: ${fmtCorta(v('FECHA Y HORA DE ASIGNACIÓN'))}`, `|FECHA_Y_HR_DE_ASG_PROV: ${fmtCorta(v('FECHA Y HORA DE ASIGNACIÓN'))}`,
    `|HR_DE_LLEGADA_A_LA_ZON: ${fmtCorta(llegada)}`, `|HR_DE_LA_1er_MEDICION: ${med}`,
    `|UBICACIÓN_DE_1er_,_2do_NIVEL_Y_DERIVACION_CON_SUS_FIBRA:`,
    `|CAUSA_DEL_DAÑO: ${v('CAUSA DE DAÑO')}`, `|UBICACIÓN_DEL_DAÑO: ${v('UBICACIÓN DEL DAÑO')}`, `|COORDENADAS:  ${v('COORDENADAS')}`,
    `|DESCRIP_DE_ACTIVIDADES: ${MAY(v('DESCIPCIÓN DE ACTIVIDADES'))}`, `|POTENCIA_INICIAL: ${MAY(v('POTENCIA INICIAL'))}`, `|POTENCIA_FINAL: ${MAY(v('POTENCIA FINAL'))}`,
    `|TRABAJOS_REALIZADOS: ${MAY(v('ACCION CORRECTIVA'))}`, `|CALIBRE_DEL_CAB-024H 96H: ${v('CALIBRE FO')}`,
    `|FECHA_HR_FINAL_DE_REPARACION: ${fmtCorta(v('HORA FINAL'))}`, `|QR DE SEGUNDO NIVEL: ${qr}`, `|ATIENDE_NOM_TEC: ${nombresCortos(d)}`,
    `|PROVEDOR: ${v('PROVEEDOR')}`, `|SUPERVISOR DISTRITO: ${v('SUPERVISOR DISTRITO')}`, `|TIPO DE MANTENIMIENTO: ${v('TIPO DE MANTENIMIENTO')}`,
    `|MATERIAL UTILIZADO: ${v('MATERIAL UTILIZADO TEXTO') || listaMaterial(d)}`, `|PAUSA HORA INICIAL Y FINAL: ${pausa}`, `|MOTIVO DE PAUSA: ${v('MOTIVO DE PAUSA')}`,
    `|TIEMPO TOTAL DE PAUSA: ${total}`].join('\n');
}

/* ===== Foto de evidencia: imprime fecha, hora, coordenadas y folio sobre la imagen =====
   Coordenadas: las que trae la foto (si la cámara guardó ubicación) > GPS en ese momento > las del folio. */
function gpsDeFoto(buf){
  const b = new DataView(buf); if(b.getUint16(0) !== 0xFFD8) return null; let o = 2;
  while(o < b.byteLength - 4){ const m = b.getUint16(o); if(m === 0xFFE1) return tiffGps(b, o + 4); if((m & 0xFF00) !== 0xFF00) break; o += 2 + b.getUint16(o + 2); }
  return null;
}
function tiffGps(b, s){
  if(b.getUint32(s) !== 0x45786966) return null; const t = s + 6, le = b.getUint16(t) === 0x4949, g16 = o => b.getUint16(o, le), g32 = o => b.getUint32(o, le);
  const ifd = o => { const n = g16(o), r = {}; for(let i = 0; i < n; i++){ const e = o + 2 + i*12; r[g16(e)] = {v: e + 8}; } return r; };
  const i0 = ifd(t + g32(t + 4)); if(!i0[0x8825]) return null; const gi = ifd(t + g32(i0[0x8825].v)); if(!gi[2] || !gi[4]) return null;
  const rat = e => { const p = t + g32(e.v); let a = []; for(let i = 0; i < 3; i++){ const dd = g32(p + i*8 + 4); a.push(dd ? g32(p + i*8) / dd : 0); } return a[0] + a[1]/60 + a[2]/3600; };
  const ch = e => String.fromCharCode(b.getUint8(e.v)); let la = rat(gi[2]), lo = rat(gi[4]);
  if(gi[1] && ch(gi[1]) === 'S') la = -la; if(gi[3] && ch(gi[3]) === 'W') lo = -lo;
  return la || lo ? [la, lo] : null;
}
function fotoEvidencia(d){
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*'; inp.capture = 'environment';
  inp.onchange = async () => {
    const f = inp.files[0]; if(!f) return;
    toast('Preparando foto…');
    let u = await ubicacionDeFoto(f);
    if(!u){ const c = parseCoords(d['COORDENADAS']); if(c) u = {pos: c, origen: 'coordenadas del folio'}; }
    const s = await sellarFoto(f, u && u.pos, u && u.origen, [d['UBICACIÓN DEL DAÑO'] || '', [d['FOLIO/OS'] ? 'SD ' + d['FOLIO/OS'] : '', d['CLUSTER'], nombresCortos(d)].filter(Boolean).join(' · ')]);
    const c = s.cuando, dos = n => String(n).padStart(2, '0');
    const nombre = `SD_${d['FOLIO/OS'] || 'sin_folio'}_${c.getFullYear()}${dos(c.getMonth()+1)}${dos(c.getDate())}_${dos(c.getHours())}${dos(c.getMinutes())}${dos(c.getSeconds())}.jpg`;
    const archivo = new File([s.blob], nombre, {type:'image/jpeg'}), url = URL.createObjectURL(s.blob);
    const {o} = ventana('Foto de evidencia', `<div class="mbody"><img src="${url}" style="width:100%;border-radius:10px"><div class="hint">${esc(nombre)}</div></div>`,
      `<button class="btn ghost" data-a="g" style="flex:.6">Guardar</button><button class="btn verde" data-a="s">Compartir</button>`);
    o.addEventListener('cerrar', () => setTimeout(() => URL.revokeObjectURL(url), 1000));
    o.querySelector('[data-a="g"]').onclick = () => { const a = document.createElement('a'); a.href = url; a.download = nombre; document.body.appendChild(a); a.click(); a.remove(); };
    o.querySelector('[data-a="s"]').onclick = async () => {
      if(navigator.canShare && navigator.canShare({files:[archivo]})){ try{ await navigator.share({files:[archivo]}); }catch(e){} }
      else toast('Este teléfono no permite compartir la foto; usa Guardar.');
    };
  };
  inp.click();
}

    `<button class="btn" id="zOk" style="background:var(--err)">Borrar folio</button>`);
  o.querySelector('#zMot').addEventListener('input', () => { o.querySelector('#zErr').textContent = ''; });
  o.querySelector('#zOk').onclick = async () => {
    const mot = o.querySelector('#zMot').value.trim(), err = o.querySelector('#zErr');
    if(mot.length < 4){ err.textContent = 'Escribe el motivo.'; return; }
    const nuncaEnviado = !f.remoto && f.estado !== 'enviado' && (f.version || 1) === 1;
    if(!demo() && !navigator.onLine && !nuncaEnviado){ err.textContent = 'Necesitas señal: el folio ya está en el Sheets.'; return; }
    const b = o.querySelector('#zOk'); b.disabled = true; b.textContent = 'Borrando…';
    try{
      if(!demo() && navigator.onLine) await api('borrarFolio', {id: f.id, motivo: mot});
      quitarFolioLocal(f.id); cerrar(); toast('Folio borrado'); setTimeout(() => reemplazar('#folios'), 60);
    }catch(e){ err.textContent = e.message; b.disabled = false; b.textContent = 'Borrar folio'; }
  };
}

/* ===== Texto para WhatsApp ===== */
function textoWA(f){
  const d = f.d, v = k => d[k] ?? '';
  const L = [f.editado ? 'Folio corregido' : 'Nuevo Folio',
   `SD/OS: ${v('FOLIO/OS')}`, `OT: ${v('OT')||'N/A'}`, `ÁREA: ${v('ÁREA')}`, `Ciudad: ${v('CIUDAD')}`, `ESTADO: ${v('ESTADO')}`,
   `CLUSTER: ${v('CLUSTER')}`, `OLT: ${v('OLT')}`, `CLIENTES AFECTADOS: ${v('CLIENTES AFECTADOS')}`, `FALLA REPORTADA: ${v('FALLA REPORTADA')}`,
   `FECHA DE ASIGNACIÓN: ${fmtFecha(v('FECHA Y HORA DE ASIGNACIÓN'))}`, `FECHA DE LLEGADA: ${fmtFecha(v('FECHA Y HORA DE LLEGADA'))}`,
   `CAUSA DE DAÑO: ${v('CAUSA DE DAÑO')}`, `UBICACIÓN: ${v('UBICACIÓN DEL DAÑO')}`, `COORDENADAS: ${v('COORDENADAS')}`,
   `ACTIVIDADES: ${v('DESCIPCIÓN DE ACTIVIDADES')}`, `POTENCIA INICIAL: ${v('POTENCIA INICIAL')}`, `POTENCIA FINAL: ${v('POTENCIA FINAL')}`,
   `HORA FINAL: ${fmtFecha(v('HORA FINAL'))}`, 'TRABAJOS REALIZADOS: '];
  CONCEPTOS.forEach(([h]) => L.push(`${h.replace(/\s+/g,' ')}: ${v(h)}`));
  L.push(`QR SEGUNDO NIVEL: ${v('QR SEGUNDO NIVEL')}`, `TÉCNICO QUE ATIENDE: ${v('TECNICO QUE ATIENDE')}`, `PROVEEDOR: ${v('PROVEEDOR')}`,
   `SUPERVISOR TOTALPLAY: ${v('SUPERVISOR DISTRITO')}`, `TIPO DE MANTENIMINETO: ${v('TIPO DE MANTENIMIENTO')}`, 'MATERIAL UTILIZADO: ');
  MATERIALES.forEach(([h]) => L.push(`${h.replace(/\s+/g,' ').trim().replace(/"/g,'')}: ${v(h)}`));
  return L.join('\n');
}

function pantallaVer(id){
  const f = buscarFolio(id); if(!f || !(veTodo() || esMio(f) || miCuadrilla(f) || f.remoto)){ reemplazar('#folios'); return; }
  $('#titulo').textContent = 'Folio ' + f.d['FOLIO/OS'];
  const txt = textoWA(f), ed = puedeEditar(f);
  $('#app').innerHTML = `<div class="card"><div class="lista"><div class="f"><b>${esc(f.d['FOLIO/OS'])}</b><span class="estado ${f.estado}">${{pendiente:'Por enviar',enviado:'Enviado a Sheets',error:'Error al enviar'}[f.estado]}</span></div></div>
     ${f.estado==='error'?`<div class="hint err">${esc(f.error)}</div>`:''}${f.aviso?`<div class="hint warn">${esc(f.aviso)}</div>`:''}${f.usuario && !esMio(f) ? `<div class="hint">Capturó: ${esc(nombreDe(f.usuario))}${f.cuadrilla ? ' · ' + esc(f.cuadrilla) : ''}</div>` : ''}
     ${f.estado==='pendiente'?'<div class="hint">Está guardado en el teléfono. Se envía solo cuando haya señal.</div>':''}</div>
   <div class="card"><h2>Texto para WhatsApp</h2><pre class="wa" id="wa">${esc(txt)}</pre>
     <button class="btn verde" id="bShare">Compartir por WhatsApp</button><button class="btn ghost" id="bCopy">Copiar texto</button>
     <button class="btn ghost sm" id="bFotoV" style="margin-top:6px">📷 Foto con fecha y coordenadas (opcional)</button></div>
   ${ed?'':`<div class="card"><div class="hint">Ya pasaron ${HORAS_EDICION} h; para corregirlo pide al supervisor.</div></div>`}`;
  $('#bar').classList.remove('hidden');
  $('#bar').innerHTML = `<button class="btn ghost" onclick="volver('#folios')">Regresar</button>${veTodo() ? '<button class="btn ghost" id="bBorrar" style="flex:.7;color:var(--err)">Borrar</button>' : ''}${ed?`<button class="btn" onclick="ir('#editar/${f.id}')">Corregir</button>`:''}`;
  const bb = $('#bBorrar'); if(bb) bb.onclick = () => borrarFolio(f);
  $('#bFotoV').onclick = () => fotoEvidencia(f.d);
  $('#bCopy').onclick = async () => { try{ await navigator.clipboard.writeText(txt); toast('Texto copiado'); }catch(e){ const r=document.createRange(); r.selectNode($('#wa')); getSelection().removeAllRanges(); getSelection().addRange(r); document.execCommand('copy'); toast('Texto copiado'); } };
  $('#bShare').onclick = async () => {
    if(navigator.share){ try{ await navigator.share({text:txt}); return; }catch(e){ if(e.name==='AbortError') return; } }
    location.href = 'https://wa.me/?text=' + encodeURIComponent(txt);
  };
}

async function cerrarSesion(){
  if(esDemoUser()){                      // al salir de la demostración se borra todo lo que se probó
    if(!(await preguntar('¿Salir de la demostración? Lo que probaste se borra de este teléfono.', 'Salir'))) return;
    try{ Object.keys(localStorage).filter(k => k.startsWith('fo.demo.') || k === 'fo.espacio').forEach(k => localStorage.removeItem(k)); indexedDB.deleteDatabase('folios-fo-demo'); }catch(e){}
    location.replace(location.pathname + '#'); location.reload(); return;
  }
  const n = FOLIOS.filter(f=>f.estado!=='enviado' && esMio(f)).length;
  if(!(await preguntar(n ? `Hay ${n} folio(s) sin enviar. Se quedan en este teléfono y se envían solos cuando haya señal, aunque entre otra persona. ¿Salir?` : '¿Cerrar sesión?','Salir'))) return;

function cambiarPin(){
  const {o, cerrar} = ventana('Cambiar mi PIN', `<div class="mbody">
    <label>PIN actual</label><input id="kAct" type="password" inputmode="numeric" maxlength="6" autocomplete="off">
    <label>PIN nuevo (4 a 6 números)</label><input id="kNue" type="password" inputmode="numeric" maxlength="6" autocomplete="off">
    <label>Repite el PIN nuevo</label><input id="kRep" type="password" inputmode="numeric" maxlength="6" autocomplete="off">
    <div class="hint">No uses 1234 ni tu fecha de nacimiento. Si lo olvidas, el administrador te da uno nuevo.</div><div id="kErr" class="hint err"></div></div>`,
    `<button class="btn" id="kOk">Cambiar PIN</button>`);
  o.querySelectorAll('input').forEach(i => i.addEventListener('input', () => { i.value = i.value.replace(/\D/g, ''); }));
  o.querySelector('#kOk').onclick = async () => {
    const a = o.querySelector('#kAct').value, n = o.querySelector('#kNue').value, r = o.querySelector('#kRep').value, err = o.querySelector('#kErr');
    const mal = a !== String(USER.pin) ? 'El PIN actual no es correcto.' : !/^\d{4,6}$/.test(n) ? 'El PIN nuevo debe tener de 4 a 6 números.' : n !== r ? 'Los dos PIN nuevos no coinciden.'
      : n === a ? 'El PIN nuevo es igual al actual.' : /^(\d)\1+$/.test(n) || '0123456789'.includes(n) ? 'Ese PIN es muy fácil de adivinar; elige otro.' : '';
    if(mal){ err.textContent = mal; return; }
    if(demo()){ err.textContent = 'En modo demostración el PIN de todos es 1234 y no se cambia.'; return; }
    if(!navigator.onLine){ err.textContent = 'Necesitas señal para cambiar el PIN.'; return; }
    const b = o.querySelector('#kOk'); b.disabled = true; b.textContent = 'Cambiando…';
    try{
      const j = await api('cambiarPin', {pinNuevo: n});
      USER.pin = n; LS.set('usuario', USER);
      const ll = LS.get('llaves', {}); ll[USER.id] = {llave: j.llave, sal: j.sal}; LS.set('llaves', ll);
      const cr = LS.get('creds', {}); if(cr[USER.id]){ cr[USER.id] = n; LS.set('creds', cr); }
      cerrar(); toast('PIN cambiado. Úsalo la próxima vez que entres.');
    }catch(e){ err.textContent = e.message; b.disabled = false; b.textContent = 'Cambiar PIN'; }
  };
}
