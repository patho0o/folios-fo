<script>
// Tema: 'auto' sigue al teléfono; 'claro' u 'oscuro' lo fijan. Se guarda en este teléfono.
function aplicarTema(){
  let t = 'auto'; try{ t = JSON.parse(localStorage.getItem('fo.tema')) || 'auto'; }catch(e){}
  const oscuro = t === 'oscuro' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.tema = oscuro ? 'oscuro' : 'claro';
  document.querySelector('meta[name=theme-color]').content = oscuro ? '#2b2d32' : '#465264';
  let g = false; try{ g = JSON.parse(localStorage.getItem('fo.letra')) === 'grande'; }catch(e){}
  document.documentElement.style.zoom = g ? '1.12' : '';
}
aplicarTema(); matchMedia('(prefers-color-scheme: dark)').addEventListener('change', aplicarTema);
</script>

.dfil{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}.dfil input{flex:2 1 220px;margin:0}.dfil select{flex:1 1 130px;margin:0}
table.tdoc{width:100%;border-collapse:collapse;font-size:13px}
table.tdoc th{position:sticky;top:0;background:var(--sup);text-align:left;font-weight:650;color:var(--gris);padding:8px 6px;border-bottom:1px solid var(--borde);cursor:pointer;white-space:nowrap}

#nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;background:var(--sup);border-top:1px solid var(--borde);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
#nav.hidden,#bar:not(.hidden) ~ #nav{display:none}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;color:var(--gris);font-size:11px;padding:6px 0;border-radius:10px}

.fab{position:fixed;right:16px;bottom:calc(74px + env(safe-area-inset-bottom));z-index:6;border:0;border-radius:999px;background:var(--azul);color:#fff;font-size:15px;font-weight:650;padding:14px 20px;box-shadow:0 4px 14px rgba(0,0,0,.3)}
:root[data-tema="oscuro"] .fab{background:#2a6db0}
.kpis3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.kpi{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 6px;border-radius:14px;background:var(--sup);box-shadow:var(--sombra);cursor:pointer;border:1.5px solid transparent}
.kpi.on{border-color:var(--azul)}.kpi{color:var(--txt);text-decoration:none}.kpi b{font-size:22px}.kpi span{font-size:12px;color:var(--gris)}

/* indicadores de carga */
#carga{position:absolute;left:0;right:0;bottom:-1px;height:3px;overflow:hidden;opacity:0;transition:opacity .2s;pointer-events:none}
#carga.si{opacity:1}
#carga::before{content:"";position:absolute;top:0;bottom:0;width:40%;left:-40%;background:linear-gradient(90deg,transparent,#7fb2ff,#2bea5a,transparent);animation:carga 1.1s ease-in-out infinite}
@keyframes carga{to{left:100%}}
#btnSync .gira{display:inline-block}
#btnSync.girando .gira{animation:gira .9s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}

#app.entra{animation:entra .18s ease-out}
.modal{animation:sube .2s ease-out}
@keyframes entra{from{opacity:.35;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes sube{from{opacity:.4;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#carga::before,#btnSync.girando .gira,button.ocupado::before,#app.entra,.modal{animation:none}}

   Solo con servidor real. Una llave de datos al azar por teléfono, guardada envuelta dos veces:
   con el PIN de cada usuario que ha entrado aquí (para abrir sin señal) y con el secreto que el servidor

const PLANAS = new Set(['fo.tema', 'fo.letra', 'fo.servidor', 'fo.espacio', 'fo.boveda', 'fo.disp', 'fo.sesion', 'fo.cuentas', 'fo.actividad', 'fo.bloqueo', 'fo.fallos', 'fo.aviso']);
const BOV = (() => {
  let _existe = false; try{ _existe = !!localStorage.getItem('fo.boveda'); }catch(e){}
  const st = {on: false, abierta: false, probando: false, mem: new Map(), pend: new Map(), llave: null, raw: null, db: null, escribiendo: null};
  const te = new TextEncoder(), td = new TextDecoder();
  const b64 = u8 => { let s = ''; for(let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); };
  const deb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

  const ponMeta = m => { localStorage.setItem('fo.boveda', JSON.stringify(m)); _existe = true; };
  const abrirDb = () => st.db ? Promise.resolve(st.db) : new Promise((ok, mal) => { const r = indexedDB.open('nodo-boveda', 1);
    r.onupgradeneeded = () => { r.result.createObjectStore('datos'); r.result.createObjectStore('llave'); }; r.onsuccess = () => ok(st.db = r.result); r.onerror = () => mal(r.error); });
  const tx = (tienda, modo, f) => abrirDb().then(d => new Promise((ok, mal) => { const t = d.transaction(tienda, modo), r = f(t.objectStore(tienda)); t.oncomplete = () => ok(r && r.result); t.onerror = () => mal(t.error); }));
  const todo = () => abrirDb().then(d => new Promise((ok, mal) => { const t = d.transaction('datos', 'readonly'), s = t.objectStore('datos'), out = []; const c = s.openCursor();
    c.onsuccess = () => { const x = c.result; if(x){ out.push([x.key, x.value]); x.continue(); } }; t.oncomplete = () => ok(out); t.onerror = () => mal(t.error); }));
  const kdf = async (pin, id, sal) => crypto.subtle.deriveKey({name: 'PBKDF2', salt: te.encode(sal + ':' + id), iterations: 250000, hash: 'SHA-256'},
    await crypto.subtle.importKey('raw', te.encode(String(pin)), 'PBKDF2', false, ['deriveKey']), {name: 'AES-GCM', length: 256}, false, ['encrypt', 'decrypt']);
  const kSrv = ks => crypto.subtle.importKey('raw', deb64(ks), 'AES-GCM', false, ['encrypt', 'decrypt']);

  const descifra = (k, x) => crypto.subtle.decrypt({name: 'AES-GCM', iv: x.iv}, k, x.c);

  const importar = raw => crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['encrypt', 'decrypt']);
  async function cargar(){                       // descifra todo a memoria
    st.mem.clear();
    for(const [k, v] of await todo()){ try{ st.mem.set(k, td.decode(await descifra(st.llave, v))); }catch(e){} }
  }
  function programar(){
    if(st.escribiendo) return;
    st.escribiendo = (async () => { await null;
      while(st.pend.size){ const [[k, v]] = st.pend; st.pend.delete(k);
        try{ if(v === null) await tx('datos', 'readwrite', s => s.delete(k)); else { const x = await cifra(st.llave, te.encode(v)); await tx('datos', 'readwrite', s => s.put(x, k)); } }catch(e){ console.log('bóveda', e); } }
      st.escribiendo = null; })();
  }
  const llaveBio = async u8 => crypto.subtle.importKey('raw', await crypto.subtle.digest('SHA-256', u8), 'AES-GCM', false, ['encrypt', 'decrypt']);
  const prfDe = async (credId, sal) => {
    const a = await navigator.credentials.get({publicKey: {challenge: crypto.getRandomValues(new Uint8Array(32)), rpId: location.hostname,
      allowCredentials: [{type: 'public-key', id: credId}], userVerification: 'required', timeout: 60000, extensions: {prf: {eval: {first: sal}}}}});
    const r = a.getClientExtensionResults ? a.getClientExtensionResults() : {}, f = r.prf && r.prf.results && r.prf.results.first;
    if(!f) throw new Error('Este teléfono no entregó la llave de la huella. Sigue con tu PIN.');
    return new Uint8Array(f);
  };
  const guardaLlave = (limiteMin) => tx('llave', 'readwrite', s => s.put({k: st.llave, limite: limiteMin * 60e3}, 'dek')).catch(() => {});
  return {
    get on(){ return st.on; }, get abierta(){ return st.abierta; }, get probando(){ return st.probando; },
    existe: () => _existe, meta, olvidar(){ _existe = false; },
    tienePin: id => !!((meta() || {}).envPin || {})[id],
    get: k => st.mem.get(k), escribir(k, v){ if(!st.abierta) return; st.mem.set(k, v); st.pend.set(k, v); programar(); },
    borrar(k){ if(!st.abierta) return; st.mem.delete(k); st.pend.set(k, null); programar(); },
    claves: () => [...st.mem.keys()],
    flush: () => st.escribiendo || Promise.resolve(),
    // primera vez en este teléfono (o tras un borrado): crea la llave y pasa a la bóveda lo que había sin cifrar
    async crear(id, pin, ks, limiteMin){

      st.raw = raw; st.llave = await importar(raw); st.on = st.abierta = true;
      const mover = Object.keys(localStorage).filter(k => k.startsWith('fo.') && !PLANAS.has(k) && !k.startsWith('fo.demo.'));
      mover.forEach(k => { const v = localStorage.getItem(k); st.mem.set(k, v); st.pend.set(k, v); });

    async abrirConPin(id, pin, limiteMin){        // sin señal: con el PIN de alguien que ya entró aquí

    },
    async abrirConServidor(id, pin, ks, limiteMin){   // con señal: el secreto del teléfono que dio el servidor
      const m = meta(); const raw = await desenvolver(m.envSrv, await kSrv(ks));
      st.raw = raw; st.llave = await importar(raw); await cargar(); st.on = st.abierta = true;
      m.envPin = m.envPin || {}; m.envPin[id] = await envolver(raw, await kdf(pin, id, m.sal)); ponMeta(m); await guardaLlave(limiteMin);
    },
    async cambiarPinLocal(id, viejo, nuevo){ const m = meta(); if(!m || !m.envPin || !m.envPin[id]) return;
      const raw = st.raw || await desenvolver(m.envPin[id], await kdf(viejo, id, m.sal)); m.envPin[id] = await envolver(raw, await kdf(nuevo, id, m.sal)); ponMeta(m); },
    async agregarPin(id, pin){ if(!st.raw) return; const m = meta(); m.envPin[id] = await envolver(st.raw, await kdf(pin, id, m.sal)); ponMeta(m); },
    tieneBio: id => !!((meta() || {}).envBio || {})[id],
    hayBio: () => Object.keys((meta() || {}).envBio || {}).length > 0,
    async activarBio(id, nombre, pin){
      if(!window.PublicKeyCredential || !navigator.credentials || !window.isSecureContext) throw new Error('Este navegador no permite usar la huella en NODO.');
      const m = meta(), env = m && m.envPin && m.envPin[id]; if(!env) throw new Error('Primero entra con tu PIN en este teléfono.');
      let raw; try{ raw = await desenvolver(env, await kdf(pin, id, m.sal)); }catch(e){ throw new Error('PIN incorrecto'); }
      const sal = crypto.getRandomValues(new Uint8Array(32));
      const cred = await navigator.credentials.create({publicKey: {challenge: crypto.getRandomValues(new Uint8Array(32)), rp: {name: 'NODO', id: location.hostname},
        user: {id: crypto.getRandomValues(new Uint8Array(16)), name: id, displayName: nombre || id},
        pubKeyCredParams: [{type: 'public-key', alg: -7}, {type: 'public-key', alg: -257}],
        authenticatorSelection: {authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'discouraged'}, timeout: 60000,
        extensions: {prf: {eval: {first: sal}}}}});
      const ext = cred.getClientExtensionResults ? cred.getClientExtensionResults() : {};
      if(!ext.prf || ext.prf.enabled === false) throw new Error('Este teléfono no permite usar la huella para abrir los datos cifrados. Sigue con tu PIN.');
      const credId = new Uint8Array(cred.rawId);
      let out = ext.prf.results && ext.prf.results.first ? new Uint8Array(ext.prf.results.first) : await prfDe(credId, sal);
      const m2 = meta(); m2.envBio = m2.envBio || {}; m2.envBio[id] = {cred: b64(credId), sal: b64(sal), env: await envolver(raw, await llaveBio(out))}; ponMeta(m2); return true;
    },
    async abrirConBio(id, limiteMin){
      const b = ((meta() || {}).envBio || {})[id]; if(!b) throw new Error('La huella no está activada para este usuario.');

      let raw; try{ raw = await desenvolver(b.env, await llaveBio(out)); }catch(e){ throw new Error('No se pudo abrir con la huella. Entra con tu PIN.'); }

    },
    quitarBio(id){ const m = meta(); if(m && m.envBio){ delete m.envBio[id]; ponMeta(m); } },
    async verificarPin(id, pin){ const m = meta(), env = m && m.envPin && m.envPin[id]; if(!env) return null; try{ await desenvolver(env, await kdf(pin, id, m.sal)); return true; }catch(e){ return false; } },
    async desdeCache(){                           // al abrir la app: si no ha pasado el tiempo de bloqueo, abre sola
      if(!meta()) return false; st.probando = true;
      try{ const r = await tx('llave', 'readonly', s => s.get('dek')); if(!r || !r.k) return false;
        const ult = +(localStorage.getItem('fo.actividad') || 0); if(!ult || Date.now() - ult > r.limite){ await tx('llave', 'readwrite', s => s.delete('dek')); return false; }
        st.llave = r.k; await cargar(); st.on = st.abierta = true; return true;
      }catch(e){ return false; } finally{ st.probando = false; }
    },
    async bloquear(){ await (st.escribiendo || null); try{ await tx('llave', 'readwrite', s => s.delete('dek')); }catch(e){} st.mem.clear(); st.abierta = false; st.llave = st.raw = null; },
    async borrarTodo(){                           // baja del teléfono: no queda nada de la app
      try{ Object.keys(localStorage).filter(k => k.startsWith('fo.') && k !== 'fo.tema' && k !== 'fo.letra').forEach(k => localStorage.removeItem(k)); }catch(e){}

      for(const n of ['nodo-boveda', 'folios-fo', 'folios-fo-demo']) try{ indexedDB.deleteDatabase(n); }catch(e){}

    },
    async cifrarBlob(v){ if(!st.abierta || v == null) return v; const esBlob = v instanceof Blob, u8 = esBlob ? new Uint8Array(await v.arrayBuffer()) : te.encode(JSON.stringify(v));

    async descifrarBlob(v){ if(!v || !v.bov) return v; if(!st.abierta) throw new Error('La app está bloqueada.'); const d = await descifra(st.llave, v);
      return v.blob ? new Blob([d], {type: v.t}) : JSON.parse(td.decode(d)); },
  };
})();

let avisoSalir = false;
addEventListener('popstate', e => {
  if(MODALES.length){ MODALES.pop()(); return; }
  if(e.state && e.state.raiz){          // en la pantalla de inicio: pide confirmar con otro "atrás"
    avisoSalir = true; toast('Toca atrás otra vez para salir');
    setTimeout(() => { if(avisoSalir && history.state && history.state.raiz){ history.pushState({n:0, guardia:1}, '', location.href); } avisoSalir = false; }, 2000);
    return;
  }
  router();

/* Plus Codes de Google ("MQRJ+V4F" o "75FCMQRJ+V4F"). Los cortos se completan con la zona de trabajo (Puerto Vallarta). */
const OLC = '23456789CFGHJMPQRVWX', OLC_RES = [20, 1, 0.05, 0.0025, 0.000125];
function olcLargo(la, lo){                     // código de 11 dígitos, "75GPMPRG+GH5"
  la = Math.min(Math.max(la, -90), 90); lo = ((lo + 180) % 360 + 360) % 360 - 180;
  let a = Math.floor(Math.round((la + 90) * 2.5e7 * 1e6) / 1e6), b = Math.floor(Math.round((lo + 180) * 8.192e6 * 1e6) / 1e6);

  const g = OLC[(a % 5) * 4 + (b % 4)]; a = Math.floor(a / 5); b = Math.floor(b / 4);
  let c = ''; for(let i = 0; i < 5; i++){ c = OLC[a % 20] + OLC[b % 20] + c; a = Math.floor(a / 20); b = Math.floor(b / 20); }
  return c.slice(0, 8) + '+' + c.slice(8) + g;

function olcGoogle(la, lo){
  const largo = olcLargo(la, lo);
  let mejor = null; OLC_LUGARES.forEach(([y, x, n]) => { const d = Math.max(Math.abs(y - la), Math.abs(x - lo)); if(!mejor || d < mejor.d) mejor = {d, n}; });

function olcDecodificar(code){                  // código completo → centro de su cuadro
  const d = code.replace('+', '').replace(/0+$/, ''); let la = -90, lo = -180, ra = 20, rb = 20;
  for(let i = 0; i < Math.min(d.length, 10); i += 2){ const r = OLC_RES[i / 2]; ra = rb = r;
    la += OLC.indexOf(d[i]) * r; if(d[i + 1]) lo += OLC.indexOf(d[i + 1]) * r; }
  for(let i = 10; i < d.length; i++){ const v = OLC.indexOf(d[i]); ra /= 5; rb /= 4; la += Math.floor(v / 4) * ra; lo += (v % 4) * rb; }
  return [la + ra / 2, lo + rb / 2];

function plusCode(s){
  const m = String(s || '').toUpperCase().match(/(?:^|[^0-9A-Z])([23456789CFGHJMPQRVWX]{2,8}\+[23456789CFGHJMPQRVWX]{0,3})(?![0-9A-Z])/);
  if(!m) return null;
  const code = m[1], pos = code.indexOf('+');
  if(pos === 8) return olcDecodificar(code);
  if(pos % 2 || pos < 2) return null;
  const [rLa, rLo] = CENTRO_MAPA, falta = 8 - pos, res = Math.pow(20, 2 - falta / 2), med = res / 2;
  let [la, lo] = olcDecodificar(olcCodificar(rLa, rLo).replace('+', '').slice(0, falta) + code);
  if(rLa + med < la && la - res >= -90) la -= res; else if(rLa - med > la && la + res <= 90) la += res;
  if(rLo + med < lo) lo -= res; else if(rLo - med > lo) lo += res;
  return [la, lo];

// Vigencia de la sesión guardada (el token trae su vencimiento; la firma la revisa el servidor)
function tokenVigente(t){
  try{ const c = String(t).split('.')[0].replace(/-/g, '+').replace(/_/g, '/'); const p = JSON.parse(decodeURIComponent(escape(atob(c + '==='.slice((c.length + 3) % 4))))); return p.e > Date.now() + 36e5; }

async function entrar(u, pin){
  if(demo()){ if(pin !== '1234') throw new Error('PIN incorrecto'); return {}; }
  if(BOV.existe() && BOV.tienePin(u.id)){
    const ok = await BOV.verificarPin(u.id, pin);
    if(ok === false) throw new Error('PIN incorrecto');
    // Desbloqueo: si este teléfono ya tiene una sesión vigente, basta el PIN (sin código del autenticador).
    // El servidor la sigue validando en cada petición; si la cerraron o venció, pide entrar de nuevo.
    // (los perfiles viven dentro de la bóveda: primero se abre con el PIN)
    if(!BOV.abierta){ try{ await BOV.abrirConPin(u.id, pin, limiteInactividad(cuentasTel().find(c => c.id === u.id) || u)); }catch(e){} }
    const pv = BOV.abierta ? LS.get('perfiles', {})[u.id] : null;
    if(pv && pv.token && tokenVigente(pv.token)) return {...pv, _offline: true};
    if(navigator.onLine){
      try{ return await loginServidor(u, pin); }
      catch(e){ if(e.codigo || !/conexión|señal/i.test(e.message)) throw e; }    // sin respuesta: entra sin señal
    }
    const pf = LS.get('perfiles', {})[u.id];
    if(!BOV.abierta) await BOV.abrirConPin(u.id, pin, limiteInactividad(pf));
    if(!pf) throw new Error('Necesitas señal para entrar.');
    return {...pf, _offline: true};
  }
  if(!navigator.onLine) throw new Error('La primera vez que entras en este teléfono necesitas señal.');
  return loginServidor(u, pin);
}

    catch(e){
      if(e.codigo === 'totp' || e.codigo === 'totp_alta'){ codigo = await pedirCodigo(e.codigo, e.datos || {}, codigo ? e.message : ''); if(!codigo) throw new Error('Entrada cancelada.'); continue; }

    }catch(e){

/* ===== Seguimiento de afectaciones masivas (solo ADMIN) =====
   Se pega el mensaje con el que asignan el folio; la app saca folio, OLT, clientes, ingeniero y link.
   Conforme el técnico reporta, se llenan los datos de cada etapa y se copian los 3 mensajes.
   Se guarda en el teléfono y en la hoja MASIVAS del Sheets (para verlo desde otro teléfono). */
let MASIVAS = LS.get('masivas', []);
const guardarMasivas = () => LS.set('masivas', MASIVAS);
function leerAsignacion(txt){
  const t = String(txt||''), m = (re, i = 1) => { const x = t.match(re); return x ? x[i].trim() : ''; };
  const r = {folio: m(/(?:^|\n|\])\s*(?:[^\n:]*:\s*)?(\d{6,9})\s*(?:\n|$)/) || m(/\b(\d{7,9})\b/), olt: m(/OLT\s+([A-Z0-9_]+)/i).toUpperCase(),
    clientesTP: m(/(\d+)\s+clientes?\s+Totalplay/i), clientesEnlace: m(/(\d+)\s+clientes?\s+enlace/i), clientesTFE: m(/(\d+)\s+clientes?\s+TFE/i),
    ingeniero: m(/NOC:\s*(.+?)\s+Link/i), link: m(/(https?:\/\/\S+)/), ticket: '',
    puertos: [...t.matchAll(/(?:^|\n)[ \t]*(?:PON\s*:?\s*)?(\d{1,2}\/\d{1,2}\/\d{1,3})[ \t]*[,;]?[ \t]*(?=\n|$)/gi)].map(x => x[1])};   // frame/slot/port, todos
  r.puerto = r.puertos.join(', ');
  const tk = t.match(/(\d{4})\/(\d{2})\/(\d{2})\s*\((\d{2}):(\d{2})(?::(\d{2}))?/); if(tk){ r.ticket = `${tk[1]}-${tk[2]}-${tk[3]}T${tk[4]}:${tk[5]}`; r.ticketSeg = r.ticket + ':' + (tk[6] || '00'); }
  // hora en que llegó el mensaje, si se copió con el encabezado de WhatsApp: [9:00 p.m., 13/11/2026] o [21:00, 13/11/26]
  const w = t.match(/\[(\d{1,2}):(\d{2})\s*([ap])?\.?\s*m?\.?,\s*(\d{1,2})\/(\d{1,2})\/(\d{2,4})\]/i);
  if(w){ let h = +w[1]; if(w[3]){ const pm = w[3].toLowerCase() === 'p'; if(pm && h < 12) h += 12; if(!pm && h === 12) h = 0; }
    const y = w[6].length === 2 ? '20' + w[6] : w[6]; r.asignacion = `${y}-${w[5].padStart(2,'0')}-${w[4].padStart(2,'0')}T${String(h).padStart(2,'0')}:${w[2]}`; }
  else r.asignacion = ahoraLocal();
  const cl = Object.entries(CFG.clusters||{}).find(([, c]) => (c.olts||[]).includes(r.olt));
  if(cl){ r.cluster = cl[0]; r.ciudad = cl[1].ciudad; r.estado = cl[1].estado; }
  return r;
}

// Varios mensajes de asignación pegados juntos (mismo cluster, distinta OLT): se separan en el renglón de cada folio
function leerAsignaciones(txt){
  const t = String(txt || ''), re = /(?:^|\n)[ \t]*(?:\[[^\]\n]*\][^\n:]*:[ \t]*)?(\d{6,9})[ \t]*(?=\n)/g, cortes = [];
  let x; while((x = re.exec(t))) cortes.push(x.index);
  if(cortes.length < 2) return [leerAsignacion(t)];
  return cortes.map((c, i) => leerAsignacion(t.slice(c, cortes[i + 1]))).filter(r => r.folio);
}
// Masiva con folios relacionados: se ordenan por el que salió primero y se juntan folio, OLT, clientes y puertos
const folioDe = r => ({folio: r.folio, olt: r.olt, puertos: r.puertos || (r.puerto ? String(r.puerto).split(/\s*,\s*/).filter(Boolean) : []), clientesTP: r.clientesTP || '0',
  clientesEnlace: r.clientesEnlace || '0', clientesTFE: r.clientesTFE || '0', ingeniero: r.ingeniero || '', link: r.link || '', ticket: r.ticketSeg || r.ticket || '', asignacion: r.asignacion || ''});
function juntarFolios(m){
  const fs = m.folios; if(!fs || !fs.length) return;
  fs.sort((a, b) => String(a.ticket || a.asignacion).localeCompare(String(b.ticket || b.asignacion)));
  const suma = k => String(fs.reduce((s, f) => s + (parseInt(f[k]) || 0), 0));
  m.folio = fs.map(f => f.folio).join('/'); m.olt = [...new Set(fs.map(f => f.olt).filter(Boolean))].join('/');
  m.clientesTP = suma('clientesTP'); m.clientesEnlace = suma('clientesEnlace'); m.clientesTFE = suma('clientesTFE');
  m.puerto = fs.flatMap(f => f.puertos || []).join(', '); m.ingeniero = fs[0].ingeniero || m.ingeniero || ''; m.link = fs[0].link || m.link || '';
}
function agregarFolios(m, partes){
  if(!m.folios || m.folios.length < 2){ const f0 = (m.folios || [])[0] || {}; m.folios = [{...f0, ...folioDe(m), ticket: f0.ticket || folioDe(m).ticket, asignacion: f0.asignacion || m.asignacion || ''}]; }   // lo editado a mano en el folio único
  const nuevos = [], otros = [];
  partes.forEach(r => { if(!r.folio || m.folios.some(f => f.folio === r.folio)) return;
    if(r.cluster && m.cluster && r.cluster !== m.cluster){ otros.push(r.folio); return; }
    m.folios.push(folioDe(r)); nuevos.push(r.folio);
    if(r.asignacion && (!m.asignacion || r.asignacion < m.asignacion)) m.asignacion = r.asignacion; });
  juntarFolios(m);
  return {nuevos, otros};
}

function leerEtr(t){

  let tot = Math.round(((h ? parseFloat(h[1]) * 60 : 0) + (mi ? +mi[1] : 0)) / 5) * 5; if(t && !tot) tot = 5;
  return [Math.min(12, Math.floor(tot / 60)), tot % 60];
}

function normMasiva(m){
  if(m.estado && m.estado !== 'ABIERTA' && m.estado !== 'CERRADA'){ if(!m.edo) m.edo = m.estado; m.estado = 'ABIERTA'; }

function pausasDe(m){

}

function fechaDeTexto(t, base){

  if(x){ const y = x[3].length === 2 ? '20' + x[3] : x[3]; return `${y}-${x[2].padStart(2, '0')}-${x[1].padStart(2, '0')}T${x[4].padStart(2, '0')}:${x[5]}`; }

  return '';
}

    coordDanio: g(/^COORDENADAS$/), descripcion: g(/^DESCRIP/), potIni: g(/^POTENCIA_INICIAL/), potFin: g(/^POTENCIA_FINAL/), accion: g(/^TRABAJOS_REALIZADOS/),
    calibre: g(/^CALIBRE/), horaFinal: fin, qr: g(/^QR_DE_SEGUNDO/), tecnicos: tec ? tec.split(/\s*(?:,|\/|\sY\s)\s*/i).filter(Boolean) : [],

/* ===== Reporte semanal de material (ADMIN y SUPERVISOR) =====
   El servidor arma el Excel con el formato de GTB ("Sem NN - Pto Vallarta AAAA") con los folios
   cerrados de lunes a domingo; aquí se elige la semana y se descarga. */
function semanaISO(d){ d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const dia = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - dia); const ini = new Date(Date.UTC(d.getUTCFullYear(), 0, 1)); return {anio: d.getUTCFullYear(), semana: Math.ceil(((d - ini) / 864e5 + 1) / 7)}; }
function pantallaReporte(){
  if(!(veTodo() || puede('reporte', 1))){ reemplazar('#'); return; }
  $('#titulo').textContent = 'Reporte semanal';
  const meses = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'], ops = [];
  for(let k = 1; k <= 8; k++){                                   // semana pasada y 7 anteriores
    const d = new Date(Date.now() - k * 7 * 864e5), lun = new Date(d); lun.setDate(d.getDate() - ((d.getDay() + 6) % 7));
    const dom = new Date(lun); dom.setDate(lun.getDate() + 6); const w = semanaISO(d);
    ops.push({...w, txt: `Sem ${w.semana} · ${lun.getDate()} ${meses[lun.getMonth()]} al ${dom.getDate()} ${meses[dom.getMonth()]}${k===1?' (semana pasada)':''}`});
  }
  $('#app').innerHTML = `<div class="card"><h2>Material usado por semana</h2>
    <div class="hint">Folios cerrados de lunes a domingo, en el formato que se entrega cada lunes.</div>
    <label>Semana</label><select id="rSem">${ops.map((o,i) => `<option value="${i}">${esc(o.txt)}</option>`).join('')}</select>
    <button class="btn" id="rGen">Generar reporte</button><div id="rRes"></div></div>`;

  $('#rGen').onclick = async () => {
    const o = ops[+$('#rSem').value], res = $('#rRes'), b = $('#rGen');
    if(demo()){ res.innerHTML = '<div class="hint warn" style="margin-top:10px">En modo demo no hay servidor: aquí aparecería el Excel de la semana.</div>'; return; }
    if(!navigator.onLine){ res.innerHTML = '<div class="hint warn" style="margin-top:10px">Necesitas señal para generar el reporte.</div>'; return; }
    b.disabled = true; b.textContent = 'Generando… (puede tardar unos segundos)'; res.innerHTML = '';
    try{
      const r = await api('reporteSemanal', {anio: o.anio, semana: o.semana});
      const usados = r.totales.filter(t => t[1]);
      res.innerHTML = `<div style="margin-top:12px"><b>${esc(r.nombre)}</b> · ${esc(r.desde)} al ${esc(r.hasta)}<div class="hint">${r.folios} folio(s)</div>
        ${r.sinHoraFinal.length ? `<div class="hint warn">Sin hora final (se tomó la llegada): ${esc(r.sinHoraFinal.join(', '))}</div>` : ''}
        <div class="card" style="margin:10px 0;padding:6px 14px">${usados.length ? usados.map(([n,c]) => `<div class="item"><span class="nom">${esc(n)}</span><b>${c}</b></div>`).join('') : '<div class="vacio">Sin material usado esta semana.</div>'}</div>
        <button class="btn verde" id="rDesc">Descargar Excel</button>${esAdmin() ? `<a class="btn ghost" style="text-align:center;text-decoration:none;display:block" href="${esc(r.url)}" target="_blank" rel="noopener">Abrir en Google Sheets</a>` : ''}</div>`;
      $('#rDesc').onclick = () => { if(!r.xlsx) return toast('En la demostración no se descarga el archivo.');
        const bytes = Uint8Array.from(atob(r.xlsx), ch => ch.charCodeAt(0));
        const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([bytes], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
        a.download = r.nombre + '.xlsx'; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
      };
    }catch(e){ res.innerHTML = `<div class="hint err" style="margin-top:10px">${esc(e.message)}</div>`; }
    b.disabled = false; b.textContent = 'Generar reporte';
  };
}

/* ===== Documentación de 2N =====
   Cada 2N: QR, capacidad de puertos, brazo y dónde quedó. El administrador carga el KMZ del proyecto
   (sus 2N quedan como pendientes) y descarga el mismo KMZ con lo documentado escrito en cada 2N.
   GTB y póliza solo agregan; cargar y descargar KMZ es solo del administrador. */
const CAPACIDADES_2N = ['1x8', '1x16'];
const RADIO_LIGA = 30;          // m: lo capturado a esta distancia de un 2N pendiente del KMZ se liga a él
const COLOR_DOC = {DOCUMENTADO:'#1f8a4c', PENDIENTE:'#d93025', LOCAL:'#e0a400'};
const ROLES_DOC = ['ADMIN','SUPERVISOR','TECNICO','AUXILIAR','EXTERNO'];
/* ---- Documentación de 2N: reglas compartidas (las usa el servidor y el modo demo de la app) ---- */
const RADIO_CAPA_ = 20;    // m: al cargar un KMZ, un 2N ya documentado a esta distancia de un 2N del KMZ se liga a él
function docNorm_(s) { return String(s || '').toUpperCase().replace(/[\s-]/g, ''); }
// Ingeniería de cada cierre (la llena el administrador o viene en el KMZ)
const ING_CAMPOS_ = ['titulo', 'ingenieria', 'olt', 'frame', 'slot', 'puerto', 'core', 'pos', 'fibra', 'cap1n'];
function potNorm_(v) {
  const t = String(v == null ? '' : v).trim().replace(',', '.').replace(/\s*dbm?$/i, '');
  if (t === '') return '';
  if (!/^[-+]?\d{1,2}(\.\d{1,2})?$/.test(t) || Number(t) < -50 || Number(t) > 10) throw new Error('La potencia (POT) no es válida: escribe los dBm, por ejemplo -19.');
  return String(Number(t));
}
const docAdmin_ = u => u.rol === 'ADMIN' || Number((u.permisos || {}).docs) >= 3;    // administrador o ingeniero de red
function ingAplicar_(lista, id, ing, user) {
  if (!docAdmin_(user)) throw new Error('Solo el administrador puede hacer esto.');
  const r = lista.find(x => x.id === String(id));
  if (!r) throw new Error('No encontré ese cierre; recarga la lista.');
  ING_CAMPOS_.forEach(k => { if (ing && ing[k] !== undefined) r[k] = String(ing[k] == null ? '' : ing[k]).trim().toUpperCase().slice(0, 80); });
  if (r.cap1n && ['8', '16'].indexOf(r.cap1n) < 0) r.cap1n = '';
  return r;
}
function docMetros_(a, b, c, d) { const R = 6371000, r = Math.PI / 180, x = (d - b) * r * Math.cos((a + c) / 2 * r), y = (c - a) * r; return Math.sqrt(x * x + y * y) * R; }
// Guarda una captura en la lista (objetos). Regresa el registro guardado o lanza un error con la explicación.
function docAplicar_(lista, doc, user, ahora, out) {
  if (!/^[\w-]{6,60}$/.test(String(doc.id || ''))) throw new Error('Registro incompleto');
  const qr = docNorm_(doc.qr), lat = Number(doc.lat), lng = Number(doc.lng), admin = docAdmin_(user);
  const tipo = ['1N', 'DERIVACION'].indexOf(String(doc.tipo || '')) >= 0 ? String(doc.tipo) : '2N';   // 1N y derivación no llevan QR
  if (!qr && tipo === '2N') throw new Error('Falta el QR');
  if (!isFinite(lat) || !isFinite(lng) || !lat || !lng) throw new Error('Faltan las coordenadas');
  let r = lista.find(x => x.id === doc.id);
  const otro = qr && lista.find(x => x !== r && x.id !== doc.liga && x.estado === 'DOCUMENTADO' && docNorm_(x.qr) === qr);
  if (otro && !(admin && doc.forzar)) throw new Error('El QR ' + qr + ' ya está documentado (' + (otro.quien || '') + ', ' + String(otro.fecha || '').slice(0, 10) + ').');
  if (r && r.estado === 'DOCUMENTADO' && !admin && r.registradoPor !== user.id && (r.empresa || '') !== (user.cuadrilla || '-'))
    throw new Error('Ese 2N ya lo documentó ' + r.quien + '. Solo el administrador puede cambiarlo.');
  const p = doc.liga ? lista.find(x => x.id === doc.liga && x.estado === 'PENDIENTE') : null;
  if (!r && p) { r = p; r.id = doc.id; }
  else if (r && p && p !== r) {                 // al corregir: se liga a ese 2N del KMZ y el pendiente sale de la lista
    if (r.capa && r.pm !== '' && r.pm !== undefined) {      // estaba ligado a otro 2N del KMZ: ese regresa a pendiente en su lugar original
      let kl = null, t = ''; try { const e = JSON.parse(r.extra || '{}'); kl = e.kl; t = e.t || ''; } catch (e) {}
      const libre = { id: r.capa + '-' + Date.now().toString(36) + '-' + r.pm, qr: '', estado: 'PENDIENTE', capacidad: '', brazo: '', lat: kl ? kl[0] : r.lat, lng: kl ? kl[1] : r.lng,
        cluster: r.cluster || '', origen: 'KMZ', capa: r.capa, pm: r.pm, nombreKmz: r.nombreKmz || '', carpeta: r.carpeta || '', registradoPor: '', quien: '', empresa: '', fecha: '',
        actualizado: ahora, notas: '', tipo: t, extra: r.extra || '', pot: '', direccion: '' };
      ING_CAMPOS_.forEach(k => { libre[k] = r[k] || ''; r[k] = ''; });
      lista.push(libre); if (out) out.liberado = libre;
    }
    Object.assign(r, { capa: p.capa, pm: p.pm, nombreKmz: p.nombreKmz || '', carpeta: p.carpeta || '', extra: p.extra || '' });
    ING_CAMPOS_.forEach(k => { if (p[k]) r[k] = p[k]; });
    lista.splice(lista.indexOf(p), 1);
    if (out) out.ligado = p.id;
  }
  if (!r) { r = { id: doc.id, capa: '', pm: '', nombreKmz: '', carpeta: '' }; lista.push(r); }
  const nuevo = r.estado !== 'DOCUMENTADO', pot = doc.pot === undefined ? String(r.pot || '') : potNorm_(doc.pot);
  if (admin) ING_CAMPOS_.forEach(k => { if (doc[k] !== undefined) r[k] = String(doc[k] == null ? '' : doc[k]).trim().toUpperCase().slice(0, 80); });
  Object.assign(r, { pot: pot, qr: qr, estado: 'DOCUMENTADO', capacidad: String(doc.capacidad || ''), brazo: String(doc.brazo || '').toUpperCase().trim(),
    lat: lat, lng: lng, cluster: String(doc.cluster || ''), origen: String(doc.origen || 'DOCUMENTACIÓN'), notas: String(doc.notas || ''), actualizado: ahora,
    tipo: tipo, foto: String(doc.foto || r.foto || ''), proyecto: String(doc.proyecto || r.proyecto || '') });
  if (nuevo) { r.registradoPor = user.id; r.quien = user.nombre; r.empresa = user.cuadrilla || user.rol; r.fecha = ahora; }
  return r;
}
// Carga (o vuelve a cargar) los 2N de un KMZ: quedan PENDIENTE, y lo ya documentado que esté cerca se liga a ellos.
function capaAplicar_(lista, capa, puntos, ahora) {
  const quedan = lista.filter(x => !(x.capa === capa && x.estado === 'PENDIENTE'));
  const libres = quedan.filter(x => x.estado === 'DOCUMENTADO' && (x.capa === capa || !x.capa));
  libres.forEach(x => { x.pm = ''; });
  const usados = new Set(), pre = capa + '-' + Date.now().toString(36) + '-';
  let ligados = 0, pendientes = 0;
  const conKl = (ex, p) => { let e = {}; try { e = JSON.parse(ex || '{}') || {}; } catch (er) {} e.kl = [p.lat, p.lng]; return JSON.stringify(e); };
  const porNombre = {};                           // nombres que no se repiten en el KMZ
  puntos.forEach(p => { const k = docNorm_(p.nombre); porNombre[k] = (porNombre[k] || 0) + 1; });
  puntos.forEach(p => {
    p.extra = conKl(p.extra, p);
    let mejor = null, dm = RADIO_CAPA_;
    const k = docNorm_(p.nombre);
    if (k && porNombre[k] === 1) mejor = libres.find(x => !usados.has(x) && x.capa === capa && docNorm_(x.nombreKmz) === k) || null;
    if (!mejor) libres.forEach(x => { if (usados.has(x)) return; const m = docMetros_(p.lat, p.lng, Number(x.lat), Number(x.lng)); if (m < dm) { dm = m; mejor = x; } });
    if (mejor) { usados.add(mejor); Object.assign(mejor, { capa: capa, pm: p.pm, nombreKmz: p.nombre || '', carpeta: p.carpeta || '', extra: p.extra || '' });
      ING_CAMPOS_.forEach(k => { if (!mejor[k] && p[k]) mejor[k] = p[k]; }); ligados++; }
    else {
      const n = { id: pre + p.pm, qr: '', estado: 'PENDIENTE', capacidad: p.capacidad || '', brazo: '', lat: p.lat, lng: p.lng, cluster: p.cluster || '', origen: 'KMZ',
        capa: capa, pm: p.pm, nombreKmz: p.nombre || '', carpeta: p.carpeta || '', registradoPor: '', quien: '', empresa: '', fecha: '', actualizado: ahora, notas: '', tipo: p.tipo || '', extra: p.extra || '' };
      ING_CAMPOS_.forEach(k => { n[k] = p[k] || ''; });
      quedan.push(n);
      pendientes++;
    }
  });
  lista.length = 0; quedan.forEach(x => lista.push(x));
  return { pendientes: pendientes, ligados: ligados };
}
/* ---- fin de reglas compartidas ---- */

// Servidor de mentiras para el modo demo: mismas reglas que Code.gs, guardado en el teléfono

    if(accion === 'cargarCapa'){ if(!admDocs()) throw new Error('Solo el administrador puede hacer esto.');

async function rutasDe(c){
  const k = 'rutas.' + c.id, g = LS.get(k, null);
  const vivas = r => (r || []).filter(x => !x.borrada);
  if(g && g.t === c.actualizado) return vivas(g.r);
  if(!demo() && !navigator.onLine) return vivas(g ? g.r : []);
  try{ const j = await apiDoc('capaDatos', {capa:c.id}); try{ localStorage.setItem('fo.' + k, JSON.stringify({t:c.actualizado, r:j.rutas})); }catch(e){} return vivas(j.rutas); }
  catch(e){ return vivas(g ? g.r : []); }
}
async function capasMapa(){
  const lineas = [];
  for(const c of DOCS.capas) (await rutasDe(c)).forEach(r => lineas.push(r));

    color: x.estado === 'PENDIENTE' ? COLOR_DOC.PENDIENTE : x._local ? COLOR_DOC.LOCAL : COLOR_DOC.DOCUMENTADO, info: textoDoc(x)}));

}

    const nl = dv.getUint16(p + 28, true), xl = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true), off = dv.getUint32(p + 42, true);
    const ent = {nombre: new TextDecoder().decode(buf.subarray(p + 46, p + 46 + nl)), met: dv.getUint16(p + 10, true), crc: dv.getUint32(p + 16, true),

    if(!('DecompressionStream' in window)) throw new Error('Este navegador no puede abrir KMZ; actualiza Chrome.');
    bytes = new Uint8Array(await new Response(new Blob([k.datos]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
  } else if(k.met !== 0) throw new Error('El KMZ usa una compresión que no se puede leer.');

  const dentroArea = x => x.lat >= Math.min(...lat) - m && x.lat <= Math.max(...lat) + m && x.lng >= Math.min(...lng) - m && x.lng <= Math.max(...lng) + m;
  hechos.filter(x => !x.capa && dentroArea(x)).forEach(x => sueltos.push(x));
  const folders = [...X.getElementsByTagNameNS('*', 'Folder')];
  const ruta = f => { const r = []; for(let a = f; a; a = a.parentElement) if(a.localName === 'Folder') r.unshift(textoKml(a, 'name')); return r.join(' / '); };
  const conPuntos = f => [...f.children].some(c => c.localName === 'Placemark' && c.getElementsByTagNameNS('*', 'Point').length);

  };

    const p = el('Placemark'); p.appendChild(el('name', nombre(x))); p.appendChild(el('description', fichaTexto(x, todos)));
    p.appendChild(el('styleUrl', estiloDoc(x))); const pt = el('Point'); pt.appendChild(el('coordinates', `${x.lng},${x.lat},0`)); p.appendChild(pt);

  toast(`${escritos} documentados · ${rojos} sin documentar${sueltos.length ? ` · ${sueltos.length} nuevos (${enSuCarpeta} en su brazo)` : ''}${rutasCambio ? ` · ${rutasCambio} cambio(s) de rutas` : ''}`);

}

/* --- Conteo de postes: validar contando postes en lugar de material por material ---
   Reglas: cada poste lleva 2 m de fleje y 1 hebilla (con brazo de extensión: 6 m y 3 hebillas).
   Paso: 1 tangente o 1 tipo D · Remate: 2 tipo D · Punta (1N o bote final): 1 tipo D.
   Cada tipo D lleva un preformado por cable: 300 mm la FO de 24, 900 mm la de 96 y 600 mm el acero.
   Raquetas: 1 por cierre (2N o MEXFO) y 2 por gaza. */
const CABLES = [['FO 24H', 'FO 24', 'PREFORMADO 300mm'], ['FO 96', 'FO 96', 'PREFORMADO 900mm'], ['ACERO', 'Acero', 'PREFORMADO 600mm']];
const TIPOS_POSTE = [['pt', 'Paso con tangente'], ['pd', 'Paso con tipo D'], ['rem', 'Remate'], ['pun', 'Punta (1N o bote final)']];
const hMat = k => (MATERIALES.find(([h]) => invClave_(h) === invClave_(k)) || [k])[0];   // nombre de columna exacto (ej. "RAQUETAS ")
// Metraje aproximado: largo de las rutas del KMZ por color (blanco = FO 96; rojo y azul = FO 24) × 1.17, que ya incluye gazas.
// Acero: unos 70 m por cierre (entre 60 y 80). Es una referencia: se avisa si lo reportado difiere en más de 100 m.
const FACTOR_FO = 1.17, ACERO_POR_CIERRE = 70, TOLERANCIA_M = 100;
function cableDeColor(hex){
  if(!hex) return 'FO 96';                                          // sin color en el KMZ = blanco (el color por omisión de Google Earth)
  const m = /^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(hex || ''); if(!m) return '';
  const [r, g, b] = m.slice(1).map(x => parseInt(x, 16)), mx = Math.max(r, g, b), mn = Math.min(r, g, b);
  if(mn > 170 && mx - mn < 50) return 'FO 96';                      // blanco
  if((r === mx && r - Math.max(g, b) > 60) || (b === mx && b - Math.max(r, g) > 40)) return 'FO 24H';   // rojo o azul
  return '';
}
async function calcularMetraje(p){
  const capa = DOCS.capas.find(x => x.id === p.capa); if(!capa) throw new Error('Este proyecto no tiene KMZ ligado (Editar datos > KMZ del proyecto).');
  const rutas = await rutasDe(capa), m = {'FO 96': 0, 'FO 24H': 0, otros: 0};
  rutas.forEach(r => { let l = 0; for(let i = 1; i < r.c.length; i++) l += docMetros_(r.c[i - 1][0], r.c[i - 1][1], r.c[i][0], r.c[i][1]); m[cableDeColor(r.color) || 'otros'] += l; });
  const docs = docsDeProy(p), cierres = docs.length + ((p.postes || {}).c2n || 0) + ((p.postes || {}).mexfo || 0);
  return {fo96: Math.round(m['FO 96'] * FACTOR_FO), fo24: Math.round(m['FO 24H'] * FACTOR_FO), otros: Math.round(m.otros), acero: cierres * ACERO_POR_CIERRE, cierres, rutas: rutas.length, t: new Date().toISOString()};
}
function bloqueMetraje(p){
  const m = p.metraje, rep = k => parseFloat(((p.mat || {}).rep || {})[k]) || 0;
  const fila = (t, q, k) => { const d = rep(k) - q, mal = rep(k) > 0 && Math.abs(d) > TOLERANCIA_M;
    return q || rep(k) ? `<div class="item"><span class="nom">${t}<small>${rep(k) ? `reportado ${rep(k)} m · diferencia ${d > 0 ? '+' : ''}${d} m` : 'sin reportado'}</small></span><b style="color:${mal ? 'var(--err)' : 'inherit'}">≈ ${q} m${mal ? ' ⚠️' : ''}</b></div>` : ''; };
  return `<div class="seccion" style="margin:14px 0 4px">Metraje aproximado</div>
    ${m ? `${fila('FO 96 (líneas blancas)', m.fo96, 'FO 96')}${fila('FO 24 (líneas rojas y azules)', m.fo24, 'FO 24H')}${fila(`Acero (${m.cierres} cierres × ${ACERO_POR_CIERRE} m)`, m.acero, 'ACERO')}
      <div class="hint">Largo de ${m.rutas} ruta(s) del KMZ × ${FACTOR_FO} (ya incluye gazas).${m.otros ? ` Hay ${m.otros} m en líneas de otro color que no se contaron.` : ''} ⚠️ = más de ${TOLERANCIA_M} m de diferencia con lo reportado.</div>` : '<div class="hint">Con el KMZ del proyecto: líneas blancas = FO 96, rojas y azules = FO 24.</div>'}
    <button class="btn ghost sm" id="ppMetraje">📏 ${m ? 'Volver a calcular' : 'Calcular con el KMZ'}</button><div class="hint err" id="ppMetErr"></div>`;
}
// 2N y 1N documentados en este proyecto (desde su recorrido o del KMZ ligado al proyecto)

const SPLITTER_2N = {'1x8': 'SP  2N 1:8', '1x16': 'SP  2N 1:16'};
function calcPostes(pp, docs = []){
  const t = {}, suma = (k, q) => { if(q) t[hMat(k)] = (t[hMat(k)] || 0) + q; };
  const d2n = docs.filter(x => (x.tipo || '2N') === '2N');
  suma('CIERRE 2N', d2n.length); suma('RAQUETAS', d2n.length);              // cada 2N: cierre, splitter según capacidad y una raqueta
  d2n.forEach(x => { const sp = SPLITTER_2N[String(x.capacidad || '').toLowerCase()]; if(sp) suma(sp, 1); });
  const d1n = docs.filter(x => x.tipo === '1N'), dder = docs.filter(x => x.tipo === 'DERIVACION');
  suma('CIERRE TIPO MEXFO', d1n.length + dder.length); suma('RAQUETAS', d1n.length + dder.length);   // 1N y derivación: MEXFO y raqueta
  d1n.forEach(x => suma(String(x.capacidad || '').toLowerCase() === '1x16' ? 'SP 1N 1:16' : 'SP 1N 1:8', 1));   // 1N: splitter 1:8 (o 1:16)
  let postes = 0, ext = 0;
  Object.entries(pp.grupos || {}).forEach(([cab, g]) => {
    const n = (g.pt || 0) + (g.pd || 0) + (g.rem || 0) + (g.pun || 0), d = (g.pd || 0) + 2 * (g.rem || 0) + (g.pun || 0);
    postes += n; ext += g.ext || 0;
    suma('HERRAJES TIPO "TANJENTE"', g.pt || 0); suma('HERRAJES TIPO "D"', d);
    cab.split('|').filter(Boolean).forEach(c => { const x = CABLES.find(y => y[0] === c); if(x) suma(x[2], d); });
  });
  suma('FLEJE (METROS)', 2 * postes + 4 * ext); suma('HEBILLAS', postes + 2 * ext);
  suma('CIERRE 2N', pp.c2n || 0); suma('CIERRE TIPO MEXFO', pp.mexfo || 0);
  suma('RAQUETAS', (pp.c2n || 0) + (pp.mexfo || 0) + 2 * (pp.gazas || 0));
  return {items: t, postes, ext, gazas: pp.gazas || 0};
}
function tarjetaPostes(p){

      <div class="step"><button type="button" data-pp="${k}" data-d="-1">−</button><b class="cpoN">${v || 0}</b><button type="button" data-pp="${k}" data-d="1" class="mas">＋</button></div></div>`;
  return `<div class="card" id="pPostes"><h2>Conteo de postes</h2>
    <div class="hint" style="margin-top:0">Elige los cables del tramo y toca ＋ en cada poste. La app calcula fleje, hebillas, herrajes, preformados y raquetas.</div>
    <label>Cables en este tramo</label><div class="chips" id="ppCab">${CABLES.map(([k, t]) => `<button type="button" class="chip ${(pp.cables || []).includes(k) ? 'on' : ''}" data-c="${k}">${t}</button>`).join('')}</div>
    ${TIPOS_POSTE.map(([k, t]) => cont('g.' + k, t, g[k])).join('')}
    ${cont('g.ext', 'Con brazo de extensión', g.ext, 'además de su tipo: 6 m de fleje y 3 hebillas')}
    <div class="seccion" style="margin:14px 0 4px">Cierres y gazas</div>
    <div class="cpo"><span class="nom">2N documentados<small>${d2n.length ? esc(Object.entries(d2n.reduce((a, x) => (a[x.capacidad || 'sin capacidad'] = (a[x.capacidad || 'sin capacidad'] || 0) + 1, a), {})).map(([k, n]) => n + ' de ' + k).join(' · ')) + ' · suman cierre, splitter y raqueta' : 'Se suman solos al documentarlos'}</small></span><b class="cpoN" style="margin-right:54px">${d2n.length}</b></div>
    ${d1n.length + dder.length ? `<div class="cpo"><span class="nom">1N y derivaciones documentados<small>${[d1n.length && d1n.length + ' 1N (MEXFO, splitter 1N y raqueta)', dder.length && dder.length + ' derivación(es) (MEXFO y raqueta)'].filter(Boolean).join(' · ')}</small></span><b class="cpoN" style="margin-right:54px">${d1n.length + dder.length}</b></div>` : ''}

      ${Object.keys(c.items).length ? Object.entries(c.items).map(([h, q]) => `${q}${/FLEJE/.test(h) ? ' m' : ''} ${esc((MATERIALES.find(x => x[0] === h) || [, h])[1]).toLowerCase()}`).join(' · ') : 'Todavía nada contado.'}</div>
    ${Object.keys(pp.grupos).filter(k => Object.values(pp.grupos[k]).some(Boolean)).length > 1 ? `<div class="hint">Tramos contados: ${Object.entries(pp.grupos).filter(([, x]) => Object.values(x).some(Boolean)).map(([k, x]) => esc(k.split('|').map(y => (CABLES.find(z => z[0] === y) || [, y])[1]).join(' + ')) + ': ' + ((x.pt || 0) + (x.pd || 0) + (x.rem || 0) + (x.pun || 0))).join(' · ')}</div>` : ''}
    ${bloqueMetraje(p)}
    <button class="btn verde" id="ppPasar" style="margin-top:10px" ${Object.keys(c.items).length || p.metraje ? '' : 'disabled'}>Pasar a Validado</button>
    <div class="hint">Reemplaza en "Validado" solo los materiales que salen del conteo; lo demás se queda como está.</div></div>`;
}

function activarCantidades(box, alCambiar){

/* --- Foto sellada: fecha, coordenadas y texto sobre la imagen --- */
async function ubicacionDeFoto(f){
  try{ const p = gpsDeFoto(await f.slice(0, 262144).arrayBuffer()); if(p) return {pos:p, origen:'ubicación de la foto'}; }catch(e){}
  return await new Promise(r => navigator.geolocation ? navigator.geolocation.getCurrentPosition(p => r({pos:[p.coords.latitude, p.coords.longitude], origen:`GPS ±${Math.round(p.coords.accuracy)} m`}),
    () => r(null), {enableHighAccuracy:true, timeout:15000, maximumAge:30000}) : r(null));
}
async function sellarFoto(f, pos, origen, renglones){
  const cuando = new Date(Math.abs(Date.now() - f.lastModified) < 864e5 ? f.lastModified : Date.now()), dos = n => String(n).padStart(2, '0');
  const img = await createImageBitmap(f), k = Math.min(1, 1600 / Math.max(img.width, img.height));
  const cv = document.createElement('canvas'); cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
  const g = cv.getContext('2d'); g.drawImage(img, 0, 0, cv.width, cv.height);
  const pad = Math.round(cv.width / 40), fs = Math.max(14, Math.round(cv.width / 34));
  const lineas = [`${dos(cuando.getDate())}/${dos(cuando.getMonth() + 1)}/${cuando.getFullYear()} ${dos(cuando.getHours())}:${dos(cuando.getMinutes())}:${dos(cuando.getSeconds())}`,
    pos ? `${pos[0].toFixed(6)}, ${pos[1].toFixed(6)}  (${origen})` : 'Sin coordenadas', ...renglones].filter(Boolean);
  const alto = lineas.length * fs * 1.35 + pad;
  g.fillStyle = 'rgba(0,0,0,.55)'; g.fillRect(0, cv.height - alto, cv.width, alto); g.fillStyle = '#fff'; g.textBaseline = 'top';
  lineas.forEach((t, i) => { g.font = `${i === 0 ? 700 : 500} ${fs}px system-ui, sans-serif`; g.fillText(t, pad, cv.height - alto + pad / 2 + i * fs * 1.35, cv.width - pad * 2); });
  const blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.82));
  const m = document.createElement('canvas'), km = 160 / Math.max(cv.width, cv.height); m.width = Math.round(cv.width * km); m.height = Math.round(cv.height * km);
  m.getContext('2d').drawImage(cv, 0, 0, m.width, m.height);
  return {blob, mini: m.toDataURL('image/jpeg', 0.55), cuando};
}

        <description><![CDATA[<b>${esc(t)}</b><br>${esc(i.desc || '')}<br>${esc(fmtFecha(local(i.fecha)).slice(0, 16))}<br><a href="${mapsUrl(i.lat, i.lng)}">Abrir en Maps</a>${fotos.some(x => x.n === n) ? `<br><img src="files/${n + 1}.jpg" width="480">` : ''}]]></description>
        <styleUrl>#inc</styleUrl><Point><coordinates>${i.lng},${i.lat},0</coordinates></Point></Placemark>`).join('')}</Folder>`).join('')}
      ${rutas.length ? `<Folder><name>Rutas del proyecto</name><visibility>1</visibility>${rutas.map(r => `<Placemark><name>${esc(r.n || '')}</name><styleUrl>#ruta</styleUrl><LineString><coordinates>${r.c.map(([la, lo]) => lo + ',' + la + ',0').join(' ')}</coordinates></LineString></Placemark>`).join('')}</Folder>` : ''}
      </Document></kml>`;
    const k = new TextEncoder().encode(kml);
    const ents = [{nombre:'doc.kml', met:0, crc:crc32(k), csz:k.length, usz:k.length, datos:k},
      ...fotos.map(x => ({nombre:`files/${x.n + 1}.jpg`, met:0, crc:crc32(x.datos), csz:x.datos.length, usz:x.datos.length, datos:x.datos}))];
    entregarArchivo(armarZip(ents), `${p.nombre} correcciones ${hoy}.kmz`, o);

}

/* ===== Inventario =====
   Ubicaciones: el almacén y cada cuadrilla. El stock de cada una sale de su último conteo, más lo que entró,
   menos lo que salió y menos el material de sus folios. Administrador y supervisor capturan y corrigen todo desde aquí;
   la cuadrilla ve su material y confirma lo que recibe. */
const ALMACEN = 'ALMACÉN';
const TIPOS_MOV = {CONTEO:'Conteo', ENTRADA:'Entrada al almacén', ENTREGA:'Entrega a cuadrilla', TRASPASO:'Traspaso entre cuadrillas', DEVOLUCION:'Devolución al almacén', MERMA:'Merma'};
/* ---- Inventario: reglas compartidas (servidor y app) ---- */
function invClave_(s) { return String(s || '').replace(/\s+/g, ' ').trim().toUpperCase(); }
// Stock de una ubicación = último conteo + lo que entró (ya confirmado) − lo que salió − lo consumido en folios (todo después del conteo).
// "hasta" (opcional) calcula el stock como estaba en esa fecha.
function invStock_(movs, consumos, u, hasta) {
  const vivos = movs.filter(m => !m.anulado && (!hasta || String(m.fecha) < String(hasta)));
  let base = null;
  vivos.forEach(m => { if (m.tipo === 'CONTEO' && m.a === u && (!base || String(m.fecha) > String(base.fecha))) base = m; });
  const s = {}, t0 = base ? String(base.fecha) : '';
  const suma = (items, signo) => Object.keys(items || {}).forEach(k => { s[k] = (s[k] || 0) + signo * (Number(items[k]) || 0); });
  if (base) suma(base.items, 1);
  // Entregas y traspasos: salen del origen al registrarse y entran al destino hasta que la cuadrilla confirma (mientras, van "por confirmar")
  const porConf = {};
  vivos.forEach(m => { if (m.tipo === 'CONTEO' || String(m.fecha) < t0) return;
    if (m.de === u) suma(m.items, -1);
    if (m.a !== u) return;
    if ((m.tipo === 'ENTREGA' || m.tipo === 'TRASPASO') && !m.conf) Object.keys(m.items || {}).forEach(k => { porConf[k] = (porConf[k] || 0) + (Number(m.items[k]) || 0); });
    else suma(m.items, 1); });
  if (base) (consumos || []).forEach(c => { if (c.cuadrilla === u && String(c.fecha) >= t0 && (!hasta || String(c.fecha) < String(hasta))) suma(c.items, -1); });
  Object.keys(s).forEach(k => { s[k] = Math.round(s[k] * 100) / 100; });
  return { stock: s, conteo: t0, sinConteo: !base, porConfirmar: porConf };
}
/* ---- fin de reglas compartidas ---- */

const MAT_CLAVE = MATERIALES.map(([h, n, u, g]) => ({k: invClave_(h), h, n, u, g}));
const fmtQ = n => String(Math.round((Number(n) || 0) * 100) / 100);
let INV = LS.get('inv', {movs:[], minimos:{alm:{}, cua:{}}, consumos:[], t:''});
const guardarInv = () => { memoInv = null; LS.set('inv', INV); pintarPendientes(); };
const invPorSubir = () => !USER || USER.rol === 'EXTERNO' ? 0 : INV.movs.filter(m => m.subida !== m.actualizado && (veTodo() || m.de === USER.cuadrilla)).length + (veTodo() && INV.minPend ? 1 : 0);
const ordenU = (a, b) => (a !== ALMACEN) - (b !== ALMACEN) || a.localeCompare(b, 'es', {numeric:true});
function ubicaciones(){
  const s = new Set([ALMACEN]);
  (CFG.usuarios || []).forEach(u => { if(u.activo !== false && u.cuadrilla && (u.rol === 'TECNICO' || u.rol === 'AUXILIAR')) s.add(u.cuadrilla); });
  INV.movs.forEach(m => { if(!m.anulado){ if(m.de) s.add(m.de); if(m.a) s.add(m.a); } });
  return [...s].sort(ordenU);
}
const cortoU = u => u === ALMACEN ? 'Almacén' : u.replace(/^CUADRILLA\s+/i, 'C');
const tecnicoDe = c => { const t = (CFG.usuarios || []).find(u => u.cuadrilla === c && u.rol === 'TECNICO' && u.activo !== false);
  return t ? t.nombre.split(' ').slice(0, 2).join(' ') + ' · ' + cortoU(c) : c; };
const nombreU = u => u === ALMACEN ? 'Almacén' : u.charAt(0) + u.slice(1).toLowerCase();
// Material de un folio, para descontarlo de su cuadrilla
function consumoDeFolio(f){
  const d = f.d, tec = String(d['TECNICO QUE ATIENDE'] || '').split(',')[0].trim();
  const cua = f.cuadrilla || ((CFG.usuarios || []).find(u => u.nombre === tec) || {}).cuadrilla; if(!cua) return null;
  const items = {}; MAT_CLAVE.forEach(m => { const q = parseFloat(d[m.h]); if(q > 0) items[m.k] = q; });
  if(!Object.keys(items).length) return null;
  const t = completa(d['HORA FINAL']) ? d['HORA FINAL'] : d['FECHA Y HORA DE LLEGADA'];
  return {cuadrilla: cua, fecha: completa(t) ? new Date(t).toISOString() : f.creado, folio: d['FOLIO/OS'], items};
}
// Memoria corta: vale mientras se dibuja una pantalla y se borra sola (o al guardar algo)
let memoInv = null;
const memo = () => { if(!memoInv){ memoInv = {c: null, s: new Map()}; queueMicrotask(() => { memoInv = null; }); } return memoInv; };
const consumosTodos = () => { const m = memo(); return m.c || (m.c = demo() ? FOLIOS.map(consumoDeFolio).filter(Boolean).concat(PREV.ots.map(consumoDeOt))
  : (INV.consumos || []).concat(FOLIOS.filter(f => f.estado !== 'enviado' && (f.version || 1) === 1).map(consumoDeFolio).filter(Boolean),
      PREV.ots.filter(o => !o.subida).map(consumoDeOt))); };
function stockDe(u, hasta, sin){
  const m = memo(), k = u + '|' + (hasta || '') + '|' + (sin || ''); let r = m.s.get(k);
  if(!r){ r = invStock_(sin ? INV.movs.filter(x => x.id !== sin) : INV.movs, consumosTodos(), u, hasta); m.s.set(k, r); }
  return r;
}
const minimosDe = u => (u === ALMACEN ? INV.minimos.alm : INV.minimos.cua) || {};
function alertasInv(){
  const out = [];
  ubicaciones().forEach(u => { const st = stockDe(u), min = minimosDe(u); if(st.sinConteo) return;
    MAT_CLAVE.forEach(m => { if(min[m.k] > 0 && (st.stock[m.k] || 0) < min[m.k]) out.push({u, m, stock: st.stock[m.k] || 0, min: min[m.k]}); }); });
  return out;
}
const resumenItems = items => MAT_CLAVE.filter(m => items && items[m.k] > 0).map(m => `${fmtQ(items[m.k])}${m.u === 'm' ? ' m' : ''} ${m.n}`).join(', ');
const porConfirmar = cua => INV.movs.filter(m => !m.anulado && !m.conf && m.a === cua && (m.tipo === 'ENTREGA' || m.tipo === 'TRASPASO'));

// Servidor de mentiras para la demo
async function apiInv(accion, datos){
  if(!demo()) return api(accion, datos);
  const s = LS.get('demoInv', {movs:{}, minimos:{alm:{}, cua:{}}}), r = (() => {
    if(accion === 'inventario') return {movs: Object.values(s.movs).filter(m => veTodo() || m.de === USER.cuadrilla || m.a === USER.cuadrilla), minimos: s.minimos, consumos: []};
    if(accion === 'guardarMov'){ const m = datos.mov, y = s.movs[m.id]; if(!y || String(y.actualizado) <= String(m.actualizado)) s.movs[m.id] = {...m, conf: m.conf || (y && y.conf)}; return {}; }
    if(accion === 'guardarMinimos'){ s.minimos = datos.minimos; return {}; }
    if(accion === 'confirmarMov'){ const m = s.movs[datos.id]; if(!m) throw new Error('No encontré esa entrega.');
      m.conf = {por: USER.id, nombre: USER.nombre, fecha: new Date().toISOString()}; m.actualizado = m.conf.fecha; return {mov: m}; }
    throw new Error('Acción desconocida');
  })();
  LS.set('demoInv', s); return {ok:true, ...r};
}
let sincInvEnCurso = null;
async function sincInv(){
  if(!USER || USER.rol === 'EXTERNO' || (!demo() && !navigator.onLine)) return;
  if(sincInvEnCurso) return sincInvEnCurso;
  sincInvEnCurso = (async () => {
    try{
      for(const m of INV.movs.filter(m => m.subida !== m.actualizado && (veTodo() || m.de === USER.cuadrilla))){
        try{ const v = m.actualizado, {subida, error, ...mov} = m; await apiInv('guardarMov', {mov}); m.subida = v; m.error = ''; }catch(e){ m.error = String(e.message || e); } }
      if(veTodo()){
        if(INV.minPend){ try{ await apiInv('guardarMinimos', {minimos: INV.minimos}); INV.minPend = false; }catch(e){} }
      }
      const j = await apiInv('inventario', {});
      j.movs.forEach(r => { const k = INV.movs.findIndex(x => x.id === r.id);
        if(k < 0) INV.movs.push({...r, subida: r.actualizado}); else if(String(r.actualizado) > String(INV.movs[k].actualizado)) INV.movs[k] = {...r, subida: r.actualizado}; });
      if(!INV.minPend) INV.minimos = {alm: (j.minimos || {}).alm || {}, cua: (j.minimos || {}).cua || {}};
      INV.consumos = j.consumos || []; INV.t = new Date().toISOString();
    }catch(e){ console.log('inventario', e); }
    guardarInv();
  })();
  try{ await sincInvEnCurso; } finally { sincInvEnCurso = null; }
}
const invViejo = () => !INV.t || Date.now() - new Date(INV.t) > 60000;

/* --- Captura de cantidades: todos los materiales por grupo --- */
function editorInv(v, ref){
  return [...new Set(MAT_CLAVE.map(m => m.g))].map(g => `<div class="grp">${esc(g)}</div>` + MAT_CLAVE.filter(m => m.g === g).map(m =>

}
function leerInv(box){ const v = {}; box.querySelectorAll('[data-inv]').forEach(i => { const q = parseFloat(i.value); if(q > 0) v[i.dataset.inv] = q; i.closest('.item').classList.toggle('con', q > 0); }); return v; }

// Si no se toca la fecha se guarda la hora exacta (con segundos), para que el orden entre conteos y movimientos sea el real
const campoFechaInv = iso => { const t = iso || new Date().toISOString(), l = local(t);
  return `<label>Fecha y hora</label><div class="fh" id="iFH" data-iso="${t}" data-ini="${l.slice(0, 16)}"><input type="date" id="iF" value="${l.slice(0, 10)}">${campoHora('id="iH"', l.slice(11, 16))}</div>`; };
const leerFechaInv = (nuevo) => { const f = $('#iF').value, h = $('#iH').value || '12:00', box = $('#iFH'); if(!f) return '';
  if(`${f}T${h}` === box.dataset.ini) return nuevo ? new Date().toISOString() : box.dataset.iso;
  return new Date(`${f}T${h}`).toISOString(); };
function tablaStock(u){
  const st = stockDe(u), min = minimosDe(u), filas = MAT_CLAVE.filter(m => (st.stock[m.k] || 0) !== 0 || min[m.k] > 0);
  const cuerpo = filas.length ? filas.map(m => { const q = st.stock[m.k] || 0, bajo = !st.sinConteo && min[m.k] > 0 && q < min[m.k];
    return `<div class="matq ${bajo || q < 0 ? 'bajo' : ''}"><b>${Number(q).toLocaleString('es-MX')}</b><span>${esc(m.n)}${m.u === 'm' ? ' · m' : ''}</span>
      <small>${bajo ? 'bajo mínimo · ' : ''}${min[m.k] > 0 ? 'mín. ' + fmtQ(min[m.k]) : ''}</small></div>`; }).join('')
    : '<div class="vacio">Sin material registrado.</div>';
  return filas.length ? `<div class="matgrid">${cuerpo}</div>` : cuerpo;
}
const avisoPorConfirmar = u => { const t = resumenItems(stockDe(u).porConfirmar); return t ? `<div class="hint warn" style="margin-top:8px">Por confirmar: ${esc(t)}. No cuenta hasta que la cuadrilla confirme que lo recibió.</div>` : ''; };
function filaMov(m){
  const ruta = m.tipo === 'CONTEO' ? nombreU(m.a) : [m.de && nombreU(m.de), m.a && nombreU(m.a)].filter(Boolean).join(' → ');
  return `<div class="item" data-mov="${esc(m.id)}" style="cursor:pointer;${m.anulado ? 'opacity:.5' : ''}"><span class="nom"><b>${TIPOS_MOV[m.tipo] || m.tipo}</b> · ${esc(ruta)}
    <small>${esc(resumenItems(m.items) || 'sin material')}</small><small>${esc(fmtFecha(local(m.fecha)).slice(0, 16))} · ${esc(m.usuario || '')}${m.reserva ? ' · reserva ' + esc(m.reserva) : ''}</small></span>
    ${m.anulado ? '<span class="estado error">anulado</span>' : m.subida !== m.actualizado ? `<span class="estado ${m.error ? 'error' : 'pendiente'}">${m.error ? 'error' : 'por enviar'}</span>`
      : (m.tipo === 'ENTREGA' || m.tipo === 'TRASPASO') ? `<span class="estado ${m.conf ? 'enviado' : 'pendiente'}">${m.conf ? 'recibido' : 'sin confirmar'}</span>` : ''}</div>`;
}

/* --- Conteo de una ubicación (el inicial y los de cada mes) --- */

   Las cuadrillas de preventivo (GTB, otra división) recorren cada mes los brazos del KMZ y por cada incidencia hacen una OT

   los cinchos los pone el proveedor) y arma el script para WhatsApp. Se guarda en la hoja PREVENTIVO.
   En construcción: mientras PREV_PUBLICO sea false, solo lo ve el administrador. */
const PREV_PUBLICO = true;

const INC_PREV_BASE = ['GASA CAÍDA', 'GAZA EN LOOP', 'GAZA SIN DISPOSITIVO', 'CIERRE CAÍDO'];

const MAT_PREV = [['RAQUETAS ', 'Raquetas', 'pza'], ['ETIQUETAS ', 'Etiquetas', 'pza'], ['ACERO', 'Acero', 'm']];   // salen del almacén
const FOTOS_PREV = [['antes', 'Antes'], ['durante', 'Durante'], ['despues', 'Después']];
const ORIGEN_PREV = {RECORRIDO: 'Recorrido del mes', FUERA: 'Fuera del recorrido', IDR: 'IDR'};

const guardarPrev = () => { memoInv = null; LS.set('prev', PREV); pintarPendientes(); };
const prevPorSubir = () => USER ? PREV.ots.filter(o => o.subida !== o.actualizado && (veTodo() || o.cuadrilla === USER.cuadrilla)).length : 0;
const consumoDeOt = o => ({cuadrilla: o.cuadrilla, fecha: o.fin, folio: 'OT ' + o.ot, items: o.mat || {}});
const cuadrillasPrev = () => [...new Set((CFG.usuarios || []).filter(u => u.area === 'PREVENTIVO' && u.cuadrilla && deCampo(u.rol)).map(u => u.cuadrilla))].sort((a, b) => a.localeCompare(b, 'es', {numeric: true}));
const fechaCorta = v => { if(!v) return ''; const [f, h] = String(v).split('T'), [y, m, d] = f.split('-'); return `${d}/${m}/${y.slice(2)} ${(h || '').slice(0, 5)}`.trim(); };

// Servidor de mentiras para la demo
async function apiPrev(accion, datos){
  if(!demo()) return api(accion, datos);
  const s = LS.get('demoPrev', {ots: {}}), r = (() => {
    if(accion === 'preventivo') return {ots: Object.values(s.ots)};
    if(accion === 'guardarPrev'){ const o = {...datos.ot};
      if(Object.values(s.ots).some(x => x.ot === o.ot && x.id !== o.id)) throw new Error('La OT ' + o.ot + ' ya está registrada.');
      o.fotos = o.fotos || {}; Object.keys(datos.fotos || {}).forEach(k => { if(!o.fotos[k]) o.fotos[k] = {id: 'f' + Math.random().toString(36).slice(2, 8), url: '#'}; });
      s.ots[o.id] = o; return {ot: {id: o.id, fotos: o.fotos}}; }
    if(accion === 'guardarLista'){ const c = LS.get('config', null) || structuredClone(CONFIG_DEMO); c.listas[datos.clave] = datos.valores; LS.set('config', c); CFG = normalizarConfig(c); return {}; }
    throw new Error('Acción desconocida');
  })();
  try{ LS.set('demoPrev', s); }catch(e){}
  return {ok: true, ...r};
}
let subiendoPrev = false;
async function subirPrev(){
  if(subiendoPrev || !USER || (!demo() && !navigator.onLine)) return;
  subiendoPrev = true; let cambio = false;
  try{
    for(const o of PREV.ots.filter(o => o.subida !== o.actualizado && (veTodo() || o.cuadrilla === USER.cuadrilla))){
      try{
        const v = o.actualizado, fotos = {};
        for(const [k] of FOTOS_PREV) if((o._pend || {})[k]){ const b = await IDB.traer(o._pend[k]); if(b) fotos[k] = await blobAb64(b); }
        const datos = {...o}; delete datos._pend; delete datos.minis; delete datos.subida; delete datos.error;
        const j = await apiPrev('guardarPrev', {ot: datos, fotos});
        o.fotos = j.ot.fotos || o.fotos; for(const [k] of FOTOS_PREV) if(o.fotos && o.fotos[k] && (o._pend || {})[k]){ IDB.quitar(o._pend[k]).catch(() => {}); delete o._pend[k]; }
        o.subida = v; delete o.error; cambio = true;
      }catch(e){ o.error = e.message; cambio = true; console.log('OT', e); }
    }
  } finally { subiendoPrev = false; }
  if(cambio){ guardarPrev(); if(/^#prev/.test(location.hash) && !enFormulario() && !MODALES.length) router(); }
}

    j.ots.forEach(r => { const k = PREV.ots.findIndex(x => x.id === r.id);
      if(k < 0) PREV.ots.push({...r, subida: r.actualizado});
      else if(String(r.actualizado) > String(PREV.ots[k].actualizado)) PREV.ots[k] = {...PREV.ots[k], ...r, subida: r.actualizado}; });

  }catch(e){ console.log('preventivo', e); }
}

/* ===== Recorrido mensual de preventivo =====
   El administrador carga el KMZ de brazos del mes (para todas las cuadrillas de preventivo). Cada brazo muestra sus km,
   las OTs hechas en él y su estado; la cuadrilla lo marca concluido. La OT sugiere el brazo más cercano a sus coordenadas. */
let REC = LS.get('rec', {lista: [], marcas: [], t: ''});
const guardarRec = () => { LS.set('rec', REC); pintarPendientes(); };
const normBrazo = s => MAY(s).replace(/[\s-]/g, '');
const recsDelMes = mes => REC.lista.filter(r => r.mes === mes);
const otsDeBrazo = (b, mes) => PREV.ots.filter(o => o.origen !== 'IDR' && normBrazo(o.brazo) === normBrazo(b.n) && String(o.termino || '').startsWith(mes));

function metrosARuta(la, lo, c){               // distancia de un punto al trazo (por segmentos)
  let m = Infinity; const k = Math.cos(la * Math.PI / 180) * 111320, y0 = la * 110540, x0 = lo * k;
  for(let i = 1; i < c.length; i++){ const ax = c[i - 1][1] * k, ay = c[i - 1][0] * 110540, bx = c[i][1] * k, by = c[i][0] * 110540, dx = bx - ax, dy = by - ay;
    const t = Math.max(0, Math.min(1, ((x0 - ax) * dx + (y0 - ay) * dy) / (dx * dx + dy * dy || 1))); m = Math.min(m, Math.hypot(x0 - ax - t * dx, y0 - ay - t * dy)); }
  return m;
}
function brazoCercano(la, lo){

  return mejor;
}

function gpsLev(){

    let mejor = null; const fin = () => { navigator.geolocation.clearWatch(w); clearTimeout(t); mejor ? res(mejor) : rej(new Error('No se pudo obtener el GPS')); };
    const w = navigator.geolocation.watchPosition(p => { if(!mejor || p.coords.accuracy < mejor.prec) mejor = {lat: p.coords.latitude, lng: p.coords.longitude, prec: Math.round(p.coords.accuracy)}; if(p.coords.accuracy <= 6) fin(); },
      () => fin(), {enableHighAccuracy: true, timeout: 15000, maximumAge: 0});
    const t = setTimeout(fin, 9000);
  });
}

  if(subiendoIdr || !USER || (!demo() && !navigator.onLine)) return;
  subiendoIdr = true; let cambio = false;
  try{ for(const i of IDR.lista.filter(i => i.subida !== i.actualizado)){
    try{ const v = i.actualizado, datos = {...i}; delete datos._fotoPend; delete datos.mini; delete datos.subida;
      let foto; if(i._fotoPend){ const b = await IDB.traer(i._fotoPend); if(b) foto = await blobAb64(b); }
      const j = await apiIdr('guardarIdr', {idr: datos, foto}); if(j.idr.foto){ i.foto = j.idr.foto; delete i._fotoPend; }
      i.subida = v; cambio = true; }catch(e){ console.log('idr', e); } } }
  finally { subiendoIdr = false; }
  if(cambio){ guardarIdr(); if(/^#idr/.test(location.hash) && !enFormulario() && !MODALES.length) router(); }
}
async function bajarIdr(){
  if(!USER || (!demo() && !navigator.onLine)) return;
  try{ const j = await apiIdr('idr', {});
    j.lista.forEach(r => { const k = IDR.lista.findIndex(x => x.id === r.id);
      if(k < 0) IDR.lista.push({...r, subida: r.actualizado}); else if(String(r.actualizado) > String(IDR.lista[k].actualizado)) IDR.lista[k] = {...IDR.lista[k], ...r, subida: r.actualizado}; });
    IDR.t = new Date().toISOString(); guardarIdr(); await subirIdr(); }catch(e){ console.log('idr', e); }
}

/* ===== Reportes de problemas =====
   Cualquiera reporta desde Ajustes (con captura opcional); se guarda en la hoja REPORTES y al administrador le llega un correo.
   El administrador los revisa, responde y los marca resueltos; quien reportó ve el estado y la respuesta en sus Ajustes. */
const ESTADOS_REP = {'NUEVO': ['Nuevo', 'error'], 'EN REVISIÓN': ['En revisión', 'pendiente'], 'RESUELTO': ['Resuelto', 'enviado']};
let REP = LS.get('reportes', {lista: [], vistos: {}, t: ''});
const firmaRep = () => REP.lista.map(r => r.id + r.actualizado + r.estado).join('|');
const guardarRep = () => { LS.set('reportes', REP); pintarPendientes(); };
const misReportes = () => REP.lista.filter(r => r.usuario === (USER && USER.id)).sort((a, b) => String(b.fecha).localeCompare(String(a.fecha)));
const repPorSubir = () => USER ? REP.lista.filter(r => r.subida !== r.actualizado && (esAdmin() || r.usuario === USER.id)).length : 0;
const repNuevos = () => REP.lista.filter(r => r.estado === 'NUEVO').length;
const repSinLeer = () => misReportes().filter(r => r.respuesta && REP.vistos[r.id] !== r.actualizado).length;     // respuestas que aún no ve quien reportó
async function apiRep(accion, datos){
  if(!demo()) return api(accion, datos);
  const s = LS.get('demoRep', {}), r = (() => {
    if(accion === 'reportes') return {reportes: Object.values(s).filter(x => esAdmin() || x.usuario === USER.id)};
    const x = datos.reporte, y = s[x.id];
    if(!y) s[x.id] = {...x, usuario: USER.id, nombre: USER.nombre, rol: USER.rol, cuadrilla: USER.cuadrilla, estado: 'NUEVO', respuesta: '', foto: datos.foto ? {id: 'demo', url: '#'} : null};
    else if(esAdmin()) s[x.id] = {...y, estado: x.estado, respuesta: x.respuesta, respondio: USER.nombre, actualizado: x.actualizado};
    return {reporte: s[x.id]};
  })();
  LS.set('demoRep', s); return {ok: true, ...r};
}
let sincRepEnCurso = null;
async function sincRep(){
  if(!USER || (!demo() && !navigator.onLine)) return;
  if(sincRepEnCurso) return sincRepEnCurso;
  sincRepEnCurso = (async () => {
    try{
      for(const r of REP.lista.filter(r => r.subida !== r.actualizado && (esAdmin() || r.usuario === USER.id))){
        try{ const v = r.actualizado, {subida, _foto, ...reporte} = r, datos = {reporte};
          if(_foto){ const b = await IDB.traer(_foto); if(b) datos.foto = await blobAb64(b); }
          const j = await apiRep('guardarReporte', datos); Object.assign(r, j.reporte, {subida: j.reporte.actualizado || v}); delete r._foto;
          if(_foto) IDB.quitar(_foto).catch(() => {});
        }catch(e){ console.log('reporte', e); }
      }
      const j = await apiRep('reportes', {});
      j.reportes.forEach(x => { const k = REP.lista.findIndex(y => y.id === x.id);
        if(k < 0) REP.lista.push({...x, subida: x.actualizado}); else if(String(x.actualizado) >= String(REP.lista[k].actualizado) && REP.lista[k].subida === REP.lista[k].actualizado) REP.lista[k] = {...x, subida: x.actualizado}; });
      REP.t = new Date().toISOString();
    }catch(e){ console.log('reportes', e); }
    guardarRep(); pintarAvisoRep();
  })();
  try{ await sincRepEnCurso; } finally { sincRepEnCurso = null; }
}
const pintarAvisoRep = () => { const b = $('#btnAjustes'); if(b) b.classList.toggle('aviso', !!USER && repSinLeer() > 0); };
// Achica la captura para que suba rápido
async function reducirFoto(f){
  const img = await createImageBitmap(f), k = Math.min(1, 1600 / Math.max(img.width, img.height)), cv = document.createElement('canvas');
  cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k); cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
  return new Promise(r => cv.toBlob(r, 'image/jpeg', 0.8));
}
function textoProblema(t){
  const ua = navigator.userAgent, tel = (ua.match(/Android [\d.]+; ([^)]+)\)/) || ua.match(/\(([^)]+)\)/) || [])[1] || '';
  const fallos = FOLIOS.filter(f => f.estado === 'error' && esMio(f)).slice(0, 3).map(f => `Folio ${f.d['FOLIO/OS']}: ${f.error}`);
  return {equipo: tel, senal: navigator.onLine ? 'Con señal' : 'Sin señal', porEnviar: $('#pend').textContent, errores: fallos,
    wa: `⚠️ Problema en NODO\n${t}\n\n${USER.nombre} · ${USER.rol}${USER.cuadrilla ? ' · ' + USER.cuadrilla : ''}\nVersión ${APP_VERSION} · ${tel}\n${navigator.onLine ? 'Con señal' : 'Sin señal'} · por enviar: ${$('#pend').textContent}${fallos.length ? '\nErrores de envío:\n' + fallos.join('\n') : ''}`};
}
function avisarProblema(){
  const adm = (CFG.usuarios || []).find(u => u.rol === 'ADMIN' && u.telefono && u.id !== USER.id) || (CFG.usuarios || []).find(u => u.rol === 'ADMIN' && u.telefono);
  let foto = null;
  const {o, cerrar} = ventana('Avisar de un problema', `<div class="mbody"><label>¿Qué pasó?</label><textarea id="qTxt" rows="5" placeholder="Qué estabas haciendo y qué salió mal"></textarea>
    <label class="btn ghost sm" style="display:inline-block;margin-top:10px">📎 Adjuntar captura<input type="file" id="qFoto" accept="image/*" hidden></label><div id="qPrev"></div>
    <div class="hint">El reporte le llega al administrador con los datos de tu app. Aquí mismo, en Ajustes, verás su respuesta.</div><div id="qErr" class="hint err"></div>
    <button class="btn ghost sm" id="qWa" style="margin-top:14px">Es urgente: mandarlo por WhatsApp</button></div>`,
    `<button class="btn verde" id="qOk">Enviar reporte</button>`);
  o.querySelector('#qFoto').addEventListener('change', e => { foto = e.target.files[0] || null;
    o.querySelector('#qPrev').innerHTML = foto ? `<img src="${URL.createObjectURL(foto)}" alt="" style="max-width:120px;max-height:160px;border-radius:8px;margin-top:8px;display:block">` : ''; });

    if(adm) location.href = `https://wa.me/${telWA(adm.telefono)}?text=${encodeURIComponent(msg)}`; else compartir(msg); };

      version: APP_VERSION, equipo: d.equipo, senal: d.senal, porEnviar: d.porEnviar, errores: d.errores};
    if(foto){ try{ await IDB.poner('rep-' + id, await reducirFoto(foto)); r._foto = 'rep-' + id; }catch(e){} }

/* ===== Jumpeos en OLT (administrador e ingeniero de red) =====

const JUMP = {lista: LS.get('jumpeos', [])};

  if(demo() || !navigator.onLine) return;

    try{ const {_foto, subido, ...lim} = j; const r = await api('guardarJumpeo', {jumpeo: lim, foto: _foto || ''});
      if(r.foto) j.foto = r.foto; delete j._foto; j.subido = j.actualizado; guardarJumpeos(); }catch(e){ console.log('jumpeo', e); }
  }
}

  if(demo() || !navigator.onLine) return;
  try{ await subirJumpeos(); const r = await api('jumpeos', {});
    (r.jumpeos || []).forEach(x => { const i = JUMP.lista.findIndex(y => y.id === x.id); x.subido = x.actualizado;
      if(i < 0) JUMP.lista.push(x); else if((x.actualizado || '') >= (JUMP.lista[i].actualizado || '')) JUMP.lista[i] = x; });

  }
  return null;
}
async function escanearQR(alLeer){

  const video = o.querySelector('video'), h = o.querySelector('#qrh'); let stream = null, vivo = true;
  o.addEventListener('cerrar', () => { vivo = false; if(stream) stream.getTracks().forEach(t => t.stop()); });
  const listo = (raw, foto) => { if(!vivo) return; vivo = false; if(navigator.vibrate) navigator.vibrate(80); alLeer(limpiaQR(raw), foto); cerrar(); };
  o.querySelector('#qrFoto').addEventListener('change', async e => { const f = e.target.files[0]; e.target.value = ''; if(!f) return;
    h.className = 'hint'; h.textContent = 'Leyendo la foto…';
    const raw = await qrDeFoto(det, f);
    if(raw) listo(raw, f); else { h.className = 'hint warn'; h.textContent = 'No se encontró el QR en la foto. Acércate con el zoom de la cámara y que el QR salga nítido.'; } });
  try{ stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment', width:{ideal:1920}, height:{ideal:1080}}, audio:false});
    if(!vivo){ stream.getTracks().forEach(t => t.stop()); return; }      // se cerró mientras pedía la cámara
    video.srcObject = stream; await video.play(); }
  catch(e){ h.className='hint err'; h.textContent = 'No se pudo abrir la cámara. Usa "Leer de una foto" o revisa el permiso de cámara.'; return; }
  const pista = stream.getVideoTracks()[0], cap = pista.getCapabilities ? pista.getCapabilities() : {};
  try{ if((cap.focusMode || []).includes('continuous')) await pista.applyConstraints({advanced:[{focusMode:'continuous'}]}); }catch(e){}
  if(cap.zoom && cap.zoom.max > cap.zoom.min){
    const z = o.querySelector('#qrZoom'), zv = o.querySelector('#qrZoomV'), ini = (pista.getSettings().zoom) || cap.zoom.min;
    z.min = cap.zoom.min; z.max = cap.zoom.max; z.step = cap.zoom.step || 0.1; z.value = ini; zv.textContent = (+ini).toFixed(1) + 'x';
    const poner = v => { v = Math.min(cap.zoom.max, Math.max(cap.zoom.min, v)); z.value = v; zv.textContent = (+v).toFixed(1) + 'x'; pista.applyConstraints({advanced:[{zoom: +v}]}).catch(() => {}); };
    z.oninput = () => poner(+z.value);
    o.querySelector('#qrZoomC').innerHTML = [1, 2, 4, 8].filter(x => x >= cap.zoom.min && x <= cap.zoom.max).map(x => `<button type="button" class="chip" data-z="${x}">${x}x</button>`).join('');
    o.querySelectorAll('#qrZoomC .chip').forEach(b => b.onclick = () => poner(+b.dataset.z));
    o.querySelector('#qrZoomW').classList.remove('hidden');
  } else h.textContent = 'Este teléfono no deja hacer zoom aquí: si el QR está lejos, usa "Leer de una foto".';
  if(cap.torch){ const bl = o.querySelector('#qrLuz'); let on = false; bl.classList.remove('hidden');
    bl.onclick = () => { on = !on; pista.applyConstraints({advanced:[{torch: on}]}).catch(() => {}); bl.classList.toggle('on', on); }; }
  const ciclo = async () => {
    if(!vivo) return;
    try{ const r = await det.detect(video); if(r.length) return listo(r[0].rawValue); }catch(e){}
    setTimeout(ciclo, 200);
  };
  ciclo();
}

/* ===== Cantidades de material coherentes =====
   Al salir del campo: solo números enteros (0.2 m de FO o 1.5 cierres no existen) y, en lo que se gasta en un trabajo
