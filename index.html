<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f5c8c">
<title>Folios FO</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<style>
:root{--azul:#0f5c8c;--azul2:#e6f0f7;--txt:#1d2329;--gris:#6b7680;--borde:#d5dbe0;--fondo:#f4f6f8;--ok:#1f8a4c;--warn:#b26a00;--err:#c0392b}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--fondo);color:var(--txt);font-size:16px}
header{position:sticky;top:0;z-index:5;background:var(--azul);color:#fff;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));display:flex;align-items:center;gap:10px}
header h1{font-size:18px;margin:0;flex:1}
header button{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:8px;padding:8px 10px;font-size:14px}
.banner{padding:8px 16px;font-size:14px}
.banner.demo{background:#fff4d6;color:#6b4a00}
.banner.off{background:#fde8e6;color:var(--err)}
main{padding:12px 12px 110px;max-width:640px;margin:0 auto}
.card{background:#fff;border:1px solid var(--borde);border-radius:12px;padding:14px;margin-bottom:12px}
.card h2{font-size:16px;margin:0 0 10px;color:var(--azul)}
details.card>summary{font-weight:600;color:var(--azul);font-size:16px;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:8px}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:"▾";color:var(--gris)}
details.card[open]>summary::after{content:"▴"}
details.card[open]>summary{margin-bottom:10px}
summary .cnt{font-weight:400;color:var(--gris);font-size:13px;margin-left:auto}
label{display:block;font-size:13px;color:var(--gris);margin:10px 0 4px}
label .req{color:var(--err)}
input,select,textarea{width:100%;font-size:16px;padding:11px 12px;border:1px solid var(--borde);border-radius:8px;background:#fff;color:var(--txt);font-family:inherit}
textarea{min-height:80px;resize:vertical}
.row{display:flex;gap:8px;align-items:flex-end}
.row>*{flex:1;min-width:0}
.btn{display:block;width:100%;padding:14px;border-radius:10px;border:0;font-size:16px;font-weight:600;background:var(--azul);color:#fff;margin-top:10px;cursor:pointer}
.btn.sec{background:var(--azul2);color:var(--azul)}
.btn.ghost{background:#fff;color:var(--azul);border:1px solid var(--borde)}
.btn.verde{background:#1f9d55}
.btn.sm{display:inline-block;width:auto;padding:9px 12px;font-size:14px;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{border:1px solid var(--borde);background:#fff;border-radius:999px;padding:8px 12px;font-size:14px;color:var(--txt);cursor:pointer}
.chip.on{background:var(--azul);color:#fff;border-color:var(--azul)}
.chip.add{border-style:dashed;color:var(--azul)}
.hint{font-size:13px;color:var(--gris);margin-top:4px}
.hint.ok{color:var(--ok)}.hint.warn{color:var(--warn)}.hint.err{color:var(--err)}
.fh{display:flex;gap:8px}.fh input[type=date]{flex:1.3}.fh input[type=time]{flex:1}
.item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid #eef1f3}
.item:last-child{border-bottom:0}
.item .nom{font-size:14px;flex:1;min-width:0}
.item .nom small{display:block;color:var(--gris);font-size:12px}
.item .x{border:0;background:none;color:var(--gris);font-size:20px;width:32px;height:40px;cursor:pointer}
.step{display:flex;align-items:center;gap:4px}
.step button{width:40px;height:40px;border-radius:8px;border:1px solid var(--borde);background:var(--azul2);color:var(--azul);font-size:22px;line-height:1;cursor:pointer}
.step input{width:60px;text-align:center;padding:8px 4px}
.step.m input{width:84px}
.item.con .step input{background:#fffbea;font-weight:600}
.vacio{font-size:14px;color:var(--gris);padding:6px 0}
.sug{background:#eef6ee;border-radius:8px;padding:8px 10px;font-size:13px;color:#24613a;margin-bottom:6px}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--borde);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;z-index:6}
.bar .btn{margin:0}
.lista .f{display:flex;justify-content:space-between;gap:8px;align-items:center}
.estado{font-size:12px;padding:3px 8px;border-radius:999px;white-space:nowrap}
.estado.pendiente{background:#fff4d6;color:#6b4a00}.estado.enviado{background:#e3f4ea;color:var(--ok)}.estado.error{background:#fde8e6;color:var(--err)}
pre.wa{white-space:pre-wrap;font-family:inherit;font-size:14px;background:#f0f7ee;border-radius:8px;padding:12px;margin:0;max-height:50vh;overflow:auto}
.big{font-size:28px;font-weight:700}
.kpis{display:flex;gap:8px}.kpis .card{flex:1;text-align:center;margin:0}
.toast{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top));transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;z-index:40;max-width:90%}
.hidden{display:none!important}
/* ventanas */
.modal{position:fixed;inset:0;z-index:30;background:#fff;display:flex;flex-direction:column}
.modal .mtop{display:flex;align-items:center;gap:8px;padding:12px;padding-top:calc(12px + env(safe-area-inset-top));background:var(--azul);color:#fff}
.modal .mtop b{flex:1;font-size:17px}
.modal .mtop button{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:8px;padding:8px 12px;font-size:15px}
.modal .mbody{flex:1;overflow:auto;padding:12px}
.modal .mpie{padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--borde);display:flex;gap:8px}
.modal .mpie .btn{margin:0}
.pick{display:flex;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid #eef1f3;cursor:pointer}
.pick .ck{width:24px;height:24px;border-radius:6px;border:2px solid var(--borde);display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;flex:none}
.pick.on .ck{background:var(--azul);border-color:var(--azul)}
.pick .nom{flex:1;font-size:15px}.pick small{display:block;color:var(--gris);font-size:12px}
.grp{font-size:12px;font-weight:600;color:var(--gris);text-transform:uppercase;letter-spacing:.04em;margin:14px 4px 2px}
details.gr{border-bottom:1px solid #eef1f3}
details.gr>summary{list-style:none;display:flex;justify-content:space-between;gap:8px;padding:14px 4px;font-weight:600;color:var(--azul);cursor:pointer}
details.gr>summary::-webkit-details-marker{display:none}
details.gr>summary::after{content:"▾";color:var(--gris)}
details.gr[open]>summary::after{content:"▴"}
details.gr .cnt{margin-left:auto;font-weight:400;font-size:13px;color:var(--gris)}
/* mapa */
.mv{flex:1;position:relative;overflow:hidden;background:#e9edf0;touch-action:none;cursor:crosshair}
.mv img{position:absolute;width:256px;height:256px;user-select:none;-webkit-user-drag:none;pointer-events:none}
.mv svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.mv .pin{position:absolute;width:28px;height:28px;margin:-28px 0 0 -14px;pointer-events:none;font-size:28px;line-height:28px;text-align:center}
.mzoom{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px;z-index:2}
.mzoom button{width:44px;height:44px;border-radius:8px;border:1px solid var(--borde);background:#fff;font-size:22px;color:var(--azul)}
.mattr{position:absolute;right:4px;bottom:2px;font-size:10px;color:#555;background:rgba(255,255,255,.7);padding:1px 4px;z-index:2}
.minfo{padding:10px 12px;font-size:14px;border-top:1px solid var(--borde)}
video.qr{width:100%;border-radius:12px;background:#000;max-height:60vh;object-fit:cover}
</style>
</head>

<main id="app"></main>

/* --- Navegación: el botón "atrás" del teléfono regresa a la pantalla anterior --- */
const MODALES = [];                       // ventanas abiertas; "atrás" cierra la de arriba
const nivel = () => (history.state && history.state.n) || 0;
function ir(h){ history.pushState({n: nivel() + 1}, '', h || '#'); router(); }
function reemplazar(h){ history.replaceState({...(history.state||{}), n: nivel()}, '', h || '#'); router(); }
function volver(def){ if(nivel() > 0) history.back(); else reemplazar(def); }
let avisoSalir = false;
addEventListener('popstate', e => {
  if(MODALES.length){ MODALES.pop()(); return; }
  if(e.state && e.state.raiz){          // en la pantalla de inicio: pide confirmar con otro "atrás"
    avisoSalir = true; toast('Toca atrás otra vez para salir');
    setTimeout(() => { if(avisoSalir && history.state && history.state.raiz){ history.pushState({n:0, guardia:1}, '', location.href); } avisoSalir = false; }, 2000);
    return;
  }
  router();
});
function abrirModal(alCerrar){ history.pushState({n: nivel(), modal:1}, '', location.href); MODALES.push(alCerrar); }
function preguntar(msg, si='Sí', no='Cancelar'){
  return new Promise(res => {
    const o = document.createElement('div'); let r = false;
    o.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px';
    o.innerHTML = `<div class="card" style="max-width:400px;width:100%;margin:0"><div style="margin-bottom:8px">${esc(msg)}</div><button class="btn" data-r="1">${esc(si)}</button><button class="btn ghost" data-r="0">${esc(no)}</button></div>`;
    o.onclick = e => { const v = e.target.dataset && e.target.dataset.r; if(v!==undefined){ r = v==='1'; history.back(); } };
    document.body.appendChild(o);
    abrirModal(() => { o.remove(); res(r); });
  });
}
function ventana(titulo, cuerpo, pie){
  const o = document.createElement('div'); o.className='modal';
  o.innerHTML = `<div class="mtop"><b>${esc(titulo)}</b><button data-cerrar>Cerrar</button></div>${cuerpo}${pie?`<div class="mpie">${pie}</div>`:''}`;
  document.body.appendChild(o);
  abrirModal(() => { o.dispatchEvent(new Event('cerrar')); o.remove(); });
  const cerrar = () => { if(o.isConnected) history.back(); };
  o.querySelector('[data-cerrar]').onclick = cerrar;
  return {o, cerrar};
}

  c.sugerencias = c.sugerencias || SUGERENCIAS_BASE;
  return c;
}

/* ===== Cluster por coordenadas ===== */
function dentro(lon, lat, p){ let c=false; for(let i=0,j=p.length-1;i<p.length;j=i++){ const [x1,y1]=p[i],[x2,y2]=p[j]; if((y1>lat)!==(y2>lat) && lon < (x2-x1)*(lat-y1)/(y2-y1)+x1) c=!c; } return c; }
function distKm(a,b,c,d){ const R=6371, r=Math.PI/180, x=(d-b)*r*Math.cos((a+c)/2*r), y=(c-a)*r; return Math.sqrt(x*x+y*y)*R; }
function clusterDe(lat, lon){
  for(const z of CLUSTERS_GEO) if(dentro(lon, lat, z.p)) return {cluster:z.cluster, zona:z.zona, km:0};
  let best=null;
  for(const z of CLUSTERS_GEO) for(const [x,y] of z.p){ const k=distKm(lat,lon,y,x); if(!best||k<best.km) best={cluster:z.cluster, zona:z.zona, km:k}; }
  return best && best.km <= 3 ? best : null;
}
function parseCoords(s){ const m = String(s||'').match(/(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)/); return m ? [parseFloat(m[1]), parseFloat(m[2])] : null; }

}

let sincronizando = false;
async function sincronizar(manual){
  pintarPendientes();
  if(!USER) return;                        // sin sesión no se envía ni se redibuja la pantalla de entrada
  const pend = FOLIOS.filter(f => f.estado !== 'enviado');

  if(!navigator.onLine || sincronizando || !pend.length){ if(manual && !pend.length) toast('Todo está enviado'); return; }
  sincronizando = true;
  let ok = 0;
  for(const f of pend){
    try{
      const campos = {}; Object.keys(f.d).forEach(k => { if(!k.startsWith('_')) campos[k] = f.d[k]; });
      const dueno = f.usuario || USER.id, pin = dueno === USER.id ? USER.pin : (LS.get('creds', {})[dueno]);
      if(!pin) throw new Error(`Entra con ${nombreDe(dueno)} para enviarlo`);
      const j = await api('guardarFolio', {folio:{id:f.id, version:f.version, campos}}, {id:dueno, pin});
      f.estado='enviado'; f.error=''; ok++;
      if(j.ubicacion && !f.d['UBICACIÓN DEL DAÑO']) f.d['UBICACIÓN DEL DAÑO'] = j.ubicacion;
      if(j.aviso) f.aviso = j.aviso;
    }catch(e){ f.estado='error'; f.error=String(e.message||e); }
    guardarFolios();
  }
  sincronizando = false;
  if(ok) toast(`${ok} folio(s) enviado(s)`);
  if(!MODALES.length && (location.hash.startsWith('#folios') || location.hash.startsWith('#ver') || location.hash==='' || location.hash==='#')) router();
}

/* ===== Mini mapa (sin librerías) ===== */
const MAPA_COLORES = {'MARINA':'#2a7ab8','MALECON':'#c2702a','NUEVO VALLARTA':'#2f9e5b','BUCERIAS':'#8b5cc4','PUNTA MITA':'#c4415e'};
function abrirMapa(coordsTxt, alElegir){
  const inicial = parseCoords(coordsTxt);
  let pt = inicial, z = inicial ? 17 : 12;
  const S = z => 256 * 2 ** z;
  const wx = (lon,z) => (lon + 180) / 360 * S(z);
  const wy = (lat,z) => { const s = Math.sin(lat*Math.PI/180); return (0.5 - Math.log((1+s)/(1-s)) / (4*Math.PI)) * S(z); };
  const ilon = (x,z) => x / S(z) * 360 - 180;
  const ilat = (y,z) => { const n = Math.PI - 2*Math.PI*y/S(z); return 180/Math.PI*Math.atan(Math.sinh(n)); };
  const c0 = inicial || CENTRO_MAPA;
  let cx = wx(c0[1], z), cy = wy(c0[0], z), ox = 0, oy = 0;
  const {o, cerrar} = ventana('Marca el punto del daño',
    `<div class="mv" id="mv"><div id="mt"></div><svg id="ms"><g id="mg"></g></svg><div class="pin hidden" id="mpin">📍</div>
       <div class="mzoom"><button id="mzi">+</button><button id="mzo">−</button></div><div class="mattr">© OpenStreetMap</div></div>
     <div class="minfo" id="minf">Toca el mapa donde está el daño.</div>`,
    `<button class="btn ghost" id="mgps" style="flex:.8">📍 Mi ubicación</button><button class="btn verde" id="mok">Usar este punto</button>`);
  const mv = o.querySelector('#mv'), mt = o.querySelector('#mt'), mg = o.querySelector('#mg'), pin = o.querySelector('#mpin');
  const tiles = new Map();
  function zonas(){
    ox = cx; oy = cy;
    mg.innerHTML = CLUSTERS_GEO.map(zn => {
      const col = MAPA_COLORES[zn.cluster] || '#555';
      const dd = 'M' + zn.p.map(([lon,lat]) => (wx(lon,z)-ox).toFixed(1)+' '+(wy(lat,z)-oy).toFixed(1)).join('L') + 'Z';
      return `<path d="${dd}" fill="${col}" fill-opacity=".13" stroke="${col}" stroke-width="1.5"/>`;
    }).join('');
  }
  function pintar(){
    const W = mv.clientWidth, H = mv.clientHeight, x0 = cx - W/2, y0 = cy - H/2, n = 2 ** z, vistos = new Set();
    for(let tx = Math.floor(x0/256); tx <= Math.floor((x0+W)/256); tx++)
      for(let ty = Math.floor(y0/256); ty <= Math.floor((y0+H)/256); ty++){
        if(ty < 0 || ty >= n) continue;
        const k = `${z}/${((tx % n) + n) % n}/${ty}`; vistos.add(k+'@'+tx);
        let im = tiles.get(k+'@'+tx);
        if(!im){ im = new Image(); im.alt=''; im.onerror = () => { im.style.visibility='hidden'; }; im.src = `https://tile.openstreetmap.org/${k}.png`; tiles.set(k+'@'+tx, im); mt.appendChild(im); }
        im.style.left = (tx*256 - x0) + 'px'; im.style.top = (ty*256 - y0) + 'px';
      }
    for(const [k, im] of tiles) if(!vistos.has(k)){ im.remove(); tiles.delete(k); }
    mg.setAttribute('transform', `translate(${W/2 - (cx-ox)} ${H/2 - (cy-oy)})`);
    if(pt){ pin.classList.remove('hidden'); pin.style.left = (wx(pt[1],z) - x0) + 'px'; pin.style.top = (wy(pt[0],z) - y0) + 'px'; }
  }
  function info(){
    const el = o.querySelector('#minf');
    if(!pt){ el.textContent = 'Toca el mapa donde está el daño.'; return; }
    const r = clusterDe(pt[0], pt[1]);
    el.innerHTML = `<b>${pt[0].toFixed(6)}, ${pt[1].toFixed(6)}</b> · ${r ? esc(r.cluster) + (r.km ? ' (cerca)' : '') : 'fuera de las zonas'}${navigator.onLine ? '' : '<div class="hint warn">Sin señal: solo se ven las zonas y los mapas que ya se habían cargado.</div>'}`;
  }
  function zoom(dz){
    const nz = Math.max(10, Math.min(19, z + dz)); if(nz === z) return;
    const lat = ilat(cy, z), lon = ilon(cx, z); z = nz; cx = wx(lon, z); cy = wy(lat, z); zonas(); pintar();
  }
  const ptrs = new Map(); let ini = null, pinch = null;
  mv.addEventListener('pointerdown', e => { if(e.target.closest('.mzoom')) return; mv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]);
    if(ptrs.size === 1) ini = {x:e.clientX, y:e.clientY, cx, cy, mov:false};
    if(ptrs.size === 2){ const [a,b] = [...ptrs.values()]; pinch = Math.hypot(a[0]-b[0], a[1]-b[1]); if(ini) ini.mov = true; } });
  mv.addEventListener('pointermove', e => { if(!ptrs.has(e.pointerId)) return; ptrs.set(e.pointerId, [e.clientX, e.clientY]);
    if(ptrs.size === 2 && pinch){ const [a,b] = [...ptrs.values()], dd = Math.hypot(a[0]-b[0], a[1]-b[1]);
      if(dd/pinch > 1.5){ zoom(1); pinch = dd; } else if(dd/pinch < 0.67){ zoom(-1); pinch = dd; } return; }
    if(!ini) return; const dx = e.clientX - ini.x, dy = e.clientY - ini.y;
    if(Math.abs(dx) + Math.abs(dy) > 8) ini.mov = true;
    if(ini.mov){ cx = ini.cx - dx; cy = ini.cy - dy; pintar(); } });
  const fin = e => { if(!ptrs.has(e.pointerId)) return; ptrs.delete(e.pointerId);
    if(ptrs.size === 0){ if(ini && !ini.mov && e.type === 'pointerup'){ const r = mv.getBoundingClientRect();
        pt = [ilat(cy - r.height/2 + (e.clientY - r.top), z), ilon(cx - r.width/2 + (e.clientX - r.left), z)]; pintar(); info(); }
      ini = null; pinch = null; } };
  mv.addEventListener('pointerup', fin); mv.addEventListener('pointercancel', fin);
  mv.addEventListener('wheel', e => { e.preventDefault(); zoom(e.deltaY < 0 ? 1 : -1); }, {passive:false});
  o.querySelector('#mzi').onclick = () => zoom(1); o.querySelector('#mzo').onclick = () => zoom(-1);
  o.querySelector('#mgps').onclick = () => {
    if(!navigator.geolocation) return toast('Este teléfono no da ubicación');
    toast('Buscando GPS…');
    navigator.geolocation.getCurrentPosition(p => { pt = [p.coords.latitude, p.coords.longitude]; z = Math.max(z, 17); cx = wx(pt[1], z); cy = wy(pt[0], z); zonas(); pintar(); info(); },
      () => toast('No se pudo obtener el GPS'), {enableHighAccuracy:true, timeout:20000, maximumAge:30000});
  };
  o.querySelector('#mok').onclick = () => { if(!pt) return toast('Toca el mapa para marcar el punto'); alElegir(pt[0], pt[1]); cerrar(); };
  addEventListener('resize', pintar); o.addEventListener('cerrar', () => removeEventListener('resize', pintar));
  zonas(); requestAnimationFrame(() => { pintar(); info(); });
}

/* ===== Escáner de QR ===== */
async function escanearQR(alLeer){
  if(!('BarcodeDetector' in window)) return toast('Este navegador no lee QR. Abre la app en Chrome o escribe el código.');
  let det; try{ det = new BarcodeDetector({formats:['qr_code']}); }catch(e){ return toast('Este teléfono no lee QR; escribe el código.'); }
  const {o, cerrar} = ventana('Escanear QR', `<div class="mbody"><video class="qr" playsinline muted></video><div class="hint" id="qrh">Apunta la cámara al QR de segundo nivel.</div></div>`);
  const video = o.querySelector('video'); let stream = null, vivo = true;
  o.addEventListener('cerrar', () => { vivo = false; if(stream) stream.getTracks().forEach(t => t.stop()); });
  try{ stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}, audio:false}); video.srcObject = stream; await video.play(); }
  catch(e){ o.querySelector('#qrh').className='hint err'; o.querySelector('#qrh').textContent = 'No se pudo abrir la cámara. Revisa el permiso de cámara para esta app.'; return; }
  const ciclo = async () => {
    if(!vivo) return;
    try{ const r = await det.detect(video); if(r.length){ const raw = r[0].rawValue.trim(), m = raw.match(/TP\s*-?\s*\d{4,}/i);
        alLeer(m ? m[0].replace(/[\s-]/g,'').toUpperCase() : raw.slice(0,60)); if(navigator.vibrate) navigator.vibrate(80); cerrar(); return; } }catch(e){}
    setTimeout(ciclo, 250);
  };
  ciclo();
}

function tipico(h, causa){ const x = sugerenciasPara(causa).find(([k]) => k === h); return x ? x[1] : null; }

function pantallaFolio(id){
  const edit = id ? FOLIOS.find(f=>f.id===id) : null;

  if(edit && !puedeEditar(edit)){ toast(`Solo se puede corregir durante ${HORAS_EDICION} h`); reemplazar('#ver/'+id); return; }
  const borr = !edit ? LS.get(CLAVE_BORRADOR(), null) : null;
  const hoy = hoyISO();
  const d = edit ? structuredClone(edit.d) : (borr ? borr.d : {
    'ÁREA':'DISTRITO','PROVEEDOR':(CFG.listas.PROVEEDOR||[''])[0],'TIPO DE MANTENIMIENTO':'CORRECTIVO',
    'SUPERVISOR DISTRITO': CFG.supervisorDefault || (CFG.listas.SUPERVISOR||[''])[0],
    'TECNICO QUE ATIENDE': USER.rol==='TECNICO' ? USER.nombre : '',
    'FECHA Y HORA DE ASIGNACIÓN': hoy+'T', 'FECHA Y HORA DE LLEGADA': ahoraLocal(), 'HORA FINAL': hoy+'T'});
  // qué renglones se ven en trabajos / materiales: los que tienen cantidad + los agregados o sugeridos
  const vis = d._vis || {trab:[], mat:[]};
  ['trab','mat'].forEach(t => CATALOGO[t].forEach(it => { if(parseFloat(d[it.h])>0 && !vis[t].includes(it.h)) vis[t].push(it.h); }));
  d._vis = vis; d._sug = d._sug || [];
  const L = CFG.listas;
  $('#titulo').textContent = edit ? 'Corregir folio' : 'Nuevo folio';
  const tecnicos = (CFG.usuarios||[]).filter(u=>u.rol==='TECNICO' && u.activo!==false).map(u=>u.nombre);
  if(USER.rol==='TECNICO' && !tecnicos.includes(USER.nombre)) tecnicos.unshift(USER.nombre);
  const fijo = k => (L[k]||[]).length <= 1;       // proveedor / supervisor con un solo valor: no se pregunta
  if(fijo('PROVEEDOR') && !edit) d['PROVEEDOR'] = (L.PROVEEDOR||[''])[0];
  if(fijo('SUPERVISOR') && !edit) d['SUPERVISOR DISTRITO'] = (L.SUPERVISOR||[''])[0];
  const opcionesCausa = (falla, val) => {
    const com = ((CFG.sugerencias||SUGERENCIAS_BASE).causasPorFalla||{})[MAY(falla)] || [], todas = L.CAUSA || [];
    const comunes = com.filter(c => todas.includes(c)), resto = todas.filter(c => !comunes.includes(c));
    if(val && !todas.includes(val)) resto.unshift(val);
    const op = v => `<option value="${esc(v)}" ${v===val?'selected':''}>${esc(v)}</option>`;
    return `<option value="">Selecciona</option>` + (comunes.length
      ? `<optgroup label="Comunes para ${esc(falla)}">${comunes.map(op).join('')}</optgroup><optgroup label="Otras causas">${resto.map(op).join('')}</optgroup>`
      : todas.map(op).join(''));
  };
  const selTec = new Set(String(d['TECNICO QUE ATIENDE']||'').split(',').map(s=>MAY(s.trim())).filter(Boolean));
  const campoFecha = (k, label, req) => { const [f,t] = String(d[k]||'').split('T');
    return `<label>${label}${req?' <span class="req">*</span>':''}</label>
     <div class="fh" data-fh="${esc(k)}"><input type="date" value="${esc(f||'')}" data-fd aria-label="Fecha"><input type="time" value="${esc(t||'')}" data-ft aria-label="Hora"></div>
     <div class="chips"><button type="button" class="chip" data-q="hoy" data-k="${esc(k)}">Hoy</button><button type="button" class="chip" data-q="ayer" data-k="${esc(k)}">Ayer</button><button type="button" class="chip" data-q="ahora" data-k="${esc(k)}">Ahora</button></div>
     <input type="hidden" data-c="${esc(k)}" value="${esc(d[k]||'')}">`; };
  $('#app').innerHTML = `
  <details class="card" open><summary>1. Datos del folio</summary>
    <label>FOLIO / OS <span class="req">*</span></label><div class="row"><input data-c="FOLIO/OS" data-num inputmode="numeric" value="${esc(d['FOLIO/OS']||'')}"><button type="button" class="btn sm sec" data-na="FOLIO/OS" style="flex:0 0 auto">N/A</button></div>
    <div class="row"><div><label>OT</label><div class="row"><input data-c="OT" data-num inputmode="numeric" value="${esc(d['OT']??'')}" placeholder="Número"><button type="button" class="btn sm sec" data-na="OT" style="flex:0 0 auto">N/A</button></div></div>
      <div><label>Área</label><select data-c="ÁREA">${opciones(L.AREA, d['ÁREA'])}</select></div></div>
    <div class="row"><div><label>Falla reportada <span class="req">*</span></label><select data-c="FALLA REPORTADA" id="fFalla">${opciones(L.FALLA, d['FALLA REPORTADA'])}</select></div>
      <div style="flex:.55"><label>Clientes afectados</label><input data-c="CLIENTES AFECTADOS" type="number" inputmode="numeric" value="${esc(d['CLIENTES AFECTADOS']??'')}"></div></div>
    ${campoFecha('FECHA Y HORA DE ASIGNACIÓN','Fecha y hora de asignación',true)}
    <label>Tipo de mantenimiento</label><select data-c="TIPO DE MANTENIMIENTO">${opciones(L.TIPO_MANT, d['TIPO DE MANTENIMIENTO'])}</select>
  </details>
  <details class="card" open><summary>2. Ubicación</summary>
    <div class="row"><button type="button" class="btn sec" id="bGps" style="margin:0">📍 Mi ubicación</button><button type="button" class="btn sec" id="bMapa" style="margin:0">🗺️ Marcar en mapa</button></div>
    <label>Coordenadas <span class="req">*</span></label><input data-c="COORDENADAS" id="fCoord" inputmode="decimal" placeholder="20.681330, -105.218282" value="${esc(d['COORDENADAS']||'')}">
    <div class="hint" id="hCoord">Si no estás en el punto del daño, márcalo en el mapa o escríbelo.</div>
    <div class="row"><div><label>Cluster <span class="req">*</span></label><select data-c="CLUSTER" id="fCluster">${opciones(Object.keys(CFG.clusters||{}), d['CLUSTER'])}</select></div>
      <div><label>OLT <span class="req">*</span></label><select data-c="OLT" id="fOlt"></select></div></div>
    <div class="hint" id="hCluster"></div>
    <div class="hint" id="hCiudad"></div>
    <label>Ubicación del daño (dirección)</label><input data-c="UBICACIÓN DEL DAÑO" value="${esc(d['UBICACIÓN DEL DAÑO']||'')}" placeholder="Si lo dejas vacío se llena solo al enviar">
  </details>
  <details class="card" open><summary>3. Atención</summary>
    ${campoFecha('FECHA Y HORA DE LLEGADA','Fecha y hora de llegada',true)}
    <label>Causa del daño <span class="req">*</span></label><select data-c="CAUSA DE DAÑO" id="fCausa">${opcionesCausa(d['FALLA REPORTADA'], MAY(d['CAUSA DE DAÑO']))}</select>
    <label>Descripción de actividades</label><textarea data-c="DESCIPCIÓN DE ACTIVIDADES">${esc(d['DESCIPCIÓN DE ACTIVIDADES']||'')}</textarea>
    <div class="row"><div><label>Potencia inicial</label><input data-c="POTENCIA INICIAL" list="dlPot" value="${esc(d['POTENCIA INICIAL']||'')}"></div>
      <div><label>Potencia final</label><input data-c="POTENCIA FINAL" list="dlPot" value="${esc(d['POTENCIA FINAL']||'')}"></div></div>
    <datalist id="dlPot">${(L.POTENCIA||[]).map(v=>`<option value="${esc(v)}">`).join('')}</datalist>
    ${campoFecha('HORA FINAL','Hora final',false)}
  </details>
  <details class="card" open id="secTrab"><summary>4. Trabajos realizados <span class="cnt" id="cntTrab"></span></summary><div id="sugTrab"></div><div id="lTrab"></div>
    <div class="chips"><button type="button" class="chip add" data-agregar="trab">＋ Agregar trabajo</button></div></details>
  <details class="card" open id="secMat"><summary>5. Material utilizado <span class="cnt" id="cntMat"></span></summary><div id="sugMat"></div><div id="lMat"></div>
    <div class="chips"><button type="button" class="chip add" data-agregar="mat">＋ Agregar material</button></div></details>
  <details class="card" open><summary>6. Cierre</summary>
    <label>QR segundo nivel</label><div class="row"><input data-c="QR SEGUNDO NIVEL" id="fQr" value="${esc(d['QR SEGUNDO NIVEL']||'')}" placeholder="TP000000" autocapitalize="characters"><button type="button" class="btn sm sec" id="bQr" style="flex:0 0 auto;white-space:nowrap">📷 Escanear</button></div>
    <label>Técnicos que atienden</label><div class="chips" id="cTec">${tecnicos.map(t=>`<button type="button" class="chip ${selTec.has(t)?'on':''}">${esc(t)}</button>`).join('')}</div>
    ${fijo('PROVEEDOR') && fijo('SUPERVISOR')
      ? `<div class="hint" style="margin-top:12px">Proveedor: <b>${esc(d['PROVEEDOR'])}</b> · Supervisor: <b>${esc(d['SUPERVISOR DISTRITO'])}</b></div>
         <input type="hidden" data-c="PROVEEDOR" value="${esc(d['PROVEEDOR']||'')}"><input type="hidden" data-c="SUPERVISOR DISTRITO" value="${esc(d['SUPERVISOR DISTRITO']||'')}">`
      : `<div class="row"><div><label>Proveedor</label><select data-c="PROVEEDOR">${opciones(L.PROVEEDOR, d['PROVEEDOR'])}</select></div>
      <div><label>Supervisor</label><select data-c="SUPERVISOR DISTRITO">${opciones(L.SUPERVISOR, d['SUPERVISOR DISTRITO'])}</select></div></div>`}
  </details>
  <div id="ferr" class="hint err"></div>`;
  $('#bar').classList.remove('hidden');
  $('#bar').innerHTML = `<button class="btn ghost" id="bCanc" style="flex:.5">${edit?'Cancelar':'Salir'}</button><button class="btn verde" id="bGuardar">${edit?'Guardar corrección':'Guardar folio'}</button>`;

  /* --- lectura y borrador --- */
  const leer = () => {
    document.querySelectorAll('[data-c]').forEach(el => { d[el.dataset.c] = el.value.trim(); });
    d['TECNICO QUE ATIENDE'] = [...document.querySelectorAll('#cTec .chip.on')].map(b=>b.textContent).join(' , ');
    d['CAUSA DE DAÑO'] = MAY(d['CAUSA DE DAÑO']);
    const c = CFG.clusters[d['CLUSTER']]; if(c){ d['CIUDAD']=c.ciudad; d['ESTADO']=c.estado; }
    return d;
  };
  const autosave = () => { if(!edit) LS.set(CLAVE_BORRADOR(), {d:leer(), t:Date.now()}); };

  /* --- folio y OT: solo números o N/A --- */
  document.querySelectorAll('[data-num]').forEach(el => el.addEventListener('input', () => {
    const v = el.value.toUpperCase(); el.value = v === 'N/A' ? v : v.replace(/\D/g, ''); }));
  document.querySelectorAll('[data-na]').forEach(b => b.onclick = () => { document.querySelector(`[data-c="${b.dataset.na}"]`).value = 'N/A'; autosave(); });
  $('#fFalla').addEventListener('change', () => { const v = $('#fCausa').value; $('#fCausa').innerHTML = opcionesCausa($('#fFalla').value, v); });

  /* --- fechas --- */
  const sincFecha = k => { const box = document.querySelector(`[data-fh="${k}"]`), f = box.querySelector('[data-fd]').value, t = box.querySelector('[data-ft]').value;
    document.querySelector(`[data-c="${k}"]`).value = f ? `${f}T${t}` : ''; };
  document.querySelectorAll('[data-fh]').forEach(box => box.addEventListener('change', () => { sincFecha(box.dataset.fh); autosave(); }));
  document.querySelectorAll('[data-q]').forEach(b => b.onclick = () => {
    const box = document.querySelector(`[data-fh="${b.dataset.k}"]`), fd = box.querySelector('[data-fd]'), ft = box.querySelector('[data-ft]');
    if(b.dataset.q === 'hoy') fd.value = hoyISO();
    if(b.dataset.q === 'ayer') fd.value = local(Date.now() - 864e5).slice(0,10);
    if(b.dataset.q === 'ahora'){ const a = ahoraLocal(); fd.value = a.slice(0,10); ft.value = a.slice(11,16); }
    if(b.dataset.q !== 'ahora' && !ft.value) ft.focus();
    sincFecha(b.dataset.k); autosave();
  });

  /* --- ubicación y cluster --- */
  const pintarOlt = (auto) => {
    const c = CFG.clusters[$('#fCluster').value], olts = c ? c.olts : [];
    const prev = auto ? '' : (d['OLT']||'');
    $('#fOlt').innerHTML = opciones(olts, olts.length===1 ? olts[0] : (olts.includes(prev)?prev:''), olts.length>1?'Elige OLT':'—');
    $('#hCiudad').textContent = c ? `${c.ciudad}, ${c.estado}` : '';
  };
  const detectar = () => {
    const xy = parseCoords($('#fCoord').value), h = $('#hCluster');
    if(!xy){ h.textContent=''; return; }
    const r = clusterDe(xy[0], xy[1]);
    if(!r){ h.className='hint warn'; h.textContent='Fuera de las zonas conocidas: elige el cluster a mano.'; return; }
    if($('#fCluster').value !== r.cluster){ $('#fCluster').value = r.cluster; pintarOlt(true); }
    h.className = r.km ? 'hint warn' : 'hint ok';
    h.textContent = r.km ? `Cerca de ${r.zona} (${r.km.toFixed(1)} km). Revisa el cluster.` : `Detectado: ${r.zona}`;
  };
  const ponerCoords = (lat, lon, msg) => { $('#fCoord').value = `${lat.toFixed(6)}, ${lon.toFixed(6)}`; const h = $('#hCoord'); h.className='hint ok'; h.textContent = msg; detectar(); autosave(); };
  pintarOlt(false);
  $('#app').addEventListener('input', autosave);
  $('#app').addEventListener('change', autosave);
  $('#fCluster').onchange = () => { pintarOlt(true); $('#hCluster').textContent=''; autosave(); };
  $('#fCoord').addEventListener('change', detectar);
  $('#bGps').onclick = () => {
    const h = $('#hCoord');
    if(!navigator.geolocation){ h.textContent='Este teléfono no permite ubicación; usa el mapa o escríbela.'; return; }
    h.className='hint'; h.textContent='Buscando señal GPS…';
    navigator.geolocation.getCurrentPosition(p => ponerCoords(p.coords.latitude, p.coords.longitude, `Ubicación tomada (precisión ±${Math.round(p.coords.accuracy)} m). Si no estás en el punto, usa el mapa.`),
      e => { h.className='hint err'; h.textContent = e.code===1 ? 'Permiso de ubicación negado. Actívalo, usa el mapa o escribe las coordenadas.' : 'No se pudo obtener el GPS. Usa el mapa o escríbelas.'; },
      {enableHighAccuracy:true, timeout:20000, maximumAge:30000});
  };
  $('#bMapa').onclick = () => abrirMapa($('#fCoord').value, (lat, lon) => ponerCoords(lat, lon, 'Punto marcado en el mapa.'));
  if(!edit && !borr && !d['COORDENADAS']) $('#bGps').click();   // nuevo folio: intenta tomar el GPS de una vez

  /* --- trabajos y materiales --- */
  function pintarLista(t){
    const cont = $(t==='trab' ? '#lTrab' : '#lMat'), causa = $('#fCausa').value;
    const its = vis[t].map(h => CATALOGO[t].find(i => i.h === h)).filter(Boolean);
    cont.innerHTML = its.length ? its.map(it => { const v = d[it.h] ?? '', m = it.uni === 'm', t0 = tipico(it.h, causa), tp = t0 == null ? null : (m ? t0 : Math.max(1, Math.round(t0)));
      return `<div class="item ${parseFloat(v)>0?'con':''}"><button type="button" class="x" data-quitar="${esc(it.h)}" data-t="${t}" aria-label="Quitar">×</button>
        <div class="nom">${esc(it.n)}<small>${esc(it.sub)}${tp?` · normalmente ${tp}${m?' m':''}`:''}${d._sug.includes(it.h)&&!(parseFloat(v)>0)?' · sugerido':''}</small></div>
        <div class="step ${m?'m':''}">${m?'':'<button type="button" data-d="-1">−</button>'}<input type="number" inputmode="${m?'decimal':'numeric'}" min="0" value="${esc(v)}" data-c="${esc(it.h)}" placeholder="0">${m?'':'<button type="button" data-d="1">+</button>'}</div></div>`; }).join('')
      : `<div class="vacio">Nada agregado todavía.</div>`;
    const usados = CATALOGO[t].filter(i => parseFloat(d[i.h]) > 0).length;
    $(t==='trab' ? '#cntTrab' : '#cntMat').textContent = usados ? `${usados} con cantidad` : '';
  }
  const pintarListas = () => { pintarLista('trab'); pintarLista('mat'); };
  function aplicarSugerencias(causa, avisar){
    // quita sugerencias anteriores que quedaron vacías y agrega las de la causa nueva
    ['trab','mat'].forEach(t => { vis[t] = vis[t].filter(h => !(d._sug.includes(h) && !(parseFloat(d[h])>0))); });
    const s = causa ? sugerenciasPara(causa).map(([h]) => h) : [];
    d._sug = s;
    s.forEach(h => { const t = CATALOGO.trab.some(i=>i.h===h) ? 'trab' : 'mat'; if(!vis[t].includes(h)) vis[t].push(h); });
    const nt = s.filter(h => CATALOGO.trab.some(i=>i.h===h)).length, nm = s.length - nt;
    $('#sugTrab').innerHTML = causa && nt ? `<div class="sug">Agregamos ${nt} trabajo(s) comunes para <b>${esc(causa)}</b>. Pon la cantidad; lo que quede vacío no se guarda.</div>` : '';
    $('#sugMat').innerHTML = causa && nm ? `<div class="sug">Agregamos ${nm} material(es) comunes para <b>${esc(causa)}</b>. Pon la cantidad; lo que quede vacío no se guarda.</div>` : '';
    pintarListas(); if(avisar && s.length) toast('Agregamos trabajos y materiales sugeridos');
  }
  $('#fCausa').addEventListener('change', () => { leer(); aplicarSugerencias($('#fCausa').value, true); autosave(); });
  pintarListas();
  for(const id of ['#lTrab','#lMat']) {
    $(id).addEventListener('click', e => {
      const b = e.target.closest('button'); if(!b) return;
      if(b.dataset.quitar){ leer(); d[b.dataset.quitar] = ''; vis[b.dataset.t] = vis[b.dataset.t].filter(h => h !== b.dataset.quitar); pintarListas(); autosave(); return; }
      if(b.dataset.d){ const inp = b.parentNode.querySelector('input'); const v = Math.max(0, (parseFloat(inp.value)||0) + parseInt(b.dataset.d));
        inp.value = v || ''; d[inp.dataset.c] = inp.value; b.closest('.item').classList.toggle('con', v>0); autosave(); }
    });
    $(id).addEventListener('input', e => { const i = e.target; if(i.dataset.c){ d[i.dataset.c] = i.value; i.closest('.item').classList.toggle('con', parseFloat(i.value)>0); } });
    $(id).addEventListener('change', () => pintarListas());
  }
  document.querySelectorAll('[data-agregar]').forEach(b => b.onclick = () => {
    leer(); const t = b.dataset.agregar, sel = new Set(vis[t]);
    const frec = (CFG.sugerencias || SUGERENCIAS_BASE).frecuentes || [];
    const its = [...CATALOGO[t]].sort((a,b2) => { const ia = frec.indexOf(a.h), ib = frec.indexOf(b2.h); return (ia<0?99:ia) - (ib<0?99:ib); });
    const grupos = t === 'mat' ? [...new Set(CATALOGO.mat.map(i=>i.g))] : [null];
    const fila = it => `<div class="pick ${sel.has(it.h)?'on':''}" data-h="${esc(it.h)}"><span class="ck">✓</span><span class="nom">${esc(it.n)}<small>${esc(it.sub)}</small></span></div>`;
    const cuerpo = `<div class="mbody"><input id="pBus" placeholder="Buscar…" autocomplete="off">
      ${t==='mat' ? `<details class="gr" open data-mas><summary>Más usados</summary>${its.slice(0,6).map(fila).join('')}</details>${grupos.map(g => { const n = CATALOGO.mat.filter(i=>i.g===g && sel.has(i.h)).length;
            return `<details class="gr"><summary>${esc(g)}<span class="cnt">${n?n+' elegido(s)':''}</span></summary>${CATALOGO.mat.filter(i=>i.g===g).map(fila).join('')}</details>`; }).join('')}`
                  : its.map(fila).join('')}</div>`;
    const {o, cerrar} = ventana(t==='trab' ? 'Agregar trabajos' : 'Agregar materiales', cuerpo, `<button class="btn" data-listo>Listo</button>`);
    o.querySelector('.mbody').addEventListener('click', e => { const p = e.target.closest('.pick'); if(!p) return; const h = p.dataset.h;
      sel.has(h) ? sel.delete(h) : sel.add(h); o.querySelectorAll(`.pick[data-h="${CSS.escape(h)}"]`).forEach(x => x.classList.toggle('on', sel.has(h)));
      o.querySelectorAll('details.gr:not([data-mas])').forEach(g => { const n = g.querySelectorAll('.pick.on').length; g.querySelector('.cnt').textContent = n ? n+' elegido(s)' : ''; }); });
    o.querySelector('#pBus').addEventListener('input', e => { const q = e.target.value.toLowerCase();
      o.querySelectorAll('.pick').forEach(p => p.classList.toggle('hidden', !!q && !p.textContent.toLowerCase().includes(q)));
      o.querySelectorAll('details.gr').forEach(g => { const hay = !!g.querySelector('.pick:not(.hidden)');
        if(q){ g.open = hay; g.classList.toggle('hidden', !hay || g.hasAttribute('data-mas')); } else { g.classList.remove('hidden'); g.open = g.hasAttribute('data-mas'); } }); });
    o.querySelector('[data-listo]').onclick = () => {
      vis[t] = vis[t].filter(h => sel.has(h)).concat([...sel].filter(h => !vis[t].includes(h)));
      CATALOGO[t].forEach(i => { if(!sel.has(i.h)) d[i.h] = ''; });
      pintarListas(); autosave(); cerrar();
    };
  });
  if(!edit && !borr) aplicarSugerencias('', false);

  /* --- cierre --- */
  $('#bQr').onclick = () => escanearQR(v => { $('#fQr').value = v; toast('QR leído: ' + v); autosave(); });
  $('#fQr').addEventListener('change', e => { e.target.value = e.target.value.toUpperCase(); });
  document.querySelectorAll('#cTec .chip').forEach(b => b.onclick = () => { b.classList.toggle('on'); autosave(); });
  $('#bCanc').onclick = () => volver(edit ? '#ver/'+edit.id : '#');

  /* --- guardar --- */
  $('#bGuardar').onclick = async () => {
    leer();
    if(!completa(d['HORA FINAL'])) d['HORA FINAL'] = '';
    if(!d['OT']) d['OT'] = 'N/A';
    const req = [['FOLIO/OS','Folio'],['FALLA REPORTADA','Falla'],['COORDENADAS','Coordenadas'],['CLUSTER','Cluster'],['OLT','OLT'],['CAUSA DE DAÑO','Causa'],['TECNICO QUE ATIENDE','Técnicos']];
    const faltan = req.filter(([k])=>!d[k]).map(x=>x[1]);
    if(!completa(d['FECHA Y HORA DE ASIGNACIÓN'])) faltan.push('Fecha y hora de asignación');
    if(!completa(d['FECHA Y HORA DE LLEGADA'])) faltan.push('Fecha y hora de llegada');
    if(faltan.length){ $('#ferr').textContent = 'Falta: ' + faltan.join(', '); toast('Falta: '+faltan.join(', ')); return; }
    if(!/^(\d+|N\/A)$/.test(d['FOLIO/OS']) || !/^(\d+|N\/A)$/.test(d['OT'])){ toast('Folio y OT: solo números o N/A'); return; }
    if(!parseCoords(d['COORDENADAS'])){ toast('Coordenadas con formato incorrecto'); return; }
    if(d['FECHA Y HORA DE LLEGADA'] < d['FECHA Y HORA DE ASIGNACIÓN'] && !(await preguntar('La llegada es antes que la asignación. ¿Guardar así?','Guardar','Revisar'))) return;
    if(d['HORA FINAL'] && d['HORA FINAL'] < d['FECHA Y HORA DE LLEGADA'] && !(await preguntar('La hora final es antes que la llegada. ¿Guardar así?','Guardar','Revisar'))) return;
    const dup = d['FOLIO/OS'] !== 'N/A' && FOLIOS.find(f => f.d['FOLIO/OS']===d['FOLIO/OS'] && (!edit || f.id!==edit.id));
    if(dup && !(await preguntar(`Ya tienes el folio ${d['FOLIO/OS']} registrado. ¿Guardarlo de todos modos?`,'Guardar'))) return;
    const tecU = (CFG.usuarios||[]).find(u=>u.nombre===d['TECNICO QUE ATIENDE'].split(' , ')[0]);
    d['NÚMERO DEL TECNICO '] = (USER.rol==='TECNICO' ? USER.telefono : (tecU && tecU.telefono)) || d['NÚMERO DEL TECNICO '] || '';
    [...CATALOGO.trab, ...CATALOGO.mat].forEach(i => { if(!(parseFloat(d[i.h])>0)) d[i.h] = ''; });
    vis.trab = vis.trab.filter(h => d[h]); vis.mat = vis.mat.filter(h => d[h]);
    if(edit){ edit.d = d; edit.estado='pendiente'; edit.editado = new Date().toISOString(); edit.version=(edit.version||1)+1; }
    else FOLIOS.push({id:uuid(), usuario:USER.id, d, estado:'pendiente', creado:new Date().toISOString(), version:1, cuadrilla:USER.cuadrilla});
    const fid = edit ? edit.id : FOLIOS[FOLIOS.length-1].id;
    guardarFolios(); LS.del(CLAVE_BORRADOR());
    toast(navigator.onLine ? 'Guardado. Enviando…' : 'Guardado en el teléfono. Se enviará con señal.');
    if(edit) volver('#ver/'+fid); else reemplazar('#ver/'+fid);
    sincronizar();
  };
}

/* ===== Texto para WhatsApp ===== */
function textoWA(f){
  const d = f.d, v = k => d[k] ?? '';
  const L = [f.editado ? 'Folio corregido' : 'Nuevo Folio',
   `SD/OS: ${v('FOLIO/OS')}`, `OT: ${v('OT')||'N/A'}`, `ÁREA: ${v('ÁREA')}`, `Ciudad: ${v('CIUDAD')}`, `ESTADO: ${v('ESTADO')}`,
   `CLUSTER: ${v('CLUSTER')}`, `OLT: ${v('OLT')}`, `CLIENTES AFECTADOS: ${v('CLIENTES AFECTADOS')}`, `FALLA REPORTADA: ${v('FALLA REPORTADA')}`,
   `FECHA DE ASIGNACIÓN: ${fmtFecha(v('FECHA Y HORA DE ASIGNACIÓN'))}`, `FECHA DE LLEGADA: ${fmtFecha(v('FECHA Y HORA DE LLEGADA'))}`,
   `CAUSA DE DAÑO: ${v('CAUSA DE DAÑO')}`, `UBICACIÓN: ${v('UBICACIÓN DEL DAÑO')}`, `COORDENADAS: ${v('COORDENADAS')}`,
   `ACTIVIDADES: ${v('DESCIPCIÓN DE ACTIVIDADES')}`, `POTENCIA INICIAL: ${v('POTENCIA INICIAL')}`, `POTENCIA FINAL: ${v('POTENCIA FINAL')}`,
   `HORA FINAL: ${fmtFecha(v('HORA FINAL'))}`, 'TRABAJOS REALIZADOS: '];
  CONCEPTOS.forEach(([h]) => L.push(`${h.replace(/\s+/g,' ')}: ${v(h)}`));
  L.push(`QR SEGUNDO NIVEL: ${v('QR SEGUNDO NIVEL')}`, `TÉCNICO QUE ATIENDE: ${v('TECNICO QUE ATIENDE')}`, `PROVEEDOR: ${v('PROVEEDOR')}`,
   `SUPERVISOR TOTALPLAY: ${v('SUPERVISOR DISTRITO')}`, `TIPO DE MANTENIMINETO: ${v('TIPO DE MANTENIMIENTO')}`, 'MATERIAL UTILIZADO: ');
  MATERIALES.forEach(([h]) => L.push(`${h.replace(/\s+/g,' ').trim().replace(/"/g,'')}: ${v(h)}`));
  return L.join('\n');
}

function pantallaVer(id){
  const f = FOLIOS.find(x=>x.id===id); if(!f || !(veTodo() || esMio(f))){ reemplazar('#folios'); return; }
  $('#titulo').textContent = 'Folio ' + f.d['FOLIO/OS'];
  const txt = textoWA(f), ed = puedeEditar(f);
  $('#app').innerHTML = `<div class="card"><div class="lista"><div class="f"><b>${esc(f.d['FOLIO/OS'])}</b><span class="estado ${f.estado}">${{pendiente:'Por enviar',enviado:'Enviado a Sheets',error:'Error al enviar'}[f.estado]}</span></div></div>
     ${f.estado==='error'?`<div class="hint err">${esc(f.error)}</div>`:''}${f.aviso?`<div class="hint warn">${esc(f.aviso)}</div>`:''}
     ${f.estado==='pendiente'?'<div class="hint">Está guardado en el teléfono. Se envía solo cuando haya señal.</div>':''}</div>
   <div class="card"><h2>Texto para WhatsApp</h2><pre class="wa" id="wa">${esc(txt)}</pre>
     <button class="btn verde" id="bShare">Compartir por WhatsApp</button><button class="btn ghost" id="bCopy">Copiar texto</button></div>
   ${ed?'':`<div class="card"><div class="hint">Ya pasaron ${HORAS_EDICION} h; para corregirlo pide al supervisor.</div></div>`}`;
  $('#bar').classList.remove('hidden');
  $('#bar').innerHTML = `<button class="btn ghost" onclick="volver('#folios')">Regresar</button>${ed?`<button class="btn" onclick="ir('#editar/${f.id}')">Corregir</button>`:''}`;
  $('#bCopy').onclick = async () => { try{ await navigator.clipboard.writeText(txt); toast('Texto copiado'); }catch(e){ const r=document.createRange(); r.selectNode($('#wa')); getSelection().removeAllRanges(); getSelection().addRange(r); document.execCommand('copy'); toast('Texto copiado'); } };
  $('#bShare').onclick = async () => {
    if(navigator.share){ try{ await navigator.share({text:txt}); return; }catch(e){ if(e.name==='AbortError') return; } }
    location.href = 'https://wa.me/?text=' + encodeURIComponent(txt);
  };
}

/* ===== Inicio ===== */
$('#btnSync').onclick = () => sincronizar(true);
$('#btnSalir').onclick = async () => {
  const n = FOLIOS.filter(f=>f.estado!=='enviado' && esMio(f)).length;
  if(!(await preguntar(n ? `Hay ${n} folio(s) sin enviar. Se quedan guardados en este teléfono y se envían cuando vuelvas a entrar. ¿Salir?` : '¿Cerrar sesión?','Salir'))) return;
  if(!n){ const cr = LS.get('creds', {}); delete cr[USER.id]; LS.set('creds', cr); }
  USER=null; LS.del('usuario'); reemplazar('#');
};
if(USER) USER.nombre = MAY(USER.nombre);
if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
history.replaceState({n:0, raiz:1}, '', location.href.split('#')[0] + '#');
history.pushState({n:0, guardia:1}, '', location.href);
LS.del('borrador');   // borrador de la versión 0.2 (sin usuario)
router(); pintarPendientes(); bajarConfig().then(()=>{ if(!USER) refrescarLogin(); }); sincronizar();
</script>
